# Local PostgreSQL for database mode (FEATURE_ENABLE_DATABASE=true).
# The same major version as Neon. Credentials match the defaults in
# planner-api's application.yml, so the API needs no DB_* variables locally.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
    ports:
      - "5432:5432"
    volumes:
      - planner-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  planner-postgres:
