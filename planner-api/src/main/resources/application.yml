spring:
  application:
    name: planner-api
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
  # Only read in database mode. With feature-enable-database off,
  # DatabaseModeEnvironment excludes every DataSource and Flyway
  # auto-configuration, so none of this is ever used or connected to.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/planner}
    username: ${DB_USER:planner}
    password: ${DB_PASSWORD:planner}   # local-dev default, matches compose.yaml
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      # An idle pool must not keep Neon awake: it sleeps after five idle
      # minutes, and held connections would spend the free tier's CU-hours.
      minimum-idle: 0
      # Milliseconds, as numbers — Hikari's setters take a long, not "30s".
      idle-timeout: 30000
      # Room for Neon to wake from sleep on the first request.
      connection-timeout: 30000
  flyway:
    # Schema only: migrations never insert, update or delete rows.
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  # Cloud Run sends SIGTERM before stopping an instance; let requests drain.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # Mail is only contacted in smtp mode; probing it would otherwise report
    # the whole app as DOWN whenever no local mail server is running.
    mail:
      enabled: false

# Off by default: all records are written as YAML files under app.storage.root.
# On, every record lives in PostgreSQL (spring.datasource above) and Flyway
# applies db/migration at startup. See FeatureFlags and DatabaseModeEnvironment.
feature-enable-database: ${FEATURE_ENABLE_DATABASE:false}

app:
  storage:
    root: ${DATA_DIR:./data}
  publish:
    dir: ${PUBLISH_DIR:./data/published}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080/p}
    # filesystem | r2 — where published pages are written. Independent of the
    # database flag, so local development keeps writing files.
    store: ${PUBLISH_STORE:filesystem}
  # Cloudflare R2, only read when app.publish.store=r2.
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    bucket: ${R2_BUCKET:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  proxy:
    # Shared secret the Cloudflare proxy adds to every request. Set only in
    # the cloud; empty locally.
    secret: ${PROXY_SECRET:}
  import:
    # The one-off YAML -> PostgreSQL import runs only when this is set, and
    # only in database mode.
    yaml-dir: ${IMPORT_YAML_DIR:}
    dry-run: ${IMPORT_DRY_RUN:false}
  mail:
    # log | file | smtp. "file" drops .eml files in data/outbox so you can read
    # a new member's default password in local development.
    mode: ${MAIL_MODE:file}
    from: ${MAIL_FROM:no-reply@travel-planner.local}
  security:
    jwt-secret: ${JWT_SECRET:}
    session-ttl: 12h
    cookie-secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  geocoding:
    base-url: https://countries.dev
    timeout: 5s
    city-limit: 8
    place-limit: 20
  weather:
    forecast-base-url: https://api.open-meteo.com/v1
    climate-base-url: https://climate-api.open-meteo.com/v1
    timeout: 8s
    climate-model: MRI_AGCM3_2_S
    horizon-days: 14
    history-days: 85
    cache-ttl: 12h
  rates:
    base-url: https://open.er-api.com
    base: EUR
    # Daily, an hour after the provider's own update (~00:30 UTC).
    cron: ${RATES_CRON:0 30 1 * * *}
    timeout: 10s
  bootstrap:
    owner-email: ${BOOTSTRAP_OWNER_EMAIL:}
    owner-password: ${BOOTSTRAP_OWNER_PASSWORD:}
  currencies:
    defaults: [EUR, USD, SGD]
    default-display: ${DEFAULT_DISPLAY_CURRENCY:EUR}
    available: [AUD, BRL, CAD, CHF, CLP, CNY, COP, CZK, DKK, EUR, GBP, HKD, HUF,
                IDR, ILS, INR, ISK, JPY, KRW, MXN, MYR, NOK, NZD, PEN, PHP, PLN,
                RON, SEK, SGD, THB, TRY, TWD, USD, VND, ZAR]

logging:
  level:
    com.josephinealinea.planner: INFO
