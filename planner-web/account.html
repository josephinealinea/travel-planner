<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="account.accountTravellingLlama">Account — Travelling Llama</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%99%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/minima.css?v=78"     id="minima-css">
<link rel="stylesheet" href="assets/css/y2k.css?v=78"        id="y2k-css"        disabled>
<link rel="stylesheet" href="assets/css/dark.css?v=78"       id="dark-css"       disabled>
<script>
  // Enable the remembered theme's stylesheet before first paint, so the page
  // never flashes the default theme first.
  (function () {
    var registry = { minima: 'minima-css', y2k: 'y2k-css', dark: 'dark-css' };
    var theme = 'minima';
    try { if (registry[localStorage.getItem('selectedTheme')]) theme = localStorage.getItem('selectedTheme'); } catch (e) {}
    Object.keys(registry).forEach(function (name) {
      var link = document.getElementById(registry[name]);
      if (link) link.disabled = name !== theme;
    });
    document.documentElement.className = 'theme-' + theme;
  })();
</script>
</head>
<body>
<header id="site-header"></header>

<main class="page-narrow">
  <h1 class="page-title" data-i18n="account.account"></h1>

  <div class="stack-lg">
    <section class="card">
      <div class="card-header"><h2 class="card-title" data-i18n="account.profile"></h2></div>
      <div id="profile-alert" class="alert" hidden></div>

      <form id="profile-form" novalidate>
        <div class="field">
          <label for="email" data-i18n="common.email"></label>
          <input id="email" type="email" autocomplete="email">
          <p class="field-hint" data-i18n="account.thisIsWhatYou"></p>
        </div>
        <div class="field">
          <label for="screenName" data-i18n="common.screenName"></label>
          <input id="screenName" type="text" maxlength="60" autocomplete="nickname">
          <p class="field-hint" data-i18n="account.whatTheHerdCan"></p>
        </div>
        <div class="field autocomplete">
          <label for="homeCountry" data-i18n="account.countryOfResidence"></label>
          <input id="homeCountry" type="text" autocomplete="off" data-i18n-placeholder="common.startTypingPeru"
                 role="combobox" aria-expanded="false" aria-controls="homeCountryList">
          <ul class="autocomplete-list" id="homeCountryList" role="listbox" hidden></ul>
          <p class="field-hint" data-i18n="account.shownBesideYourName"></p>
        </div>
        <div class="btn-row">
          <button type="submit" class="btn btn-primary" id="save-profile" data-i18n="account.saveProfile"></button>
        </div>
        <!-- Its own row, apart from Save: a destructive action should not sit
             beside the primary one where a fingertip can hit either. -->
        <div class="danger-zone">
          <button type="button" class="btn btn-danger" id="remove-email" data-i18n="account.deactivateAndRemoveMy"></button>
        </div>
      </form>
      <div id="remove-email-confirm" class="alert alert-warning" role="alert" hidden>
        <p class="small" data-i18n="account.thisRemovesYourEmail"></p>
        <div class="btn-row">
          <button type="button" class="btn btn-danger" id="confirm-remove-email" data-i18n="account.yesRemoveMyData"></button>
          <button type="button" class="btn" id="cancel-remove-email" data-i18n="common.cancel"></button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-header"><h2 class="card-title" data-i18n="common.password"></h2></div>
      <div id="password-alert" class="alert" hidden></div>

      <form id="password-form" novalidate>
        <div class="field">
          <label for="current" data-i18n="common.currentPassword"></label>
          <div class="password-field">
            <input id="current" type="password" autocomplete="current-password" required>
          </div>
        </div>
        <div class="field">
          <label for="next" data-i18n="common.newPassword"></label>
          <div class="password-field">
            <input id="next" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <div class="password-strength" id="strength" data-score="0" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
          <p class="field-hint" data-i18n="common.atLeast8Characters"></p>
        </div>
        <div class="field">
          <label for="confirm" data-i18n="common.confirmNewPassword"></label>
          <div class="password-field">
            <input id="confirm" type="password" autocomplete="new-password" required>
          </div>
          <p class="field-error" id="mismatch" hidden data-i18n="account.passwordsDoNotMatch"></p>
        </div>
        <button type="submit" class="btn btn-primary" id="save-password" data-i18n="account.changePassword"></button>
      </form>
    </section>

    <section class="card">
      <div class="card-header"><h2 class="card-title" data-i18n="account.appearance"></h2></div>

      <div class="field">
        <label for="language" data-i18n="account.language"></label>
        <select id="language" class="control-narrow"></select>
        <p class="field-hint" data-i18n="account.languageHint"></p>
      </div>

      <div class="field">
        <span class="label" data-i18n="account.theme"></span>
        <!-- localStorage, unlike the settings below, which are on the
             account — so the caption sits here rather than on the card. -->
        <p class="small muted" style="margin:0 0 8px" data-i18n="account.rememberedInThisBrowser"></p>
        <div id="theme-radios" class="stack-sm"></div>
      </div>

      <div class="field">
        <label for="budget-page-size" data-i18n="account.paginationExpenseRecordsIn"></label>
        <select id="budget-page-size" class="control-narrow"></select>
        <p class="field-hint" data-i18n="account.appliesTheNextTime"></p>
      </div>

      <div class="field">
        <span class="label" data-i18n="account.publishedPage"></span>
        <p class="small muted" style="margin:0 0 8px" data-i18n="account.savedToYourAccount"></p>
        <div id="published-page-alert" class="alert" hidden></div>
        <div id="published-page-settings" class="stack-sm"></div>
      </div>
    </section>

    <section class="card">
      <div class="card-header"><h2 class="card-title" data-i18n="account.currencies"></h2></div>
      <div id="currency-alert" class="alert" hidden></div>

      <div class="field">
        <label for="display-currency" data-i18n="account.yourAllowedCurrencies"></label>
        <div id="currency-chips" class="chip-group" style="margin-bottom:12px"></div>
        <form id="currency-form" class="field-inline">
          <div class="field grow field-narrow">
            <label for="new-currency" data-i18n="account.addANewCurrency"></label>
            <select id="new-currency"></select>
          </div>
          <div class="field flex-none" style="align-self:flex-start;padding-top:22px">
            <button type="submit" class="btn" id="add-currency" data-i18n="account.add"></button>
          </div>
        </form>
        <p class="field-hint" data-i18n="account.offeredWhenYouRecord"></p>
      </div>

      <div class="field">
        <label for="display-currency" data-i18n="account.showYourTotalTravel"></label>
        <select id="display-currency" class="control-narrow"></select>
        <p class="field-hint" data-i18n="account.theAmountPresentedIs"></p>
      </div>

      <button type="button" class="btn btn-primary" id="save-currencies" data-i18n="account.saveCurrencies"></button>
    </section>
  </div>
</main>

<footer id="site-footer"></footer>

<script type="module">
  import { api } from './js/api.js';
  import { initI18n, useAccountLanguage, setLanguage, t } from './js/i18n/index.js';
  import { countryOptions, countryName } from './js/countries.js';
  import { renderChrome, escapeHtml } from './js/chrome.js';
  import { requireUser, clearCachedUser } from './js/session.js';
  import { passwordScore } from './js/password-toggle.js';
  import { THEME_REGISTRY, THEME_NAMES, applyTheme, savedTheme } from './js/theme-selector.js';
  import { toast } from './js/toast.js';
  import { BUDGET_PAGE_SIZES, savedBudgetPageSize, saveBudgetPageSize } from './js/page-size.js';

  await initI18n();
  await api.initCsrf();
  const user = await requireUser();
  if (!user) throw new Error('redirecting');
  await useAccountLanguage(user);

  renderChrome({ user, active: 'account' });

  document.querySelector('#email').value = user.email;
  document.querySelector('#screenName').value = user.screenName || '';

  // A typeable picker like the destination form's Country field: only a real
  // country name may come out of it, so text that matches nothing snaps back.
  const homeCountry = document.querySelector('#homeCountry');
  const homeList = document.querySelector('#homeCountryList');
  // Names come from the shared table (js/countries.js); only the code is saved.
  const countries = countryOptions();
  let chosenCode = user.homeCountryCode || '';
  homeCountry.value = countryName(chosenCode);

  function countryMatches() {
    const query = homeCountry.value.trim().toLowerCase();
    if (!query) return countries.slice(0, 8);
    const starts = [];
    const contains = [];
    for (const c of countries) {
      const name = c.name.toLowerCase();
      if (name.startsWith(query) || c.code.toLowerCase() === query) starts.push(c);
      else if (name.includes(query)) contains.push(c);
    }
    return [...starts, ...contains].slice(0, 8);
  }
  function closeCountryList() {
    homeList.hidden = true;
    homeCountry.setAttribute('aria-expanded', 'false');
  }
  function pickCountry(country) {
    chosenCode = country.code;
    homeCountry.value = country.name;
    closeCountryList();
  }
  function showCountryList() {
    const matches = countryMatches();
    homeList.replaceChildren(...matches.map((country) => {
      const li = document.createElement('li');
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'autocomplete-option';
      button.tabIndex = -1;
      button.innerHTML = '<span class="autocomplete-name"></span><span class="autocomplete-meta"></span>';
      button.firstChild.textContent = `${country.flag || ''} ${country.name}`.trim();
      button.lastChild.textContent = country.code;
      button.addEventListener('mousedown', (e) => e.preventDefault());
      button.addEventListener('click', () => pickCountry(country));
      li.append(button);
      return li;
    }));
    homeList.hidden = !matches.length;
    homeCountry.setAttribute('aria-expanded', String(!!matches.length));
  }
  homeCountry.addEventListener('input', showCountryList);
  homeCountry.addEventListener('focus', showCountryList);
  homeCountry.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCountryList(); });
  homeCountry.addEventListener('blur', () => {
    closeCountryList();
    const query = homeCountry.value.trim().toLowerCase();
    if (!query) { chosenCode = ''; homeCountry.value = ''; return; }
    const exact = countries.find((c) => c.name.toLowerCase() === query || c.code.toLowerCase() === query);
    const matches = countryMatches();
    const found = exact || (matches.length === 1 ? matches[0] : null);
    if (found) pickCountry(found);
    else homeCountry.value = countryName(chosenCode);
  });

  function alertIn(selector, message, variant) {
    const box = document.querySelector(selector);
    box.className = `alert alert-${variant}`;
    box.textContent = message;
    box.hidden = false;
  }

  // ── profile ───────────────────────────────────────
  const profileForm = document.querySelector('#profile-form');
  profileForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    homeCountry.dispatchEvent(new Event('blur')); // settle half-typed text
    const button = document.querySelector('#save-profile');
    button.disabled = true;
    try {
      const updated = await api.updateProfile({
        screenName: document.querySelector('#screenName').value.trim(),
        homeCountryCode: chosenCode,
        email: document.querySelector('#email').value.trim(),
      });
      clearCachedUser();
      alertIn('#profile-alert', t('account.saved'), 'info');
      toast.success(t('account.profileUpdated'));
      renderChrome({ user: updated, active: 'account' });
    } catch (error) {
      alertIn('#profile-alert', error.fullMessage, 'error');
    } finally {
      button.disabled = false;
    }
  });

  // ── remove email ──────────────────────────────────
  const removeConfirm = document.querySelector('#remove-email-confirm');
  document.querySelector('#remove-email').addEventListener('click', () => {
    removeConfirm.hidden = false;
    document.querySelector('#cancel-remove-email').focus();
  });
  document.querySelector('#cancel-remove-email').addEventListener('click', () => {
    removeConfirm.hidden = true;
    document.querySelector('#remove-email').focus();
  });
  document.querySelector('#confirm-remove-email').addEventListener('click', async (event) => {
    event.target.disabled = true;
    try {
      await api.deactivateEmail();
      clearCachedUser();
      location.href = 'login.html';
    } catch (error) {
      event.target.disabled = false;
      alertIn('#profile-alert', error.fullMessage, 'error');
    }
  });

  // ── password ──────────────────────────────────────
  const next = document.querySelector('#next');
  const confirmField = document.querySelector('#confirm');
  const strength = document.querySelector('#strength');
  const mismatch = document.querySelector('#mismatch');

  next.addEventListener('input', () => {
    strength.dataset.score = String(passwordScore(next.value));
    mismatch.hidden = !confirmField.value || confirmField.value === next.value;
  });
  confirmField.addEventListener('input', () => {
    mismatch.hidden = !confirmField.value || confirmField.value === next.value;
  });

  document.querySelector('#password-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    if (next.value !== confirmField.value) {
      mismatch.hidden = false;
      confirmField.focus();
      return;
    }
    const button = document.querySelector('#save-password');
    button.disabled = true;
    try {
      await api.changePassword({
        currentPassword: document.querySelector('#current').value,
        newPassword: next.value,
      });
      clearCachedUser();
      document.querySelector('#password-form').reset();
      strength.dataset.score = '0';
      alertIn('#password-alert', t('account.passwordChangedNote'), 'info');
      toast.success(t('account.passwordChanged'));
    } catch (error) {
      alertIn('#password-alert', error.fullMessage, 'error');
    } finally {
      button.disabled = false;
    }
  });

  // ── language ──────────────────────────────────────
  // Kept on the account, so the API, the emails and published pages follow it
  // too. "Automatic" clears it, and this browser's remembered choice with it,
  // so the browser's own language decides again.
  const languageSelect = document.querySelector('#language');
  const { languages = [] } = await api.config().catch(() => ({}));
  languageSelect.innerHTML = [
    `<option value="">${escapeHtml(t('account.languageAutomatic'))}</option>`,
    ...languages.map((language) => `<option value="${escapeHtml(language.code)}">${escapeHtml(language.name)}</option>`),
  ].join('');
  languageSelect.value = user.languageCode || '';
  languageSelect.addEventListener('change', async () => {
    languageSelect.disabled = true;
    try {
      await api.updateLanguage({ languageCode: languageSelect.value });
      clearCachedUser();
      await setLanguage(languageSelect.value, { persist: true });
      // Every string is read once as the page draws, so reloading is the one
      // way to be sure nothing is left in the old language.
      location.reload();
    } catch (error) {
      toast.error(error.fullMessage);
      languageSelect.value = user.languageCode || '';
      languageSelect.disabled = false;
    }
  });

  // ── appearance ────────────────────────────────────
  const radios = document.querySelector('#theme-radios');
  radios.innerHTML = THEME_NAMES.map((name) => `
    <label class="checkbox">
      <input type="radio" name="theme" value="${name}" ${name === savedTheme() ? 'checked' : ''}>
      <span class="theme-swatch" style="background:${THEME_REGISTRY[name].swatch}"></span>
      ${escapeHtml(THEME_REGISTRY[name].labelFull)}
    </label>`).join('');

  radios.addEventListener('change', (event) => {
    if (event.target.name === 'theme') applyTheme(event.target.value);
  });

  // Keep the radios in step when the header selector is used instead.
  document.addEventListener('themechange', (event) => {
    const radio = radios.querySelector(`input[value="${event.detail.theme}"]`);
    if (radio) radio.checked = true;
  });

  // Budget rows per page — localStorage like the theme, read by the trip page
  // when it loads, so a change applies the next time a trip is opened.
  const pageSizeSelect = document.querySelector('#budget-page-size');
  pageSizeSelect.innerHTML = BUDGET_PAGE_SIZES
    .map((size) => `<option value="${size}">${size}</option>`).join('');
  pageSizeSelect.value = String(savedBudgetPageSize());
  pageSizeSelect.addEventListener('change', () => {
    pageSizeSelect.value = String(saveBudgetPageSize(pageSizeSelect.value));
  });

  // ── published page ────────────────────────────────
  // Every one of these is a flag defaulting to off: a published page is
  // public, so anything extra it reveals is asked for rather than assumed.
  const PUBLISHED_PAGE_SETTINGS = [
    { key: 'displayHomeCountry', label: t('account.publish.displayHomeCountry') },
    { key: 'destinationDays', label: t('account.publish.destinationDays') },
    { key: 'itineraryCost', label: t('account.publish.itineraryCost') },
    { key: 'displayBudget', label: t('account.publish.displayBudget') },
    { key: 'forecastExpenses', label: t('account.publish.forecastExpenses') },
  ];

  const publishedPageBox = document.querySelector('#published-page-settings');
  const publishedPageAlert = document.querySelector('#published-page-alert');
  let publishedPage = { ...(user.publishedPage || {}) };

  function renderPublishedPage() {
    publishedPageBox.innerHTML = PUBLISHED_PAGE_SETTINGS.map((setting) => `
      <label class="checkbox">
        <input type="checkbox" data-setting="${setting.key}"
               ${publishedPage[setting.key] ? 'checked' : ''}>
        ${escapeHtml(setting.label)}
      </label>`).join('');
  }
  renderPublishedPage();

  publishedPageBox.addEventListener('change', async (event) => {
    const box = event.target.closest('input[data-setting]');
    if (!box) return;
    const key = box.dataset.setting;
    const wanted = box.checked;

    publishedPageAlert.hidden = true;
    try {
      // Only the one that changed is sent; the API leaves the rest alone.
      const updated = await api.updatePublishedPage({ [key]: wanted });
      // Deliberately no re-render: the box the member just clicked is already
      // showing the right thing, and rebuilding the group with innerHTML would
      // replace that element underneath them — losing keyboard focus, and
      // swapping the node mid-interaction if they tick two in quick
      // succession. Only a failure needs the DOM corrected, below.
      publishedPage = { ...(updated.publishedPage || {}) };
      toast.success(t('account.publishedPageSaved'));
    } catch (error) {
      // Put the box back: it is showing a change that did not happen.
      box.checked = !wanted;
      publishedPageAlert.textContent = error.fullMessage;
      publishedPageAlert.hidden = false;
    }
  });

  // ── currencies ──────────────────────────
  let currencyDraft = [...(user.currencies || [])];

  // The catalogue comes from the API rather than a list kept here, so
  // application.yml stays the one place it is configured.
  let currencyCatalogue = [];
  try {
    currencyCatalogue = (await api.config()).currencies || [];
  } catch {
    // Offline or an older API: fall back to what this account already has, so
    // the page still works and simply offers nothing new to add.
    currencyCatalogue = [...currencyDraft];
  }

  /** Only what is not already on the list — adding a duplicate is not a thing. */
  function renderCurrencyChoices() {
    const select = document.querySelector('#new-currency');
    const remaining = currencyCatalogue.filter((code) => !currencyDraft.includes(code));
    select.innerHTML = remaining.length
      ? remaining.map((code) => `<option value="${escapeHtml(code)}">${escapeHtml(code)}</option>`).join('')
      : `<option value="">${escapeHtml(t('account.everyCurrencyOnList'))}</option>`;
    select.disabled = !remaining.length;
    document.querySelector('#add-currency').disabled = !remaining.length;
  }

  function renderCurrencyChips() {
    const box = document.querySelector('#currency-chips');
    box.innerHTML = currencyDraft.length
      ? currencyDraft.map((code) => `
          <span class="chip">
            ${escapeHtml(code)}
            <button type="button" class="chip-remove" data-code="${escapeHtml(code)}"
                    aria-label="${escapeHtml(t('account.removeCode', { code }))}">✕</button>
          </span>`).join('')
      : `<span class="small muted">${escapeHtml(t('account.noCurrenciesYet'))}</span>`;
  }
  renderCurrencyChips();
  renderCurrencyChoices();

  document.querySelector('#currency-chips').addEventListener('click', (event) => {
    const code = event.target.closest('.chip-remove')?.dataset.code;
    if (!code) return;
    currencyDraft = currencyDraft.filter((c) => c !== code);
    renderCurrencyChips();
    renderCurrencyChoices();
    renderDisplayCurrencyOptions();
  });

  document.querySelector('#currency-form').addEventListener('submit', (event) => {
    event.preventDefault();
    const code = document.querySelector('#new-currency').value;
    if (!code || currencyDraft.includes(code)) return;
    currencyDraft.push(code);
    currencyDraft.sort();
    renderCurrencyChips();
    renderCurrencyChoices();
    renderDisplayCurrencyOptions();
  });

  const displayCurrencySelect = document.querySelector('#display-currency');

  /**
   * Keeps the "show totals in" options in step with the chips above it, so the
   * dropdown can never offer a currency the draft no longer has.
   *
   * The current value is always kept as an option even when it is not in the
   * draft — a select whose value matches no option silently falls back to the
   * first one, which is how a member ends up saving a currency they never
   * chose. Same mismatch the trip workspace's entryCurrencies guards against.
   */
  function renderDisplayCurrencyOptions() {
    const chosen = displayCurrencySelect.value || user.displayCurrency || '';
    const options = [...currencyDraft];
    if (chosen && !options.includes(chosen)) options.push(chosen);
    // An account from before this field existed, with an empty currency list.
    if (!options.length) options.push('EUR');

    displayCurrencySelect.innerHTML = options
      .map((code) => `<option value="${escapeHtml(code)}">${escapeHtml(code)}</option>`).join('');
    displayCurrencySelect.value = options.includes(chosen) ? chosen : options[0];
  }
  renderDisplayCurrencyOptions();

  // One button saves both halves: the list and the currency picked out of it
  // are one setting as far as anyone using this page is concerned.
  document.querySelector('#save-currencies').addEventListener('click', async () => {
    const button = document.querySelector('#save-currencies');
    button.disabled = true;
    try {
      await api.updateCurrencies({ currencies: currencyDraft });
      const updated = await api.updateDisplayCurrency({
        displayCurrency: displayCurrencySelect.value,
      });
      clearCachedUser();
      alertIn('#currency-alert', t('account.saved'), 'info');
      toast.success(t('account.currenciesUpdated'));
      renderChrome({ user: updated, active: 'account' });
    } catch (error) {
      alertIn('#currency-alert', error.fullMessage, 'error');
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
