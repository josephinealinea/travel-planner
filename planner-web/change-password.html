<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="changepassword.setYourPasswordTravelling">Set your password — Travelling Llama</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%99%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/minima.css?v=78"     id="minima-css">
<link rel="stylesheet" href="assets/css/y2k.css?v=78"        id="y2k-css"        disabled>
<link rel="stylesheet" href="assets/css/dark.css?v=78"       id="dark-css"       disabled>
<script>
  // Enable the remembered theme's stylesheet before first paint, so the page
  // never flashes the default theme first.
  (function () {
    var registry = { minima: 'minima-css', y2k: 'y2k-css', dark: 'dark-css' };
    var theme = 'minima';
    try { if (registry[localStorage.getItem('selectedTheme')]) theme = localStorage.getItem('selectedTheme'); } catch (e) {}
    Object.keys(registry).forEach(function (name) {
      var link = document.getElementById(registry[name]);
      if (link) link.disabled = name !== theme;
    });
    document.documentElement.className = 'theme-' + theme;
  })();
</script>
</head>
<body>
<header id="site-header"></header>

<main class="page-narrow auth-wrap">
  <!-- First sign-in only: the first screen an invited friend ever sees. Hidden
       until the script knows which case this is, so someone changing their
       password from Account never sees it flash. -->
  <div id="welcome" hidden>
    <div class="auth-logo" aria-hidden="true">🦙</div>
    <p class="auth-brand" data-i18n="changepassword.welcomeToTravellingLlama"></p>
  </div>
  <h1 class="auth-title" id="title" data-i18n="changepassword.setYourPassword"></h1>
  <p class="auth-subtitle" id="subtitle" data-i18n="changepassword.youSignedInWith"></p>

  <div class="card">
    <div id="error" class="alert alert-error" hidden></div>

    <form id="form" novalidate>
      <div class="field">
        <label for="current" data-i18n="common.currentPassword"></label>
        <div class="password-field">
          <input id="current" type="password" autocomplete="current-password" required autofocus>
        </div>
        <p class="field-hint" data-i18n="changepassword.theTemporaryPasswordFrom"></p>
      </div>

      <div class="field">
        <label for="next" data-i18n="common.newPassword"></label>
        <div class="password-field">
          <input id="next" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="password-strength" id="strength" data-score="0" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
        <p class="field-hint" id="strength-hint" data-i18n="common.atLeast8Characters"></p>
      </div>

      <div class="field">
        <label for="confirm" data-i18n="common.confirmNewPassword"></label>
        <div class="password-field">
          <input id="confirm" type="password" autocomplete="new-password" required>
        </div>
        <p class="field-error" id="mismatch" hidden data-i18n="changepassword.thoseTwoPasswordsDo"></p>
      </div>

      <div class="field" id="screen-name-field">
        <label for="screenName" data-i18n="common.screenName"></label>
        <input id="screenName" type="text" maxlength="60" autocomplete="nickname">
        <p class="field-hint" data-i18n="changepassword.thisIsWhatYour"></p>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submit" data-i18n="changepassword.saveAndContinue"></button>
    </form>
  </div>

  <p class="auth-footnote">
    <button type="button" class="btn-link" id="sign-out-link" data-i18n="changepassword.signOut"></button>
  </p>
</main>

<footer id="site-footer"></footer>

<script type="module">
  import { api } from './js/api.js';
  import { initI18n, useAccountLanguage, t } from './js/i18n/index.js';
  import { renderChrome } from './js/chrome.js';
  import { currentUser, signOut, clearCachedUser } from './js/session.js';
  import { passwordScore } from './js/password-toggle.js';
  import { toast } from './js/toast.js';

  await initI18n();
  await api.initCsrf();
  const user = await currentUser();
  if (!user) location.href = 'login.html';
  await useAccountLanguage(user);

  // Reachable both as the forced first-run screen and voluntarily from Account.
  const forced = user.mustChangePassword;
  renderChrome({ user, minimal: forced });

  if (forced) document.querySelector('#welcome').hidden = false;

  if (!forced) {
    // The first-run wording was filled in by renderChrome; this is the voluntary
    // version, so name the other key as well as showing it.
    for (const [selector, key] of [['#title', 'changepassword.changeYourPassword'], ['#subtitle', 'changepassword.chooseANewPassword']]) {
      const el = document.querySelector(selector);
      el.dataset.i18n = key;
      el.textContent = t(key);
    }
    document.querySelector('#current').nextElementSibling?.remove();
    document.querySelector('#current').closest('.field').querySelector('.field-hint')?.remove();
  }

  // Only ask for a screen name while they do not have one.
  if (user.screenName) {
    document.querySelector('#screen-name-field').hidden = true;
  }

  const form = document.querySelector('#form');
  const errorBox = document.querySelector('#error');
  const submit = document.querySelector('#submit');
  const next = document.querySelector('#next');
  const confirm = document.querySelector('#confirm');
  const strength = document.querySelector('#strength');
  const mismatch = document.querySelector('#mismatch');

  next.addEventListener('input', () => {
    strength.dataset.score = String(passwordScore(next.value));
  });

  const checkMatch = () => {
    mismatch.hidden = !confirm.value || confirm.value === next.value;
  };
  confirm.addEventListener('input', checkMatch);
  next.addEventListener('input', checkMatch);

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errorBox.hidden = true;

    if (next.value !== confirm.value) {
      mismatch.hidden = false;
      confirm.focus();
      return;
    }
    if (next.value.length < 8) {
      errorBox.textContent = t('changepassword.tooShort');
      errorBox.hidden = false;
      return;
    }

    submit.disabled = true;
    submit.textContent = t('common.saving');

    const screenName = document.querySelector('#screenName').value.trim();
    try {
      await api.changePassword({
        currentPassword: document.querySelector('#current').value,
        newPassword: next.value,
        screenName: screenName || undefined,
      });
      clearCachedUser();
      toast.success(t('changepassword.updated'));
      location.href = forced ? 'trips.html' : 'account.html';
    } catch (error) {
      errorBox.textContent = error.fullMessage;
      errorBox.hidden = false;
      submit.disabled = false;
      submit.textContent = t('changepassword.saveAndContinue');
    }
  });

  document.querySelector('#sign-out-link').addEventListener('click', signOut);
</script>
</body>
</html>
