<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travelling Llama — your travel buddy for planning trips</title>
<meta name="description" content="Your travel buddy for planning trips: destinations, checklist, itinerary and a shared budget, then publish the plan when you are ready.">
<meta property="og:site_name" content="Travelling Llama">
<meta property="og:title" content="🦙 Travelling Llama">
<meta property="og:description" content="Your travel buddy for planning trips.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://travellingllama.fun/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%99%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/minima.css?v=75"     id="minima-css">
<link rel="stylesheet" href="assets/css/y2k.css?v=75"        id="y2k-css"        disabled>
<link rel="stylesheet" href="assets/css/dark.css?v=75"       id="dark-css"       disabled>
<script>
  // Enable the remembered theme's stylesheet before first paint, so the page
  // never flashes the default theme first.
  (function () {
    var registry = { minima: 'minima-css', y2k: 'y2k-css', dark: 'dark-css' };
    var theme = 'minima';
    try { if (registry[localStorage.getItem('selectedTheme')]) theme = localStorage.getItem('selectedTheme'); } catch (e) {}
    Object.keys(registry).forEach(function (name) {
      var link = document.getElementById(registry[name]);
      if (link) link.disabled = name !== theme;
    });
    document.documentElement.className = 'theme-' + theme;
  })();
</script>
</head>
<body>
<main class="page-narrow">
  <p class="loading">Loading…</p>
</main>
<script type="module">
  import { api } from './js/api.js';
  import { currentUser } from './js/session.js';

  await api.initCsrf();
  const user = await currentUser();
  location.replace(!user ? 'login.html'
    : user.mustChangePassword ? 'change-password.html'
    : 'trips.html');
</script>
</body>
</html>
