<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="index.travellingLlamaYourTravel">Travelling Llama — your travel buddy for planning trips</title>
<meta name="description" content="Your travel buddy for planning trips: destinations, checklist, itinerary and a shared budget, then publish the plan when you are ready." data-i18n-content="common.yourTravelBuddyFor">
<meta property="og:site_name" content="Travelling Llama" data-i18n-content="common.travellingLlama">
<meta property="og:title" content="🦙 Travelling Llama" data-i18n-content="common.travellingLlama2">
<meta property="og:description" content="Your travel buddy for planning trips." data-i18n-content="common.yourTravelBuddyForPlanning">
<meta property="og:type" content="website">
<meta property="og:url" content="https://travellingllama.fun/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/minima.css?v=80"     id="minima-css">
<link rel="stylesheet" href="assets/css/y2k.css?v=80"        id="y2k-css"        disabled>
<link rel="stylesheet" href="assets/css/dark.css?v=80"       id="dark-css"       disabled>
<script>
  // Enable the remembered theme's stylesheet before first paint, so the page
  // never flashes the default theme first.
  (function () {
    var registry = { minima: 'minima-css', y2k: 'y2k-css', dark: 'dark-css' };
    var theme = 'minima';
    try { if (registry[localStorage.getItem('selectedTheme')]) theme = localStorage.getItem('selectedTheme'); } catch (e) {}
    Object.keys(registry).forEach(function (name) {
      var link = document.getElementById(registry[name]);
      if (link) link.disabled = name !== theme;
    });
    document.documentElement.className = 'theme-' + theme;
  })();
</script>
</head>
<body>
<main class="page-narrow">
  <p class="loading" data-i18n="index.loading"></p>
</main>
<script type="module">
  import { api } from './js/api.js';
  import { initI18n, startTranslating } from './js/i18n/index.js';
  import { currentUser } from './js/session.js';

  await initI18n();
  startTranslating();
  await api.initCsrf();
  const user = await currentUser();
  location.replace(!user ? 'login.html'
    : user.mustChangePassword ? 'change-password.html'
    : 'trips.html');
</script>
</body>
</html>
