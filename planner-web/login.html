<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="login.signInTravellingLlama">Sign in — Travelling Llama</title>
<meta name="description" content="Your travel buddy for planning trips: destinations, checklist, itinerary and a shared budget, then publish the plan when you are ready." data-i18n-content="common.yourTravelBuddyFor">
<meta property="og:site_name" content="Travelling Llama" data-i18n-content="common.travellingLlama">
<meta property="og:title" content="🦙 Travelling Llama" data-i18n-content="common.travellingLlama2">
<meta property="og:description" content="Your travel buddy for planning trips." data-i18n-content="common.yourTravelBuddyForPlanning">
<meta property="og:type" content="website">
<meta property="og:url" content="https://travellingllama.fun/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%99%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/minima.css?v=78"     id="minima-css">
<link rel="stylesheet" href="assets/css/y2k.css?v=78"        id="y2k-css"        disabled>
<link rel="stylesheet" href="assets/css/dark.css?v=78"       id="dark-css"       disabled>
<script>
  // Enable the remembered theme's stylesheet before first paint, so the page
  // never flashes the default theme first.
  (function () {
    var registry = { minima: 'minima-css', y2k: 'y2k-css', dark: 'dark-css' };
    var theme = 'minima';
    try { if (registry[localStorage.getItem('selectedTheme')]) theme = localStorage.getItem('selectedTheme'); } catch (e) {}
    Object.keys(registry).forEach(function (name) {
      var link = document.getElementById(registry[name]);
      if (link) link.disabled = name !== theme;
    });
    document.documentElement.className = 'theme-' + theme;
  })();
</script>
</head>
<body>
<header id="site-header"></header>

<main class="page-narrow auth-wrap">
  <div class="auth-logo" aria-hidden="true">🦙</div>
  <p class="auth-brand" data-i18n="common.travellingLlama"></p>
  <h1 class="auth-title" data-i18n="login.signIn"></h1>
  <p class="auth-subtitle" data-i18n="common.yourTravelBuddyForPlanning"></p>

  <div class="card">
    <div id="error" class="alert alert-error" hidden></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email" data-i18n="common.email"></label>
        <input id="email" name="email" type="email" autocomplete="email" required autofocus>
      </div>

      <div class="field">
        <label for="password" data-i18n="common.password"></label>
        <!-- The eye button is appended here by js/password-toggle.js -->
        <div class="password-field">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submit" data-i18n="login.signIn"></button>
    </form>
  </div>

  <p class="auth-footnote" data-i18n="login.noAccountAccountsAre"></p>
  <p class="auth-footnote" data-i18n="login.forgotYourPasswordAsk"></p>
</main>

<footer id="site-footer"></footer>

<script type="module">
  import { api } from './js/api.js';
  import { initI18n, t } from './js/i18n/index.js';
  import { renderChrome } from './js/chrome.js';
  import { redirectIfSignedIn, afterLoginTarget, clearCachedUser } from './js/session.js';

  await initI18n();
  renderChrome();

  const form = document.querySelector('#login-form');
  const errorBox = document.querySelector('#error');
  const submit = document.querySelector('#submit');

  function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
  }

  await api.initCsrf();
  await redirectIfSignedIn();

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errorBox.hidden = true;
    submit.disabled = true;
    submit.textContent = t('login.signingIn');

    try {
      const user = await api.login({
        email: form.email.value.trim(),
        password: form.password.value,
      });
      clearCachedUser();
      // An invited member has to choose a password before anything else works.
      location.href = user.mustChangePassword ? 'change-password.html' : afterLoginTarget();
    } catch (error) {
      showError(error.fullMessage);
      submit.disabled = false;
      submit.textContent = t('login.signIn');
      form.password.select();
    }
  });
</script>
</body>
</html>
