              <label id="dest-going-label">Who's coming along?</label>
              <div class="chip-group" role="group" aria-labelledby="dest-going-label">
                <button type="button" class="chip" :aria-pressed="destForm.travellers.mode !== 'named'"
                        @click="everyoneGoes(destForm.travellers)">Everyone</button>
                <template x-for="person in tripSharers" :key="person.userId">
                  <button type="button" class="chip" :aria-pressed="destForm.travellers.ids.includes(person.userId)"
                          @click="toggleTraveller(destForm.travellers, person.userId)" x-text="person.label"></button>
                </template>
              </div>
            </div>
            <div class="field">
              <label class="checkbox">
                <input type="checkbox" x-model="destForm.suppressChecklist">
                Skip automatic checklists
              </label>
              <p class="field-hint" x-show="destForm.suppressChecklist">
                Checklist will not be generated for this destination.
              </p>
            </div>

            <div class="field">
              <label for="dest-notes">Note (optional)</label>
              <textarea id="dest-notes" x-model="destForm.notes"
                        placeholder="Altitude, how to get around, anything worth knowing"></textarea>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn" @click="closeDestinationForm()">Cancel</button>
              <button type="submit" class="btn btn-primary" :disabled="destBusy"
                      x-text="destBusy ? 'Saving…' : (destForm.id ? 'Save destination' : 'Add destination')"></button>
            </div>
          </form>
        </div>
      </div>

      <!-- Bulk delete destinations -->
      <div class="modal-backdrop" x-show="destBulkOpen" x-cloak @click.self="destBulkOpen = false"
           @keydown.escape.window="destBulkOpen = false">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="bulk-dest-title"
             x-dialog="destBulkOpen">
          <div class="modal-header">
            <h2 class="modal-title" id="bulk-dest-title">
              Delete <span x-text="destSelected.length"></span>
              destination<span x-show="destSelected.length !== 1">s</span>?
            </h2>
            <button type="button" class="modal-close" @click="destBulkOpen = false"
                    aria-label="Close">✕</button>
          </div>
          <p class="small">
            This removes the selected destinations. Their checklist items are
            <strong>kept</strong> — they simply stop being linked to a destination,
            so no planning already done against them is lost.
          </p>
          <p class="small muted" x-show="destSelectedChecklistCount">
            <span x-text="destSelectedChecklistCount"></span>
            checklist item<span x-show="destSelectedChecklistCount !== 1">s</span>
            will be kept and simply stop being linked.
          </p>
          <div class="modal-footer">
            <button type="button" class="btn" @click="destBulkOpen = false">Cancel</button>
            <button type="button" class="btn btn-danger" :disabled="destBulkBusy"
                    @click="confirmBulkDeleteDestinations()"
                    x-text="destBulkBusy ? 'Deleting…' : 'Delete selected'"></button>
          </div>
        </div>
      </div>

      <!-- Add checklist item -->
      <div class="modal-backdrop" x-show="addCheckOpen" x-cloak @click.self="addCheckOpen = false"
           @keydown.escape.window="addCheckOpen = false">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="add-check-title"
             x-dialog="addCheckOpen">
          <div class="modal-header">
            <h2 class="modal-title" id="add-check-title">Add checklist item</h2>
            <button type="button" class="modal-close" @click="addCheckOpen = false"
                    aria-label="Close">✕</button>
          </div>
          <div class="alert alert-error" x-show="addCheckError" x-text="addCheckError" x-cloak></div>
          <form @submit.prevent="addCheck()">
            <div class="field">
              <label for="new-check-description">Description</label>
              <input id="new-check-description" x-ref="newCheckDescription"
                     x-model="newCheck.description" maxlength="300"
                     placeholder="Order eSIM" required>
            </div>
            <div class="field">
              <label for="new-check-category">Category</label>
              <select id="new-check-category" x-model="newCheck.category">
                <template x-for="cat in categories" :key="cat.value">
                  <option :value="cat.value" x-text="`${cat.icon} ${cat.label}`"></option>
                </template>
              </select>
            </div>
            <div class="field">
              <label id="new-check-destination-label">Location (optional)</label>
              <div class="chip-group" role="group" aria-labelledby="new-check-destination-label">
                <template x-for="country in tripCountries" :key="country.code">
                  <button type="button" class="chip"
                          :aria-pressed="newCheck.countryCodes.includes(country.code)"
                          @click="toggleLocation(newCheck.countryCodes, country.code)"
                          x-text="country.label"></button>
                </template>
                <span class="tiny muted" x-show="!tripCountries.length">No countries yet</span>
              </div>
            </div>
            <div class="field">
              <label id="new-check-going-label">Who's coming along?</label>
              <p class="field-hint" x-show="newCheck.travellers.mode === 'inherit'">
                Same as <span x-text="'the trip'"></span>:
                <template x-for="name in nameList([])" :key="name"><span class="badge badge-traveller" x-text="name"></span></template><span x-show="!nameList([]).length">everyone</span>
                <button type="button" class="btn btn-ghost btn-sm"
                        @click="chooseTravellers(newCheck.travellers, [])">Choose…</button>
              </p>
              <div class="chip-group" role="group" aria-labelledby="new-check-going-label"
                   x-show="newCheck.travellers.mode !== 'inherit'">
                <button type="button" class="chip" :aria-pressed="newCheck.travellers.mode === 'everyone'"
                        @click="everyoneGoes(newCheck.travellers)">Everyone</button>
                <template x-for="person in tripSharers" :key="person.userId">
                  <button type="button" class="chip" :aria-pressed="newCheck.travellers.ids.includes(person.userId)"
                          @click="toggleTraveller(newCheck.travellers, person.userId)" x-text="person.label"></button>
                </template>
                <button type="button" class="btn btn-ghost btn-sm" @click="followParent(newCheck.travellers)"
                x-text="'Back to ' + 'the trip' + '\'s'"></button>
              </div>
            </div>
            <div class="field">
              <label for="new-check-note">Note (optional)</label>
              <textarea id="new-check-note" x-model="newCheck.note"></textarea>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn" @click="addCheckOpen = false">Cancel</button>
              <button type="submit" class="btn btn-primary" :disabled="addCheckBusy"
                      x-text="addCheckBusy ? 'Adding…' : 'Add'"></button>
            </div>
          </form>
        </div>
      </div>

      <!-- Add / edit itinerary entry -->
      <div class="modal-backdrop panel-switchable" x-show="entryOpen" x-cloak @click.self="entryOpen = false"
           @keydown.escape.window="entryOpen = false">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="entry-title"
             x-dialog="entryOpen">
          <div class="modal-header">
            <h2 class="modal-title" id="entry-title"
                x-text="entryForm.id ? 'Edit itinerary item' : 'Add itinerary item'"></h2>
            <button type="button" class="modal-close" @click="entryOpen = false"
                    aria-label="Close">✕</button>
          </div>
          <div class="alert alert-error" x-show="entryError" x-text="entryError" x-cloak></div>
          <form @submit.prevent="saveEntry()">
            <div class="field">
              <label for="entry-description">Description</label>
              <input id="entry-description" x-ref="entryDescription"
                     x-model="entryForm.description" maxlength="300"
                     placeholder="Delta flight (DL 6071) from LAX to LIM" required>
            </div>
            <div class="field">
              <label for="entry-category">Category</label>
              <select id="entry-category" x-model="entryForm.category">
                <template x-for="cat in categories" :key="cat.value">
                  <option :value="cat.value" x-text="`${cat.icon} ${cat.label}`"></option>
                </template>
              </select>
            </div>
            <div class="field">
              <label id="entry-destination-label">Location (optional)</label>
              <div class="chip-group" role="group" aria-labelledby="entry-destination-label">
                <template x-for="country in tripCountries" :key="country.code">
                  <button type="button" class="chip"
                          :aria-pressed="entryForm.countryCodes.includes(country.code)"
                          @click="toggleLocation(entryForm.countryCodes, country.code)"
                          x-text="country.label"></button>
                </template>
                <span class="tiny muted" x-show="!tripCountries.length">No countries yet</span>
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="entry-start-date">Start date</label>
                <input id="entry-start-date" type="date" x-model="entryForm.startDate" :min="trip.startDate" :max="trip.endDate">
              </div>
              <div class="field">
                <label for="entry-start-time">Start time</label>
                <input id="entry-start-time" type="time" x-model="entryForm.startTime">
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="entry-end-date">End date</label>
                <input id="entry-end-date" type="date" x-model="entryForm.endDate" :min="trip.startDate" :max="trip.endDate">
              </div>
              <div class="field">
                <label for="entry-end-time">End time</label>
                <input id="entry-end-time" type="time" x-model="entryForm.endTime">
              </div>
            </div>
            <div class="field" x-show="!entryForm.planId">
              <label id="entry-going-label">Who's coming along?</label>
              <p class="field-hint" x-show="entryForm.travellers.mode === 'inherit'">
                Same as <span x-text="entryParentLabel()"></span>:
                <template x-for="name in nameList(entryInherited())" :key="name"><span class="badge badge-traveller" x-text="name"></span></template><span x-show="!nameList(entryInherited()).length">everyone</span>
                <button type="button" class="btn btn-ghost btn-sm"
                        @click="chooseTravellers(entryForm.travellers, entryInherited())">Choose…</button>
              </p>
              <div class="chip-group" role="group" aria-labelledby="entry-going-label"
                   x-show="entryForm.travellers.mode !== 'inherit'">
                <button type="button" class="chip" :aria-pressed="entryForm.travellers.mode === 'everyone'"
                        @click="everyoneGoes(entryForm.travellers)">Everyone</button>
                <template x-for="person in tripSharers" :key="person.userId">
                  <button type="button" class="chip" :aria-pressed="entryForm.travellers.ids.includes(person.userId)"
                          @click="toggleTraveller(entryForm.travellers, person.userId)" x-text="person.label"></button>
                </template>
                <button type="button" class="btn btn-ghost btn-sm" @click="followParent(entryForm.travellers)"
                        x-text="'Back to ' + entryParentLabel() + '\'s'"></button>
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="entry-cost">Total Cost (optional)</label>
                <input id="entry-cost" type="number" step="0.01" min="0" x-model="entryForm.cost">
              </div>
              <div class="field">
                <label for="entry-currency">Currency</label>
                <select id="entry-currency" x-model="entryForm.currency">
                  <template x-for="code in entryCurrencies" :key="code">
                    <option :value="code" x-text="code"></option>
                  </template>
                </select>
              </div>
            </div>
            <p class="field-hint" style="margin-top:-8px">
              Adding a cost creates a matching budget entry.
            </p>
            <div class="field" x-show="entryForm.cost">
              <label id="entry-paid-by-label">Paid by</label>
              <div class="chip-group" role="group" aria-labelledby="entry-paid-by-label">
                <template x-for="person in tripSharers" :key="person.userId">
                  <button type="button" class="chip"
                          :aria-pressed="entryForm.paidByUserId === person.userId"
                          @click="choosePayer(entryForm, person.userId)"
                          x-text="person.label"></button>
                </template>
                <label class="checkbox">
                  <input type="checkbox" x-model="entryForm.costCharged"
                         @change="chargedToggled(entryForm, currentUserId, $event.target.checked)">
                  Expense already charged
                </label>
              </div>
            </div>

            <div class="field" x-show="entryForm.cost">
              <label id="entry-shared-label">Shared by</label>
              <div class="chip-group" role="group" aria-labelledby="entry-shared-label">
                <button type="button" class="chip"
                        :aria-pressed="sharedWithEveryone(entrySharersShown())"
                        @click="entryForm.sharedTouched = true; shareWithEveryone(entryForm.sharedByUserIds)">Everyone</button>
                <template x-for="person in tripSharers" :key="person.userId">
                  <button type="button" class="chip"
                          :aria-pressed="entrySharersShown().includes(person.userId)"
                          @click="toggleEntrySharer(person.userId)"
                          x-text="person.label"></button>
                </template>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn" @click="entryOpen = false">Cancel</button>
              <button type="submit" class="btn btn-primary" :disabled="entryBusy"
                      x-text="entryBusy ? 'Saving…' : 'Save'"></button>
            </div>
          </form>
        </div>
      </div>

      <!-- Bulk delete checklist items -->
      <div class="modal-backdrop" x-show="checkBulkOpen" x-cloak @click.self="checkBulkOpen = false"
           @keydown.escape.window="checkBulkOpen = false">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="bulk-check-title"
             x-dialog="checkBulkOpen">
          <div class="modal-header">
            <h2 class="modal-title" id="bulk-check-title">
              Delete <span x-text="checkSelected.length"></span>
              checklist item<span x-show="checkSelected.length !== 1">s</span>?
            </h2>
            <button type="button" class="modal-close" @click="checkBulkOpen = false"
                    aria-label="Close">✕</button>
          </div>
          <p class="small">
            This removes the selected items. Their plans
            <strong>stay on the itinerary</strong> — deleting a checklist item never
            deletes the planning done against it.
          </p>
          <p class="small muted" x-show="checkSelectedPlanCount">
            <span x-text="checkSelectedPlanCount"></span>
            plan<span x-show="checkSelectedPlanCount !== 1">s</span>
            will be kept and simply stop being linked.
          </p>
          <div class="modal-footer">
            <button type="button" class="btn" @click="checkBulkOpen = false">Cancel</button>
            <button type="button" class="btn btn-danger" :disabled="checkBulkBusy"
                    @click="confirmBulkDeleteChecks()"
                    x-text="checkBulkBusy ? 'Deleting…' : 'Delete selected'"></button>
          </div>
        </div>
      </div>

      <!-- Confirm completing a checklist item — raised by the list's tick and
           by the drawer's button alike -->
      <div class="modal-backdrop" x-show="completingItem" x-cloak
           @click.self="completingItem = null"
           @keydown.escape.window="completingItem = null">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="complete-check-title"
             x-dialog="completingItem">
          <div class="modal-header">
            <h2 class="modal-title" id="complete-check-title">Mark this item complete?</h2>
            <button type="button" class="modal-close" @click="completingItem = null"
                    aria-label="Close">✕</button>
          </div>
          <p class="small">
            <strong x-text="completingItem?.description"></strong> will be ticked off.
            You can reopen it at any time.
          </p>
          <p class="small muted" x-show="!completingItemPlans.length">
            Nothing has been planned against it yet — completing it anyway is fine.
          </p>
          <div class="modal-footer">
            <button type="button" class="btn" @click="completingItem = null">Cancel</button>
            <button type="button" class="btn btn-primary"
                    @click="confirmSetComplete()">Mark complete</button>
          </div>
        </div>
      </div>

      <!-- Bulk delete itinerary entries -->
      <div class="modal-backdrop" x-show="itinBulkOpen" x-cloak @click.self="itinBulkOpen = false"
           @keydown.escape.window="itinBulkOpen = false">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="bulk-itin-title"
             x-dialog="itinBulkOpen">
          <div class="modal-header">
            <h2 class="modal-title" id="bulk-itin-title">
              Remove <span x-text="itinSelected.length"></span>
              itinerary item<span x-show="itinSelected.length !== 1">s</span>?
            </h2>
            <button type="button" class="modal-close" @click="itinBulkOpen = false"
                    aria-label="Close">✕</button>
          </div>
          <p class="small">This removes the selected entries from the itinerary.</p>
          <p class="small muted" x-show="itinSelectedCostCount">
            <span x-text="itinSelectedCostCount"></span>
            of them carr<span x-text="itinSelectedCostCount === 1 ? 'ies' : 'y'"></span>
            a cost, so the matching budget
            entr<span x-text="itinSelectedCostCount === 1 ? 'y' : 'ies'"></span>
            will be removed too.
          </p>
          <div class="modal-footer">
            <button type="button" class="btn" @click="itinBulkOpen = false">Cancel</button>
            <button type="button" class="btn btn-danger" :disabled="itinBulkBusy"
                    @click="confirmBulkDeleteEntries()"
                    x-text="itinBulkBusy ? 'Removing…' : 'Remove selected'"></button>
          </div>
        </div>
      </div>

      <!-- Bulk delete expenses -->
      <div class="modal-backdrop" x-show="budgetBulkOpen" x-cloak @click.self="budgetBulkOpen = false"
           @keydown.escape.window="budgetBulkOpen = false">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="bulk-budget-title"
             x-dialog="budgetBulkOpen">
          <div class="modal-header">
            <h2 class="modal-title" id="bulk-budget-title">
              Remove <span x-text="budgetSelected.length"></span>
              expense<span x-show="budgetSelected.length !== 1">s</span>?
            </h2>
            <button type="button" class="modal-close" @click="budgetBulkOpen = false"
                    aria-label="Close">✕</button>
          </div>
          <p class="small">This removes the selected rows from the budget.</p>
          <p class="small muted" x-show="budgetSelectedFromPlanCount">
            <span x-text="budgetSelectedFromPlanCount"></span>
            of them came from a plan. Those plans stay on the itinerary, but lose their cost.
          </p>
          <div class="modal-footer">
            <button type="button" class="btn" @click="budgetBulkOpen = false">Cancel</button>
            <button type="button" class="btn btn-danger" :disabled="budgetBulkBusy"
                    @click="confirmBulkDeleteExpenses()"
                    x-text="budgetBulkBusy ? 'Removing…' : 'Remove selected'"></button>
          </div>
        </div>
      </div>

      <!-- Add / edit expense -->
      <div class="modal-backdrop panel-switchable" x-show="expenseOpen" x-cloak @click.self="expenseOpen = false"
           @keydown.escape.window="expenseOpen = false">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="expense-title"
             x-dialog="expenseOpen">
          <div class="modal-header">
            <h2 class="modal-title" id="expense-title"
                x-text="expenseForm.id ? 'Edit expense' : 'Add expense'"></h2>
            <button type="button" class="modal-close" @click="expenseOpen = false"
                    aria-label="Close">✕</button>
          </div>
          <div class="alert alert-error" x-show="expenseError" x-text="expenseError" x-cloak></div>
          <form @submit.prevent="saveExpense()">
            <div class="field">
              <label for="expense-description">Description</label>
              <input id="expense-description" x-ref="expenseDescription"
                     x-model="expenseForm.description"
                     placeholder="Yellow fever vaccine" required>
            </div>
            <div class="field">
              <label for="expense-category">Category</label>
              <select id="expense-category" x-model="expenseForm.category">
                <template x-for="cat in categories" :key="cat.value">
                  <option :value="cat.value" x-text="`${cat.icon} ${cat.label}`"></option>
                </template>
              </select>
            </div>

            <div class="field">
              <label id="expense-destination-label">Location (optional)</label>
              <div class="chip-group" role="group" aria-labelledby="expense-destination-label">
                <template x-for="country in tripCountries" :key="country.code">
                  <button type="button" class="chip"
                          :aria-pressed="expenseForm.countryCodes.includes(country.code)"
                          @click="toggleLocation(expenseForm.countryCodes, country.code)"
                          x-text="country.label"></button>
                </template>
                <span class="tiny muted" x-show="!tripCountries.length">No countries yet</span>
              </div>
            </div>
            <div class="field">
              <label for="expense-date">Date (optional)</label>
              <input id="expense-date" type="date" x-model="expenseForm.date" :min="trip.startDate" :max="trip.endDate">
            </div>

            <!-- Cost and Currency paired on one row, and called Cost, so this
                 reads the same as the Plan form that can create the very same
                 budget row. -->
            <div class="field-row">
              <div class="field">
                <label for="expense-cost">Total Cost</label>
                <input id="expense-cost" type="number" step="0.01" min="0"
                       x-model="expenseForm.amount" required>
              </div>
              <div class="field">
                <label for="expense-currency">Currency</label>
                <select id="expense-currency" x-model="expenseForm.currency">
                  <template x-for="code in entryCurrencies" :key="code">
                    <option :value="code" x-text="code"></option>
                  </template>
                </select>
              </div>
            </div>

            <!-- Paid by comes first: who handed the money over is the plain
                 fact, and whose money it is follows from it. -->
            <div class="field">
              <label id="expense-paid-by-label">Paid by</label>
              <div class="chip-group" role="group" aria-labelledby="expense-paid-by-label">
                <template x-for="person in tripSharers" :key="person.userId">
                  <button type="button" class="chip"
                          :aria-pressed="expenseForm.paidByUserId === person.userId"
                          @click="choosePayer(expenseForm, person.userId)"
                          x-text="person.label"></button>
                </template>
                <label class="checkbox">
                  <input type="checkbox" x-model="expenseForm.charged"
                         @change="chargedToggled(expenseForm, currentUserId, $event.target.checked)">
                  Expense already charged
                </label>
              </div>
            </div>
            <div class="field">
              <label id="expense-shared-label">Shared by</label>
              <div class="chip-group" role="group" aria-labelledby="expense-shared-label">
                <!-- Before the template, because x-for inserts its members as
                     siblings *after* the template node. "Everyone" is the empty
                     list rather than every name, so a member joining later is
                     included and one leaving drops out. -->
                <button type="button" class="chip"
                        :aria-pressed="sharedWithEveryone(expenseForm.sharedByUserIds)"
                        @click="shareWithEveryone(expenseForm.sharedByUserIds)">Everyone</button>
                <template x-for="person in tripSharers" :key="person.userId">
                  <button type="button" class="chip"
                          :aria-pressed="expenseForm.sharedByUserIds.includes(person.userId)"
                          @click="toggleSharer(expenseForm.sharedByUserIds, person.userId)"
                          x-text="person.label"></button>
                </template>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn" @click="expenseOpen = false">Cancel</button>
              <button type="submit" class="btn btn-primary" :disabled="expenseBusy"
                      x-text="expenseBusy ? 'Saving…' : 'Save'"></button>
            </div>
          </form>
        </div>
      </div>

      <!-- Settle details: the rows behind one line of the settle table.
           panel-switchable like the other four detail views, so it follows
           Account → Appearance. -->
      <div class="modal-backdrop panel-switchable" x-show="settleDetail" x-cloak
           @click.self="closeSettleDetails()" @keydown.escape.window="closeSettleDetails()">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settle-detail-title"
             x-dialog="settleDetail">
          <div class="modal-header">
            <h2 class="modal-title" id="settle-detail-title"
                x-text="settleDetail ? settleSummaryLine(settleDetail) : ''"></h2>
            <button type="button" class="modal-close" @click="closeSettleDetails()"
                    aria-label="Close">✕</button>
          </div>

          <template x-if="settleDetail">
            <div>
              <ul class="settle-lines">
                <template x-for="line in settleDetailLines" :key="line.itemId">
                  <li class="settle-line">
                    <span class="settle-line-main">
                      <span class="settle-line-desc" x-text="line.description"></span>
                      <span class="settle-line-meta">
                        <span x-show="line.category" x-text="categoryOf(line.category).label"></span>
                        <span x-show="line.date" x-text="line.date ? expenseDate(line) : ''"></span>
                      </span>
                    </span>
                    <span class="settle-line-amount"
                          :class="line.owedToYou ? 'settle-net-positive' : 'settle-net-negative'"
                          x-text="(line.owedToYou ? '+' : '−') + ' ' + fmt(line.amount, settleDetail.currency)"></span>
                  </li>
                </template>
              </ul>

              <dl class="settle-totals">
                <div>
                  <dt x-text="`${settleMemberName(settleDetail.otherUserId)} owes you`"></dt>
                  <dd x-text="fmt(settleDetail.owesYou, settleDetail.currency)"></dd>
                </div>
                <div>
                  <dt x-text="`You owe ${settleMemberName(settleDetail.otherUserId)}`"></dt>
                  <dd x-text="fmt(settleDetail.youOwe, settleDetail.currency)"></dd>
                </div>
                <div class="settle-totals-net">
                  <dt>Net</dt>
                  <dd :class="settleNetClass(settleDetail)"
                      x-text="settleNetLabel(settleDetail)"></dd>
                </div>
              </dl>
            </div>
          </template>

          <div class="modal-actions">
            <button type="button" class="btn" @click="closeSettleDetails()">Close</button>
          </div>
        </div>
      </div>

      <!-- Confirm publish -->
      <div class="modal-backdrop" x-show="confirmingPublish" x-cloak
           @click.self="confirmingPublish = false" @keydown.escape.window="confirmingPublish = false">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="publish-title"
             x-dialog="confirmingPublish">
          <div class="modal-header">
            <h2 class="modal-title" id="publish-title">Publish this trip?</h2>
            <button type="button" class="modal-close" @click="confirmingPublish = false"
                    aria-label="Close">✕</button>
          </div>
          <p class="small">
            Anyone with the link will be able to see this trip — its destinations,
            itinerary, checklist and budget. No sign-in required.
          </p>
          <p class="small muted">You can unpublish at any time.</p>
          <div class="modal-footer">
            <button type="button" class="btn" @click="confirmingPublish = false">Cancel</button>
            <button type="button" class="btn btn-primary" :disabled="publishBusy"
                    @click="doPublish()" x-text="publishBusy ? 'Publishing…' : 'Publish'"></button>
          </div>
        </div>
      </div>

      <!-- Confirm unpublish -->
      <div class="modal-backdrop" x-show="confirmingUnpublish" x-cloak
           @click.self="confirmingUnpublish = false" @keydown.escape.window="confirmingUnpublish = false">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="unpublish-title"
             x-dialog="confirmingUnpublish">
          <div class="modal-header">
            <h2 class="modal-title" id="unpublish-title">Unpublish this trip?</h2>
            <button type="button" class="modal-close" @click="confirmingUnpublish = false"
                    aria-label="Close">✕</button>
          </div>
          <p class="small">
            The public page will be taken down and its link will stop working.
            Nothing in the trip itself is deleted, and you can publish again later.
          </p>
          <div class="modal-footer">
            <button type="button" class="btn" @click="confirmingUnpublish = false">Cancel</button>
            <button type="button" class="btn btn-danger" :disabled="publishBusy"
                    @click="doUnpublish()" x-text="publishBusy ? 'Working…' : 'Unpublish'"></button>
          </div>
        </div>
      </div>
    </div>
  </template>
</main>

<footer id="site-footer"></footer>

<style>[x-cloak] { display: none !important; }</style>
<script src="vendor/chart.umd.js?v=4.5.1"></script>
<script type="module">
  import { bootPage } from './js/boot.js';
  import { tripPage } from './js/pages/trip.js';

  await bootPage({ active: 'trips', component: { tripPage } });
</script>
</body>
</html>
