             x-html="$th('trip.removeMemberWarning', { name: removingMember?.displayName ?? '' })"></p>
          <p class="small" x-show="removingMember && isSelf(removingMember)" data-i18n="trip.youWillLoseAccess"></p>
          <div class="modal-footer">
            <button type="button" class="btn" @click="removingMember = null" data-i18n="common.cancel"></button>
            <button type="button" class="btn btn-danger" @click="confirmRemoveMember()"
                    x-text="isSelf(removingMember || {}) ? $t('trip.leaveTrip') : $t('trip.remove')"></button>
          </div>
        </div>
      </div>

      <!-- Add / edit destination -->
      <div class="modal-backdrop panel-switchable" x-show="destFormOpen" x-cloak @click.self="closeDestinationForm()"
           @keydown.escape.window="closeDestinationForm()">
        <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="dest-title"
             x-dialog="destFormOpen">
          <div class="modal-header">
            <h2 class="modal-title" id="dest-title"
                x-text="destForm.id ? $t('trip.editDestination') : $t('trip.addDestinationTitle')"></h2>
            <button type="button" class="modal-close" @click="closeDestinationForm()"
                    data-i18n-aria-label="common.close">✕</button>
          </div>
          <div class="alert alert-error" x-show="destError" x-text="destError" x-cloak></div>

          <form @submit.prevent="saveDestination()">
            <div class="field autocomplete">
              <label for="dest-name" data-i18n="trip.name"></label>
              <input id="dest-name" x-ref="destName" x-model="destForm.name"
                     @input="onDestNameInput()"
                     @keydown.escape.prevent.stop="dismissSuggestions()"
                     @blur="dismissSuggestions()"
                     autocomplete="off" maxlength="120"
                     data-i18n-placeholder="trip.cusco" required>

              <!-- Suggestions are a convenience: free text always saves.
                   The list sits over the fields below it, so it has to be
                   escapable: the options are not tab stops (Tab goes to
                   Country code, not into the list), Escape and moving focus
                   away both close it, and the footer says so for the mouse.
                   Each option suppresses mousedown so that closing-on-blur
                   does not swallow the click that picks it. -->
              <ul class="autocomplete-list" x-show="suggestions.length" x-cloak>
                <template x-for="place in suggestions" :key="place.geonameId">
                  <li>
                    <button type="button" class="autocomplete-option" tabindex="-1"
                            @mousedown.prevent @click="pickSuggestion(place)">
                      <span class="autocomplete-name">
                        <span x-show="place.countryFlag" x-text="place.countryFlag"></span>
                        <span x-text="place.name"></span>
                      </span>
                      <span class="autocomplete-meta" x-text="suggestionMeta(place)"></span>
                    </button>
                  </li>
                </template>
                <li>
                  <button type="button" class="autocomplete-freetext" tabindex="-1"
                          @mousedown.prevent @click="keepTypedName()">
                    <span x-text="$t('trip.keepTypedName', { name: destForm.name })"></span>
                  </button>
                </li>
              </ul>

              <p class="autocomplete-status" x-show="lookupBusy" data-i18n="trip.lookingUpPlaces"></p>

              </div>
              <div class="field">
                <label for="expense-currency" data-i18n="trip.currency"></label>
                <select id="expense-currency" x-model="expenseForm.currency">
                  <template x-for="code in entryCurrencies" :key="code">
                    <option :value="code" x-text="code"></option>
                  </template>
                </select>
              </div>
            </div>

            <!-- Paid by comes first: who handed the money over is the plain
                 fact, and whose money it is follows from it. -->
            <div class="field">
              <label id="expense-paid-by-label" data-i18n="trip.paidBy"></label>
              <div class="chip-group" role="group" aria-labelledby="expense-paid-by-label">
                <template x-for="person in tripSharers" :key="person.userId">
                  <button type="button" class="chip"
                          :aria-pressed="expenseForm.paidByUserId === person.userId"
                          @click="choosePayer(expenseForm, person.userId)"
                          x-text="person.label"></button>
                </template>
                <label class="checkbox">
                  <input type="checkbox" x-model="expenseForm.charged"
                         @change="chargedToggled(expenseForm, currentUserId, $event.target.checked)">
                  <span data-i18n="trip.expenseAlreadyCharged"></span>
                </label>
              </div>
            </div>
            <div class="field">
              <!-- <label id="expense-shared-label">Shared by</label> -->
              <label id="expense-shared-label"><span data-i18n="trip.whoSChippingIn"></span> <span aria-hidden="true">🦙</span> </label>
              <div class="chip-group" role="group" aria-labelledby="expense-shared-label">
                <!-- Before the template, because x-for inserts its members as
                     siblings *after* the template node. "Everyone" is the empty
                     list rather than every name, so a member joining later is
                     included and one leaving drops out. -->
                <button type="button" class="chip"
                        :aria-pressed="sharedWithEveryone(expenseForm.sharedByUserIds)"
                        @click="shareWithEveryone(expenseForm.sharedByUserIds)" data-i18n="trip.everyone"></button>
                <template x-for="person in tripSharers" :key="person.userId">
                  <button type="button" class="chip"
                          :aria-pressed="expenseForm.sharedByUserIds.includes(person.userId)"
                          @click="toggleSharer(expenseForm.sharedByUserIds, person.userId)"
                          x-text="person.label"></button>
                </template>
              </div>
            </div>

            <div class="field">
              <label for="expense-note" data-i18n="trip.noteOptional"></label>
              <textarea id="expense-note" x-model="expenseForm.note"
                        data-i18n-placeholder="trip.anythingWorthRememberingBooking"></textarea>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn" @click="expenseOpen = false" data-i18n="common.cancel"></button>
              <button type="submit" class="btn btn-primary" :disabled="expenseBusy"
                      x-text="expenseBusy ? $t('common.saving') : $t('common.save')"></button>
            </div>
          </form>
        </div>
      </div>

      <!-- Settle details: the rows behind one line of the settle table.
           panel-switchable like the other four detail views, so it follows
           Account → Appearance. -->
      <div class="modal-backdrop panel-switchable" x-show="settleDetail" x-cloak
           @click.self="closeSettleDetails()" @keydown.escape.window="closeSettleDetails()">
        <div class="modal settle-modal" role="dialog" aria-modal="true" aria-labelledby="settle-detail-title"
             x-dialog="settleDetail">
          <div class="modal-header">
            <h2 class="modal-title" id="settle-detail-title"
                x-text="settleDetail ? settleSummaryLine(settleDetail) : ''"></h2>
            <button type="button" class="modal-close" @click="closeSettleDetails()"
                    data-i18n-aria-label="common.close">✕</button>
          </div>

          <template x-if="settleDetail">
            <div>
              <ul class="settle-lines">
                <template x-for="line in settleDetailLines" :key="line.itemId">
                  <li class="settle-line">
                    <span class="settle-line-main">
                      <span class="settle-line-desc" x-text="line.description"></span>
                      <span class="settle-line-meta">
                        <span x-show="line.category" x-text="categoryOf(line.category).label"></span>
                        <span x-show="line.date" x-text="line.date ? expenseDate(line) : ''"></span>
                      </span>
                    </span>
                    <span class="settle-line-amount"
                          :class="line.owedToYou ? 'settle-net-positive' : 'settle-net-negative'"
                          x-text="(line.owedToYou ? '+' : '−') + ' ' + fmt(line.amount, settleDetail.currency)"></span>
                  </li>
                </template>
              </ul>

              <dl class="settle-totals">
                <div>
                  <dt x-text="$t('trip.owesYouNamed', { name: settleMemberName(settleDetail.otherUserId) })"></dt>
                  <dd x-text="fmt(settleDetail.owesYou, settleDetail.currency)"></dd>
                </div>
                <div>
                  <dt x-text="$t('trip.youOweNamed', { name: settleMemberName(settleDetail.otherUserId) })"></dt>
                  <dd x-text="fmt(settleDetail.youOwe, settleDetail.currency)"></dd>
                </div>
                <div x-show="Number(settleDetail.paidYou) > 0">
                  <dt x-text="$t('trip.hasPaidYouNamed', { name: settleMemberName(settleDetail.otherUserId) })"></dt>
                  <dd x-text="fmt(settleDetail.paidYou, settleDetail.currency)"></dd>
                </div>
                <div x-show="Number(settleDetail.youPaid) > 0">
                  <dt x-text="$t('trip.youHavePaidNamed', { name: settleMemberName(settleDetail.otherUserId) })"></dt>
                  <dd x-text="fmt(settleDetail.youPaid, settleDetail.currency)"></dd>
                </div>
                <div class="settle-totals-net">
                  <dt data-i18n="trip.net"></dt>
                  <dd>
                    <span class="settle-net">
                      <span class="settle-pill" :class="settleNetClass(settleDetail)"
                            x-text="settleNetWord(settleDetail)"></span>
                      <span class="settle-net-amount" x-show="settleNetAmount(settleDetail)"
                            x-text="settleNetAmount(settleDetail)"></span>
                    </span>
                  </dd>
                </div>
              </dl>
            </div>
          </template>

          <div class="modal-actions">
            <button type="button" class="btn" @click="closeSettleDetails()" data-i18n="common.close"></button>
          </div>
        </div>
      </div>

      <!-- Settle balances: the one View details while debts are simplified —
           the signed-in member's standing per currency and the rows behind it. -->
      <div class="modal-backdrop panel-switchable" x-show="settleBalancesOpen" x-cloak
           @click.self="closeSettleBalances()" @keydown.escape.window="closeSettleBalances()">
        <div class="modal settle-modal" role="dialog" aria-modal="true" aria-labelledby="settle-balance-title"
             x-dialog="settleBalancesOpen">
          <div class="modal-header">
            <h2 class="modal-title" id="settle-balance-title" data-i18n="trip.yourBalance"></h2>
            <button type="button" class="modal-close" @click="closeSettleBalances()"
                    data-i18n-aria-label="common.close">✕</button>
          </div>

          <p class="empty" x-show="settleBalanceSections.length === 0" data-i18n="trip.nothingToBalanceYet"></p>

          <template x-for="section in settleBalanceSections" :key="section.currency">
            <div class="settle-balance">
              <h3 class="section-title" x-text="$t('trip.balanceIn', { currency: section.currency })"></h3>
              <ul class="settle-lines">
                <template x-for="line in section.lines" :key="line.itemId">
                  <li class="settle-line">
                    <span class="settle-line-main">
                      <span class="settle-line-desc" x-text="line.description"></span>
                      <span class="settle-line-meta">
                        <span x-show="line.category" x-text="categoryOf(line.category).label"></span>
                        <span x-show="line.date" x-text="line.date ? expenseDate(line) : ''"></span>
                      </span>
                    </span>
                    <span class="settle-line-amount"
                          :class="line.owedToYou ? 'settle-net-positive' : 'settle-net-negative'"
                          x-text="(line.owedToYou ? '+' : '−') + ' ' + fmt(line.amount, section.currency)"></span>
                  </li>
                </template>
              </ul>
              <dl class="settle-totals">
                <div class="settle-totals-net">
                  <dt data-i18n="trip.netBalance"></dt>
                  <dd :class="section.netClass" x-text="section.summary"></dd>
                </div>
              </dl>
              <p class="settle-note" x-text="section.net === 0 ? $t('trip.noPaymentsNeeded') : $t('trip.settledByPayments')"></p>
            </div>
          </template>

          <div class="modal-actions">
            <button type="button" class="btn" @click="closeSettleBalances()" data-i18n="common.close"></button>
          </div>
        </div>
      </div>

      <!-- Record a payment against one line of the settle table. The two
           people and the currency are fixed by the line; the amount can be
           lowered for a part payment. -->
      <div class="modal-backdrop panel-switchable" x-show="payOpen" x-cloak @click.self="payOpen = false"
           @keydown.escape.window="payOpen = false">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pay-title"
             x-dialog="payOpen">
          <div class="modal-header">
            <h2 class="modal-title" id="pay-title" data-i18n="trip.recordPayment"></h2>
            <button type="button" class="modal-close" @click="payOpen = false"
                    data-i18n-aria-label="common.close">✕</button>
          </div>
          <div class="alert alert-error" x-show="payError" x-text="payError" x-cloak></div>
          <form @submit.prevent="savePayment()">
            <p class="settle-pay-summary"
               x-text="$t(payForm.toUserId === currentUserId ? 'trip.paidYou' : 'trip.paidNamed', { who: settleWho(payForm.fromUserId), name: settleMemberName(payForm.toUserId) })"></p>
            <!-- The currency is fixed by the line, so it is part of the label
                 rather than a field that looks editable and is not. -->
            <div class="field">
              <label for="pay-amount" x-text="$t('trip.amountIn', { currency: payForm.currency })"></label>
              <input id="pay-amount" type="number" step="0.01" min="0.01" inputmode="decimal"
                     x-ref="payAmount" x-model="payForm.amount" required
                     aria-describedby="pay-outcome">
            </div>
            <!-- What saving this would leave, before it is saved. Live, and
                 announced politely so it is not read out on every keystroke. -->
            <p id="pay-outcome" class="settle-pay-outcome" aria-live="polite"
               :class="payOutcome ? `settle-pay-outcome-${payOutcome.kind}` : ''"
               x-text="payOutcome ? payOutcome.text : $t('trip.lowerTheAmount')"></p>
            <div class="field">
              <label for="pay-date" data-i18n="trip.date"></label>
              <input id="pay-date" type="date" x-model="payForm.date">
            </div>
            <div class="field">
              <label for="pay-note" data-i18n="trip.noteOptional"></label>
              <input id="pay-note" x-model="payForm.note" maxlength="200"
                     data-i18n-placeholder="trip.paidInCash">
            </div>
            <div class="modal-footer">
              <button type="button" class="btn" @click="payOpen = false" data-i18n="common.cancel"></button>
              <button type="submit" class="btn btn-primary" :disabled="payBusy"
                      x-text="payBusy ? $t('common.saving') : $t('trip.recordPayment')"></button>
            </div>
          </form>
        </div>
      </div>

      <!-- Delete a payment: the debt it settled comes back. -->
      <div class="modal-backdrop" x-show="payDeleteTarget" x-cloak @click.self="payDeleteTarget = null"
           @keydown.escape.window="payDeleteTarget = null">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pay-delete-title"
             x-dialog="payDeleteTarget">
          <div class="modal-header">
            <h2 class="modal-title" id="pay-delete-title" data-i18n="trip.deleteThisPayment"></h2>
            <button type="button" class="modal-close" @click="payDeleteTarget = null"
                    data-i18n-aria-label="common.close">✕</button>
          </div>
          <template x-if="payDeleteTarget">
            <p class="small"
               x-text="$t('trip.deletePaymentBody', { name: settlePaymentLine(payDeleteTarget), amount: fmt(payDeleteTarget.amount, payDeleteTarget.currency) })"></p>
          </template>
          <div class="modal-footer">
            <button type="button" class="btn" @click="payDeleteTarget = null" data-i18n="common.cancel"></button>
            <button type="button" class="btn btn-danger" :disabled="payDeleteBusy"
                    @click="confirmDeletePayment()"
                    x-text="payDeleteBusy ? $t('common.deleting') : $t('trip.deletePayment')"></button>
          </div>
        </div>
      </div>

      <!-- Confirm publish -->
      <div class="modal-backdrop" x-show="confirmingPublish" x-cloak
           @click.self="confirmingPublish = false" @keydown.escape.window="confirmingPublish = false">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="publish-title"
             x-dialog="confirmingPublish">
          <div class="modal-header">
            <h2 class="modal-title" id="publish-title" data-i18n="trip.publishThisTrip"></h2>
            <button type="button" class="modal-close" @click="confirmingPublish = false"
                    data-i18n-aria-label="common.close">✕</button>
          </div>
          <p class="small" data-i18n="trip.anyoneWithTheLink"></p>
          <p class="small muted" x-show="isOwner" data-i18n="trip.youCanUnpublishAt"></p>
          <p class="small muted" x-show="!isOwner" data-i18n="trip.onlyTheTripOwner"></p>
          <div class="modal-footer">
            <button type="button" class="btn" @click="confirmingPublish = false" data-i18n="common.cancel"></button>
            <button type="button" class="btn btn-primary" :disabled="publishBusy"
                    @click="doPublish()" x-text="publishBusy ? $t('trip.publishing') : $t('trip.publish')"></button>
          </div>
        </div>
      </div>

      <!-- Confirm unpublish -->
      <div class="modal-backdrop" x-show="confirmingUnpublish" x-cloak
           @click.self="confirmingUnpublish = false" @keydown.escape.window="confirmingUnpublish = false">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="unpublish-title"
             x-dialog="confirmingUnpublish">
          <div class="modal-header">
            <h2 class="modal-title" id="unpublish-title" data-i18n="trip.unpublishThisTrip"></h2>
            <button type="button" class="modal-close" @click="confirmingUnpublish = false"
                    data-i18n-aria-label="common.close">✕</button>
          </div>
          <p class="small" data-i18n="trip.thePublicPageWill"></p>
          <div class="modal-footer">
            <button type="button" class="btn" @click="confirmingUnpublish = false" data-i18n="common.cancel"></button>
            <button type="button" class="btn btn-danger" :disabled="publishBusy"
                    @click="doUnpublish()" x-text="publishBusy ? $t('common.working') : $t('trip.unpublish')"></button>
          </div>
        </div>
      </div>
    </div>
  </template>
</main>

<footer id="site-footer"></footer>

<style>[x-cloak] { display: none !important; }</style>
<script src="vendor/chart.umd.js?v=4.5.1"></script>
<script type="module">
  import { bootPage } from './js/boot.js';
  import { tripPage } from './js/pages/trip.js';

  await bootPage({ active: 'trips', component: { tripPage } });
</script>
</body>
</html>
