<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip — Travelling Llama</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%99%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/minima.css?v=78"     id="minima-css">
<link rel="stylesheet" href="assets/css/y2k.css?v=78"        id="y2k-css"        disabled>
<link rel="stylesheet" href="assets/css/dark.css?v=78"       id="dark-css"       disabled>
<script>
  // Enable the remembered theme's stylesheet before first paint, so the page
  // never flashes the default theme first.
  (function () {
    var registry = { minima: 'minima-css', y2k: 'y2k-css', dark: 'dark-css' };
    var theme = 'minima';
    try { if (registry[localStorage.getItem('selectedTheme')]) theme = localStorage.getItem('selectedTheme'); } catch (e) {}
    Object.keys(registry).forEach(function (name) {
      var link = document.getElementById(registry[name]);
      if (link) link.disabled = name !== theme;
    });
    document.documentElement.className = 'theme-' + theme;
  })();
</script>
</head>
<body>
<header id="site-header"></header>

<main class="page" x-data="tripPage()" x-init="init()" x-cloak>
  <p class="loading" x-show="loading">Loading the trip…</p>
  <div class="alert alert-error" x-show="error && !loading" x-text="error" x-cloak></div>

  <template x-if="!loading && !error">
    <div>
      <!-- ── header ─────────────────────────────── -->
      <div class="trip-head">
        <div>
          <h1 class="trip-head-title">
            <span x-text="trip.title"></span>
            <span class="badge" :class="trip.status === 'PUBLISHED' ? 'badge-published' : 'badge-draft'"
                  x-text="trip.status === 'PUBLISHED' ? 'Published' : 'Draft'"></span>
            <span class="badge" :class="isOwner ? 'badge-owner' : ''"
                  x-text="isOwner ? 'Owner' : 'Travel buddy'"></span>
          </h1>
          <div class="trip-head-meta">
            <span x-text="tripDates()"></span>
            <span x-show="ownerName()"> · owned by <span x-text="ownerName()"></span></span>
            <span> · <span x-text="members.length"></span>
              travel <span x-text="members.length === 1 ? 'buddy' : 'buddies'"></span></span>
            <span class="scope-switch" role="group" aria-label="Show" x-show="canSeeWholeTrip">
              <button type="button" class="chip" :aria-pressed="scope === 'mine'"
                      @click="setScope('mine')">Mine</button>
              <button type="button" class="chip" :aria-pressed="scope === 'trip'"
                      @click="setScope('trip')">Whole trip</button>
            </span>
          </div>
        </div>
        <div class="trip-head-actions">
          <a class="btn btn-sm" href="trips.html">← All trips</a>
          <button type="button" class="btn btn-sm" @click="openEdit()">Edit trip</button>
          <button type="button" class="btn btn-sm btn-danger" x-show="isOwner"
                  @click="deletingTrip = true; deleteConfirm = ''">Delete trip</button>
        </div>
      </div>

      <!-- ── tabs ───────────────────────────────── -->
      <div class="tabs" role="tablist" aria-label="Trip sections"
           @keydown="onTabKeydown($event)">
        <template x-for="t in tabs" :key="t.id">
          <button type="button" class="tab" role="tab"
                  :id="`tab-${t.id}`" :aria-controls="`panel-${t.id}`"
                  :aria-selected="tab === t.id" :tabindex="tab === t.id ? 0 : -1"
                  @click="selectTab(t.id)">
            <span x-text="t.label"></span>
            <span class="tab-count" x-show="countFor(t.id)" x-text="countFor(t.id)"></span>
          </button>
        </template>
      </div>

      <!-- ══ OVERVIEW ═══════════════════════════ -->
      <section x-show="tab === 'overview'" role="tabpanel" id="panel-overview"
               aria-labelledby="tab-overview" tabindex="0">
        <div class="grid grid-stats" style="margin-bottom:24px">
          <template x-for="stat in stats()" :key="stat.label">
            <div class="stat">
              <div class="stat-value" x-text="stat.value"></div>
              <div class="stat-label" x-text="stat.label"></div>
            </div>
          </template>
        </div>

        <div class="grid grid-2">
          <div class="card">
            <div class="card-header"><h2 class="card-title">Up next</h2></div>
            <p class="small muted" x-show="!upNext().length">Nothing scheduled yet.</p>
            <template x-for="item in upNext()" :key="item.id">
              <div class="needs-planning-row">
                <span x-text="categoryOf(item.category).icon"></span>
                <div class="grow">
                  <div class="small strong" x-text="item.description"></div>
                  <div class="tiny muted" x-text="planWhen(item)"></div>
                </div>
              </div>
            </template>
          </div>

          <div class="card">
            <div class="card-header">
              <h2 class="card-title">Needs planning</h2>
              <span class="badge" x-text="needsPlanning().length"></span>
            </div>
            <!-- With no destination there is nothing to plan yet, and nothing
                 on this card to act on — so it offers the first step instead. -->
            <div x-show="!destinations.length">
              <p class="small muted">
                Nothing to plan yet — adding a destination seeds its own checklist items.
              </p>
              <button type="button" class="btn btn-sm btn-primary"
                      @click="addFirstDestination()">Add your first destination</button>
            </div>
            <p class="small muted" x-show="destinations.length && !needsPlanning().length">
              Everything on the checklist has a plan against it.
            </p>
            <template x-for="item in needsPlanning()" :key="item.id">
              <div class="needs-planning-row">
                <span x-text="categoryOf(item.category).icon"></span>
                <div class="grow">
                  <div class="small" x-text="item.description"></div>
                  <div class="tiny muted" x-show="countryLabel(item.countryCodes)"
                       x-text="countryLabel(item.countryCodes)"></div>
                </div>
                <button type="button" class="btn btn-sm" @click="planFromOverview(item)">Plan</button>
              </div>
            </template>
          </div>
        </div>
      </section>

      <!-- ══ MEMBERS ════════════════════════════ -->
      <section x-show="tab === 'members'" role="tabpanel" id="panel-members"
               aria-labelledby="tab-members" tabindex="0">
        <div class="section-head">
          <h2 class="section-title">Travel Buddies</h2>
        </div>

        <div class="card" style="margin-bottom:16px">
          <div class="alert alert-error" x-show="memberError" x-text="memberError" x-cloak></div>
          <form class="field-inline" @submit.prevent="addMember()">
            <div class="field grow">
              <label for="member-email">Add a travel buddy by email</label>
              <input id="member-email" type="email" x-model="memberEmail"
                     placeholder="name@example.com" required>
              <p class="field-hint">
                They will get an email with a temporary password. Until they sign in and
                choose a screen name, this list shows their email address.
              </p>
            </div>
            <div class="field flex-none" style="align-self:flex-start;padding-top:22px">
              <button type="submit" class="btn btn-primary" :disabled="addingMember"
                      x-text="addingMember ? 'Sending…' : 'Send invite'"></button>
            </div>
          </form>
        </div>

        <!-- Only you so far: the one screen where inviting is the obvious next step. -->
        <p class="solo-hint" x-show="members.length === 1" x-cloak>
          <span aria-hidden="true">🦙</span> Travelling solo so far — add a travel buddy by email above.
        </p>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr><th>Name</th><th>Email</th><th>Role</th><th>Added</th><th class="actions"></th></tr>
            </thead>
            <tbody>
              <template x-for="member in members" :key="member.userId">
                <tr>
                  <td>
                    <span class="member-name">
                      <span :class="member.screenName ? '' : 'member-email-only'"
                            x-text="member.displayName"></span>
                      <span class="badge" x-show="!member.hasSignedIn">Not signed in yet</span>
                      <span class="badge" x-show="member.userId === currentUserId">You</span>
                    </span>
                  </td>
                  <td class="muted" x-text="member.email"></td>
                  <td><span class="badge" :class="member.role === 'OWNER' ? 'badge-owner' : ''"
                            x-text="member.role === 'OWNER' ? 'Owner' : 'Travel buddy'"></span></td>
                  <td class="muted tiny" x-text="addedLabel(member)"></td>
                  <td class="actions">
                    <button type="button" class="btn btn-sm btn-danger"
                            x-show="member.role !== 'OWNER'"
                            @click="askRemoveMember(member)"
                            x-text="isSelf(member) ? 'Leave trip' : 'Remove'"></button>
                    <span class="tiny muted" x-show="member.role === 'OWNER'"
                          title="Delete the trip instead">Cannot be removed</span>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>

      <!-- ══ DESTINATIONS ═══════════════════════ -->
      <section x-show="tab === 'destinations'" role="tabpanel" id="panel-destinations"
               aria-labelledby="tab-destinations" tabindex="0">
        <div class="section-head">
          <h2 class="section-title">Destinations</h2>
          <div class="btn-row">
            <!-- Beside Add rather than in a row of its own: it stays put whether
                 or not anything is selected, so ticking the first row never
                 shifts the rows under the pointer. Disabled, never hidden — and
                 left of Add, so the primary action is the rightmost thing on
                 the row on every tab. -->
            <button type="button" class="btn btn-sm btn-danger"
                    x-show="destinations.length"
                    :disabled="!destSelected.length"
                    @click="destBulkOpen = true">
              Delete selected<span x-show="destSelected.length"
                                   x-text="` (${destSelected.length})`"></span>
            </button>
            <button type="button" class="btn btn-primary btn-sm" @click="openAddDestination()">
              + Add destination
            </button>
          </div>
        </div>
        <p class="scope-hint" x-show="hiddenLabel('destinations')" x-cloak>
          Showing your part · <strong x-text="hiddenLabel('destinations')"></strong> on the whole trip ·
          <button type="button" class="btn btn-ghost btn-sm" @click="setScope('trip')">Show whole trip</button>
        </p>

        <div class="empty-state" x-show="!destinations.length">
          <div class="empty-icon">📍</div>
          <h3 class="empty-title">No destinations yet</h3>
          <p class="empty-body">
            Adding one creates three checklist items for it — transportation,
            accommodation and activities.
          </p>
          <button type="button" class="btn btn-primary" @click="openAddDestination()">
            Add your first destination
          </button>
        </div>

        <div class="table-wrap" x-show="destinations.length">
          <table class="table">
            <thead>
              <tr>
                <th class="select-cell"><span class="sr-only">Select</span></th>
                <th>Name</th><th>Country</th><th>Lat / Lon</th><th>Dates</th>
                <th class="num">Days</th><th class="num">Checklist</th><th class="actions"></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="destination in scopedDestinations" :key="destination.id">
                <tr>
                  <td class="select-cell">
                    <input type="checkbox" :checked="isDestSelected(destination.id)"
                           @change="toggleDestSelected(destination.id)"
                           :aria-label="`Select ${destination.name}`">
                  </td>
                  <td class="strong"><span x-text="destination.name"></span>
                    <template x-for="name in travellerNameList('destinations', destination.id)" :key="name">
                    <span class="badge badge-traveller" x-text="'👥 ' + name"></span>
                  </template></td>
                  <td>
                    <span x-show="destination.countryFlag" x-text="destination.countryFlag"></span>
                    <span class="muted" x-text="destination.countryName || '—'"></span>
                  </td>
                  <td class="mono tiny">
                    <a x-show="mapUrl(destination)" :href="mapUrl(destination)"
                       target="_blank" rel="noopener" x-text="coordinates(destination)"></a>
                    <span x-show="!mapUrl(destination)" class="muted">—</span>
                  </td>
                  <td x-text="destinationDates(destination) || '—'"></td>
                  <td class="num" x-text="daysOf(destination) ? daysOf(destination) + 'D' : '—'"></td>
                  <td class="num" x-text="checklistCountFor(destination)"></td>
                  <td class="actions">
                    <span class="btn-row">
                      <button type="button" class="btn btn-sm"
                              @click="openEditDestination(destination)">Edit</button>
                    </span>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>

      <!-- ══ CHECKLIST ══════════════════════════ -->
      <section x-show="tab === 'checklist'" role="tabpanel" id="panel-checklist"
               aria-labelledby="tab-checklist" tabindex="0">
        <div class="section-head">
          <h2 class="section-title">
            Travel Checklist
            <span class="small muted"
                  x-text="`— ${checkProgress().done} of ${checkProgress().total} done`"></span>
          </h2>
          <div class="btn-row">
            <button type="button" class="btn btn-sm btn-danger"
                    :disabled="!checkSelected.length"
                    @click="checkBulkOpen = true">
              Delete selected<span x-show="checkSelected.length"
                                   x-text="` (${checkSelected.length})`"></span>
            </button>
            <button type="button" class="btn btn-primary btn-sm" @click="openAddCheck()">
              + Add checklist item
            </button>
          </div>
        </div>
        <p class="scope-hint" x-show="hiddenLabel('checklist')" x-cloak>
          Showing your part · <strong x-text="hiddenLabel('checklist')"></strong> on the whole trip ·
          <button type="button" class="btn btn-ghost btn-sm" @click="setScope('trip')">Show whole trip</button>
        </p>

        <div class="toolbar">
          <span class="toolbar-label" id="check-category-label">Category</span>
          <div class="chip-group" role="group" aria-labelledby="check-category-label">
            <template x-for="cat in categories" :key="cat.value">
              <button type="button" class="chip"
                      :aria-pressed="checkCategoryFilters.includes(cat.value)"
                      @click="toggleCategoryFilter(cat.value)">
                <span x-text="cat.icon"></span><span x-text="cat.label"></span>
              </button>
            </template>
          </div>

          <span class="toolbar-label" id="check-status-label">Status</span>
          <div class="chip-group" role="group" aria-labelledby="check-status-label">
            <template x-for="option in ['ALL', 'TODO', 'COMPLETED']" :key="option">
              <button type="button" class="chip" :aria-pressed="checkStatusFilter === option"
                      @click="checkStatusFilter = option"
                      x-text="option === 'ALL' ? 'All' : (option === 'TODO' ? 'To do' : 'Completed')"></button>
            </template>
          </div>

          <span class="toolbar-label" id="check-group-by-label">Show by</span>
          <div class="chip-group" role="group" aria-labelledby="check-group-by-label">
            <template x-for="option in checkGroupByOptions" :key="option.value">
              <button type="button" class="chip"
                      :aria-pressed="checkGroupBy === option.value"
                      @click="checkGroupBy = option.value"
                      x-text="option.label"></button>
            </template>
          </div>

        </div>

        <div class="empty-state" x-show="!checklist.length">
          <div class="empty-icon">🧳</div>
          <h3 class="empty-title">Nothing on the checklist yet</h3>
          <p class="empty-body">
            Add a destination to have its items created for you, or add one here directly.
          </p>
          <button type="button" class="btn btn-primary" @click="openAddCheck()">Add an item</button>
        </div>

        <p class="small muted" x-show="checklist.length && !filteredChecklist.length">
          Nothing matches those filters.
        </p>

        <template x-for="group in checklistGroups" :key="group.title || 'all'">
          <div class="checklist" style="margin-bottom:16px">
            <div class="checklist-group-title" x-show="group.title" x-text="group.title"></div>
            <template x-for="item in group.items" :key="item.id">
              <div class="check-row-wrap">
                <label class="select-box" @click.stop>
                  <input type="checkbox" :checked="isCheckSelected(item.id)"
                         @change="toggleCheckSelected(item.id)"
                         :aria-label="`Select ${item.description}`">
                </label>
                <!-- Beside the row, not in it, for the same reason as the
                     select box: the row owns an Edit button, and buttons
                     cannot nest. -->
                <button type="button" class="check-status"
                        :aria-pressed="item.status === 'COMPLETED'"
                        :aria-label="`Complete: ${item.description}`"
                        :title="item.status === 'COMPLETED' ? 'Mark as to do' : 'Mark complete'"
                        @click="quickToggle(item, $event)"
                        x-text="item.status === 'COMPLETED' ? '✔️' : '▫️'"></button>
                <!-- A div, not a button: the row carries its own Edit button
                     the way the itinerary and budget rows do, and a button
                     cannot be nested inside another one. Clicking the row
                     still opens the drawer as a convenience. -->
                <div class="check-row" :class="item.status === 'COMPLETED' ? 'is-done' : ''"
                        @click="openChecklistItem(item)">
                <span class="check-main">
                  <span class="check-text" x-text="item.description"></span>
                  <template x-for="name in travellerNameList('checklist', item.id)" :key="name">
                    <span class="badge badge-traveller" x-text="'👥 ' + name"></span>
                  </template>
                  <span class="check-note" x-show="item.note" x-text="item.note"></span>
                  <span class="check-tags">
                    <span class="chip">
                      <span x-text="categoryOf(item.category).icon"></span>
                      <span x-text="categoryOf(item.category).label"></span>
                    </span>
                    <!-- One chip per country. Comma-joining them into a single
                         pill read as one long place name. -->
                    <template x-for="label in countryLabels(item.countryCodes)" :key="label">
                      <span class="chip" x-text="label"></span>
                    </template>
                    <span class="chip" x-show="planCountFor(item)"
                          x-text="`${planCountFor(item)} plan${planCountFor(item) === 1 ? '' : 's'}`"></span>
                  </span>
                </span>
                  <span class="check-side btn-row">
                    <button type="button" class="btn btn-sm"
                            @click.stop="openChecklistItem(item)">Edit</button>
                  </span>
                </div>
              </div>
            </template>
          </div>
        </template>
      </section>

      <!-- ══ ITINERARY ══════════════════════════ -->
      <section x-show="tab === 'itinerary'" role="tabpanel" id="panel-itinerary"
               aria-labelledby="tab-itinerary" tabindex="0">
        <div class="section-head">
          <h2 class="section-title">Itinerary</h2>
          <div class="btn-row">
            <button type="button" class="btn btn-sm btn-danger"
                    x-show="itinShow !== 'WEATHER'"
                    :disabled="!itinSelected.length"
                    @click="itinBulkOpen = true">
              Delete selected<span x-show="itinSelected.length"
                                   x-text="` (${itinSelected.length})`"></span>
            </button>
            <button type="button" class="btn btn-primary btn-sm" @click="openAddEntry()">
              + Add itinerary item
            </button>
          </div>
        </div>
        <p class="scope-hint" x-show="hiddenLabel('itinerary')" x-cloak>
          Showing your part · <strong x-text="hiddenLabel('itinerary')"></strong> on the whole trip ·
          <button type="button" class="btn btn-ghost btn-sm" @click="setScope('trip')">Show whole trip</button>
        </p>

        <div class="toolbar">
          <span class="toolbar-label" id="itin-category-label">Category</span>
          <div class="chip-group" role="group" aria-labelledby="itin-category-label">
            <template x-for="cat in categories" :key="cat.value">
              <button type="button" class="chip"
                      :aria-pressed="itinCategoryFilters.includes(cat.value)"
                      @click="toggleItinCategory(cat.value)">
                <span x-text="cat.icon"></span><span x-text="cat.label"></span>
              </button>
            </template>
          </div>

          <span class="toolbar-label" id="itin-show-label">Show</span>
          <div class="chip-group" role="group" aria-labelledby="itin-show-label">
            <template x-for="option in ['ALL', 'WEATHER', 'ITINERARY']" :key="option">
              <button type="button" class="chip" :aria-pressed="itinShow === option"
                      @click="itinShow = option"
                      x-text="option === 'ALL' ? 'All'
                              : (option === 'WEATHER' ? 'Weather only' : 'Itinerary only')"></button>
            </template>
          </div>

        </div>

        <p class="tiny muted" x-show="weatherLoading">Looking up the weather…</p>
        <p class="tiny muted" x-show="weatherFailed">
          The weather could not be looked up just now. Everything else is unaffected.
        </p>

        <!-- Only when both halves are empty. With weather rows on screen the
             itinerary is not empty even with nothing planned. -->
        <div class="empty-state" x-show="!itinerary.length && !filteredWeather.length">
          <div class="empty-icon">🗓</div>
          <h3 class="empty-title">Nothing planned yet</h3>
          <p class="empty-body">
            Open a checklist item and press Plan, or add an itinerary entry directly.
          </p>
          <button type="button" class="btn btn-primary" @click="openAddEntry()">Add an entry</button>
        </div>

        <div class="empty-state" x-show="itinShow === 'WEATHER' && !filteredWeather.length
                                         && !weatherLoading">
          <div class="empty-icon">🌤</div>
          <h3 class="empty-title">No days to show the weather for</h3>
          <p class="empty-body">
            A destination needs a start and an end date before its days appear here.
          </p>
        </div>

        <template x-for="day in itineraryDays" :key="day.date || 'undated'">
          <div class="timeline-day">
            <h3 class="timeline-date">
              <span x-text="day.label"></span>
              <span class="timeline-date-count" x-text="dayCount(day)"></span>
            </h3>

            <!-- Where the trip is that day. Not an itinerary entry: nothing
                 here is stored, so there is nothing to select or edit. -->
            <!-- One card per place the trip is that day, in two columns. When
                 the count is odd the first card takes the full width, so the
                 odd one out leads the block instead of dangling at the end.
                 The rule is stated here rather than as a structural CSS
                 selector because x-for leaves its own <template> in the DOM as
                 the first child, so :first-child never matches a card — see
                 CLAUDE.md, Traps. -->
            <div class="weather-locations" x-show="day.weather.length">
              <template x-for="(row, index) in day.weather" :key="row.key">
                <div class="weather-card"
                     :class="index === 0 && day.weather.length % 2 === 1 ? 'weather-card-wide' : ''">
                  <div class="weather-card-head">
                    <span class="weather-place" x-text="weatherPlace(row.day)"></span>
                    <span class="chip" x-show="weatherCountryLabel(row.day)"
                          x-text="weatherCountryLabel(row.day)"></span>
                  </div>

                  <div class="weather-line" x-show="weatherHasReading(row.day)">
                    <span class="weather-icon" x-text="weatherIcon(row.day)"></span>
                    <span class="weather-temps" x-text="weatherTemps(row.day)"></span>
                    <span class="weather-condition" x-show="weatherCondition(row.day)"
                          x-text="weatherCondition(row.day)"></span>
                    <span class="weather-badge" x-show="weatherBadge(row.day)"
                          :class="row.day.source === 'CLIMATE' ? 'weather-badge-typical' : ''"
                          x-text="weatherBadge(row.day)"></span>
                  </div>

                  <div class="weather-line weather-line-muted"
                       x-show="!weatherHasReading(row.day)"
                       :title="weatherUnavailableTitle(row.day)"
                       x-text="weatherUnavailableText(row.day)"></div>

                  <div class="weather-note tiny muted" x-show="weatherNote(row.day)"
                       x-text="weatherNote(row.day)"></div>
                </div>
              </template>
            </div>

            <div class="timeline-entries" x-show="day.entries.length">
              <template x-for="entry in day.entries" :key="entry.key">
                <div class="timeline-entry">
                  <label class="select-box select-box-tight">
                    <input type="checkbox" :checked="isItinSelected(entry.item.id)"
                           @change="toggleItinSelected(entry.item.id)"
                           :aria-label="`Select ${entry.item.description}`">
                  </label>
                  <span class="timeline-time" x-text="entryTime(entry)"></span>
                  <div class="timeline-body">
                    <div class="timeline-desc" x-text="entry.item.description"></div>
                    <template x-for="name in travellerNameList('itinerary', entry.item.id)" :key="name">
                    <span class="badge badge-traveller" x-text="'👥 ' + name"></span>
                  </template>
                    <!-- The category reads as one icon-and-label chip here too,
                         the way the checklist and budget rows show it. -->
                    <div class="timeline-meta">
                      <span class="chip">
                        <span x-text="categoryOf(entry.item.category).icon"></span>
                        <span x-text="categoryOf(entry.item.category).label"></span>
                      </span>
                      <template x-for="label in countryLabels(entry.item.countryCodes)" :key="label">
                        <span class="chip" x-text="label"></span>
                      </template>
                      <span x-show="sourceChecklist(entry.item)">
                        from “<span x-text="sourceChecklist(entry.item)"></span>”
                      </span>
                    </div>
                  </div>
                  <span class="timeline-cost" x-show="entry.cost" x-text="entryCost(entry)"></span>
                  <span class="timeline-actions btn-row">
                    <button type="button" class="btn btn-sm" @click="openEditEntry(entry.item)">Edit</button>
                  </span>
                </div>
              </template>
            </div>
          </div>
        </template>
      </section>

      <!-- ══ BUDGET ═════════════════════════════ -->
      <section x-show="tab === 'budget'" role="tabpanel" id="panel-budget"
               aria-labelledby="tab-budget" tabindex="0">
        <div class="section-head">
          <h2 class="section-title">Budget</h2>
          <div class="btn-row">
            <button type="button" class="btn btn-sm btn-danger"
                    :disabled="!budgetSelected.length"
                    @click="budgetBulkOpen = true">
              Delete selected<span x-show="budgetSelected.length"
                                   x-text="` (${budgetSelected.length})`"></span>
            </button>
            <button type="button" class="btn btn-primary btn-sm" @click="openAddExpense()">
              + Add expense
            </button>
          </div>
        </div>

        <div class="toolbar">
          <span class="toolbar-label" id="budget-category-label">Category</span>
          <div class="chip-group" role="group" aria-labelledby="budget-category-label">
            <template x-for="cat in categories" :key="cat.value">
              <button type="button" class="chip"
                      :aria-pressed="budgetCategoryFilters.includes(cat.value)"
                      @click="toggleBudgetCategory(cat.value)">
                <span x-text="cat.icon"></span><span x-text="cat.label"></span>
              </button>
            </template>
          </div>

          <!-- One at a time, unlike the Category filter beside it: these are
               four views of the same money, not four things to combine. The two
               Forecast ones count the expenses nobody has paid yet alongside
               the charges; the plain two count charges only. Every figure on
               the panel below follows this one control. -->
          <span class="toolbar-label" id="budget-show-label">Show</span>
          <div class="chip-group" role="group" aria-labelledby="budget-show-label">
            <template x-for="option in budgetShowOptions" :key="option.value">
              <button type="button" class="chip"
                      :aria-pressed="budgetShow === option.value"
                      @click="budgetShow = option.value"
                      x-text="option.label"></button>
            </template>
          </div>

        </div>

        <!-- Follows what the table lists rather than what the trip holds: a
             member who shares none of its expenses has an empty budget, even
             on a trip full of other people's. -->
        <div class="empty-state" x-show="!myBudgetItems.length">
          <div class="empty-icon">💰</div>
          <h3 class="empty-title" x-text="budget.items.length
                ? 'None of these expenses are yours'
                : 'No costs recorded yet'"></h3>
          <p class="empty-body" x-show="!budget.items.length">
            Put a cost on a plan and it appears here automatically, or add an expense by hand.
          </p>
          <p class="empty-body" x-show="budget.items.length">
            This trip has expenses, but none of them name you under “Shared by”.
            Open one from the Itinerary tab, or add your own.
          </p>
          <button type="button" class="btn btn-primary" @click="openAddExpense()">Add an expense</button>
        </div>

        <div x-show="myBudgetItems.length">
          <div class="card" style="margin-bottom:16px">
            <div class="budget-summary">
              <!-- Chart.js draws the pie; the library is vendored in
                   vendor/chart.umd.js, not fetched from a CDN. -->
              <div class="budget-pie" x-effect="renderBudgetPie()"
                   x-show="budgetBreakdown.length">
                <canvas x-ref="budgetPie" role="img"
                        :aria-label="`${budgetForecast ? 'Forecast spend' : 'Spend'} by ${budgetShow.startsWith('country') ? 'country' : 'category'}`"></canvas>
              </div>

              <div class="budget-details">
                <div class="budget-total-row">
                  <div class="budget-total-value" x-text="totalLabel()"></div>
                  <!-- Read-only: rates are fetched daily for the whole install
                       (see RatesRefresher), so this only says when they last
                       came in. -->
                  <span class="budget-rates-note" x-text="ratesNote()"></span>
                </div>
                <div class="tiny muted" x-text="totalCaption()"></div>
                <div class="budget-native-totals" x-show="nativeTotalsLabel"
                     x-text="`Native: ${nativeTotalsLabel}`"></div>

                <ul class="budget-legend">
                  <template x-for="slice in budgetBreakdown" :key="slice.key">
                    <li class="budget-legend-row">
                      <div class="budget-legend-head">
                        <span class="budget-legend-swatch" :style="`background:${slice.color}`"></span>
                        <span class="budget-legend-label">
                          <span x-text="slice.icon"></span> <span x-text="slice.label"></span>
                        </span>
                        <span class="budget-legend-percent" x-text="barPercent(slice.amount)"></span>
                        <span class="budget-legend-amount"
                              x-text="fmt(slice.amount, budget.totalsCurrency)"></span>
                      </div>
                      <div class="bar-track">
                        <div class="bar-fill"
                             :style="`width:${barWidth(slice.amount)}%;background:${slice.color}`"></div>
                      </div>
                    </li>
                  </template>
                </ul>

                <div class="alert alert-warning" x-show="missingRates.length" style="margin-top:12px">
                  Not included in the total — today's rates carry no quote for
                  <template x-for="code in missingRates" :key="code">
                    <span class="chip" x-text="code"></span>
                  </template>.
                </div>
              </div>
            </div>
          </div>

          <p class="small muted" x-show="!filteredBudgetItems.length">
            Nothing matches those filters.
          </p>

          <div class="table-wrap" x-show="filteredBudgetItems.length">
            <table class="table table-cards">
              <thead>
                <tr>
                  <th class="select-cell"><span class="sr-only">Select</span></th>
                  <th>Description</th><th>Category</th>
                  <th class="num">Amount</th>
                  <th class="num">Shared Amount</th>
                  <th>Paid by</th>
                  <th>Status</th>
                  <th>Date</th><th>Source</th><th class="actions"></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="item in pagedBudgetItems" :key="item.id">
                  <tr>
                    <td class="select-cell">
                      <input type="checkbox" :checked="isBudgetSelected(item.id)"
                             @change="toggleBudgetSelected(item.id)"
                             :aria-label="`Select ${item.description}`">
                    </td>
                    <td class="wrap cell-title" x-text="item.description"></td>
                    <!-- Same icon-and-label chip the checklist and itinerary
                         rows use, so a category reads the same everywhere. -->
                    <td class="cell-chips">
                      <div class="chip-group">
                        <span class="chip">
                          <span x-text="categoryOf(item.category).icon"></span>
                          <span x-text="categoryOf(item.category).label"></span>
                        </span>
                        <template x-for="label in countryLabels(item.countryCodes)" :key="label">
                          <span class="chip" x-text="label"></span>
                        </template>
                      </div>
                    </td>
                    <!-- The whole expense, as recorded. The column beside it
                         is this member's part of it — the two differ exactly
                         when more than one name is on the row. Both name their
                         own currency, because they are rarely the same one:
                         the amount is what was spent, the share is converted. -->
                    <td class="num" data-label="Amount" x-text="fmt(item.amount, item.currency)"></td>
                    <td class="num cell-emphasis" data-label="Your share"
                        x-text="convertedShareOf(item) == null
                                ? '—' : fmt(convertedShareOf(item), budget.totalsCurrency)"></td>
                    <!-- Who put the money down. Informational only: the share
                         beside it is decided by "Shared by" alone. -->
                    <td data-label="Paid by" x-text="paidByLabel(item)"></td>
                    <!-- A pending row is listed like any other. It is only
                         left out of the total that claims to be money spent. -->
                    <td data-label="Status">
                      <span class="chip" :class="item.status === 'PENDING' ? 'chip-pending' : 'chip-charged'"
                            x-text="statusLabel(item)"></span>
                    </td>
                    <td class="muted" data-label="Date" x-text="expenseDate(item)"></td>
                    <td class="tiny muted" data-label="Source">
                      <span x-show="item.itineraryItemId"
                            :title="sourcePlan(item)">From plan</span>
                      <span x-show="!item.itineraryItemId">Manual</span>
                    </td>
                    <td class="actions">
                      <span class="btn-row">
                        <button type="button" class="btn btn-sm"
                                @click="openEditExpense(item)">Edit</button>
                      </span>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <!-- Shown only when there is more than one page. The figures above
               the table cover every page; only the rows are paged. -->
          <nav class="pager" x-show="budgetPageCount > 1" aria-label="Budget table pages">
            <span class="pager-status"
                  x-text="`Showing ${budgetPageFrom}–${budgetPageTo} of ${filteredBudgetItems.length}`"></span>
            <span class="pager-controls">
              <button type="button" class="btn btn-sm" :disabled="budgetCurrentPage <= 1"
                      @click="goToBudgetPage(budgetCurrentPage - 1)">← Previous</button>
              <span class="pager-page" aria-live="polite"
                    x-text="`Page ${budgetCurrentPage} of ${budgetPageCount}`"></span>
              <button type="button" class="btn btn-sm" :disabled="budgetCurrentPage >= budgetPageCount"
                      @click="goToBudgetPage(budgetCurrentPage + 1)">Next →</button>
            </span>
          </nav>
        </div>

        <!-- ── Settle Expenses ───────────────────────────────────────────
             Who owes whom, from the charged rows alone. Deliberately not tied
             to the Group by selector above: a forecast debt would be money
             nobody has spent. -->
        <div class="card settle">
          <div class="section-head">
            <h3 class="section-title" id="settle-title">Settle Expenses</h3>
          </div>
          <p class="settle-note">
            Based on charged expenses only, in the currency each was paid in.
          </p>

          <p class="empty" x-show="!hasSettlements" x-cloak>
            Nothing to settle — nobody has paid for anybody else's share yet.
          </p>

          <div class="table-wrap" x-show="hasSettlements" x-cloak>
            <table class="table table-cards" aria-labelledby="settle-title">
              <thead>
                <tr>
                  <th>Travel Buddy</th>
                  <th class="num">Owes you</th>
                  <th class="num">You owe</th>
                  <th class="num">Net</th>
                  <th class="actions"><span class="sr-only">Details</span></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="row in settleRows" :key="row.otherUserId + row.currency">
                  <tr>
                    <td class="cell-title" x-text="settleMemberName(row.otherUserId)"></td>
                    <td data-label="Owes you" class="num" x-text="fmt(row.owesYou, row.currency)"></td>
                    <td data-label="You owe" class="num" x-text="fmt(row.youOwe, row.currency)"></td>
                    <!-- "(to pay)" / "(to receive)" rather than a minus sign:
                         the direction is the whole point of this column, and a
                         sign is the one part of a figure a reader skims past. -->
                    <td data-label="Net" class="num">
                      <span :class="settleNetClass(row)" x-text="settleNetLabel(row)"></span>
                    </td>
                    <td class="actions">
                      <span class="btn-row">
                        <button type="button" class="btn btn-sm"
                                @click="openSettleDetails(row)"
                                :aria-label="`View details: ${settleSummaryLine(row)}`">
                          View details
                        </button>
                      </span>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- ══ PUBLISH ════════════════════════════ -->
      <section x-show="tab === 'publish'" role="tabpanel" id="panel-publish"
               aria-labelledby="tab-publish" tabindex="0">
        <div class="section-head">
          <h2 class="section-title">Publish</h2>
        </div>

        <!-- Published -->
        <div class="card" x-show="isPublished" style="margin-bottom:16px">
          <div class="card-header">
            <h3 class="card-title">This trip is published</h3>
            <span class="badge badge-published">Live</span>
          </div>
          <p class="small muted">
            Anyone with this link can see the trip — no sign-in needed.
            Last published <span x-text="publishedAtLabel()"></span>.
          </p>
          <div class="publish-url">
            <span x-ref="publicUrl" class="grow" x-text="publish.publicUrl"></span>
            <button type="button" class="btn btn-sm" @click="copyLink()"
                    x-text="copied ? 'Copied ✓' : 'Copy link'"></button>
          </div>

          <!-- Only when this member asked for one in Account → Appearance, and
               only once a publish has actually written it. A static page has no
               sign-in, so whose budget it shows is decided when the file is
               written — which is why it is a second page rather than a filter
               on the first. -->
          <p class="small muted publish-own-page" x-show="publish.myPublicUrl">
            Your own page — the same trip, showing your share of each expense
            instead of the total. Nobody else's figures are in it.
          </p>
          <!-- One row for every action on the live page, wrapping on a phone.
               x-show rather than x-if for "Open my page", so the buttons stay
               siblings in the same flex row. -->
          <div class="publish-actions">
            <a class="btn btn-sm" :href="publish.publicUrl" target="_blank" rel="noopener">
              Open public page
            </a>
            <a class="btn btn-sm" x-show="publish.myPublicUrl" :href="publish.myPublicUrl"
               target="_blank" rel="noopener">
              Open my page
            </a>
            <button type="button" class="btn btn-sm" x-show="isOwner" :disabled="publishBusy"
                    @click="doPublish()" x-text="publishBusy ? 'Working…' : 'Re-publish (update)'"></button>
            <button type="button" class="btn btn-sm btn-danger" x-show="isOwner"
                    @click="confirmingUnpublish = true">Unpublish</button>
          </div>
        </div>

        <!-- Draft, owner -->
        <div class="card" x-show="!isPublished && isOwner" style="margin-bottom:16px">
          <div class="card-header"><h3 class="card-title">Ready to share?</h3></div>
          <p class="small muted">
            You can publish at any point, however unfinished the plan is — publishing again
            later updates the page.
          </p>
          <!-- No theme picker: the page is published in whatever theme you are
               looking at, so the choice is the selector in the header. -->
          <p class="small muted">
            The public page will use your current theme,
            <strong x-text="themeToPublishLabel"></strong>. Switch theme and publish
            again to restyle it.
          </p>
          <button type="button" class="btn btn-primary" @click="confirmingPublish = true">
            Publish trip
          </button>
        </div>

        <!-- Draft, non-owner -->
        <div class="card" x-show="!isPublished && !isOwner" style="margin-bottom:16px">
          <div class="card-header"><h3 class="card-title">Ask the owner to publish</h3></div>
          <p class="small muted">
            Only <span x-text="ownerName()"></span> can publish this trip. Send a request and
            they can approve it. The page is built now, in your theme
            (<strong x-text="themeToPublishLabel"></strong>) and your own
            published-page settings — nothing is public, and there is no link,
            until they approve.
          </p>

          <template x-if="myPendingRequest">
            <div>
              <div class="alert alert-info">
                Requested — waiting for <span x-text="ownerName()"></span>.
              </div>
              <button type="button" class="btn btn-sm"
                      @click="cancelRequest(myPendingRequest)">Cancel request</button>
            </div>
          </template>

          <template x-if="!myPendingRequest">
            <form @submit.prevent="requestPublish()">
              <div class="field">
                <label for="request-note">Note for the owner (optional)</label>
                <input id="request-note" x-model="requestNote"
                       placeholder="Ready to share with travel buddies">
              </div>
              <button type="submit" class="btn btn-primary" :disabled="publishBusy"
                      x-text="publishBusy ? 'Sending…' : 'Request to Publish'"></button>
            </form>
          </template>
        </div>

        <!-- Pending requests, owner -->
        <div class="card" x-show="isOwner && pendingRequests.length">
          <div class="card-header">
            <h3 class="card-title">Publish requests</h3>
            <span class="badge badge-pending" x-text="pendingRequests.length"></span>
          </div>
          <template x-for="request in pendingRequests" :key="request.id">
            <div class="publish-request-row">
              <div class="grow">
                <div class="small strong" x-text="request.requestedByDisplayName"></div>
                <div class="tiny muted" x-text="requestedAtLabel(request)"></div>
              </div>
              <span class="btn-row">
                <!-- The page already exists, built in the requester's own theme
                     and settings when they asked. Approving moves it into
                     place unchanged, so this is the last chance to see what
                     goes public. Members only, and not the public URL — there
                     is no public URL until it is approved. -->
                <a class="btn btn-sm" :href="publishPreviewUrl"
                   target="_blank" rel="noopener">Preview</a>
                <button type="button" class="btn btn-sm btn-primary" :disabled="publishBusy"
                        @click="approveRequest(request)">Approve &amp; publish</button>
                <button type="button" class="btn btn-sm btn-danger"
                        @click="rejectRequest(request)">Reject</button>
              </span>
            </div>
          </template>
        </div>

        <div class="card" x-show="recentRequests.length" style="margin-top:16px">
          <div class="card-header"><h3 class="card-title">Recent requests</h3></div>
          <template x-for="request in recentRequests" :key="request.id">
            <div class="publish-request-row">
              <div class="grow small">
                <span x-text="request.requestedByDisplayName"></span>
                <span class="tiny muted" x-text="` · ${decidedAtLabel(request)}`"></span>
              </div>
              <span class="badge" x-text="requestStatusLabel(request.status)"></span>
            </div>
          </template>
          <p class="tiny muted" x-show="decidedRequests.length > recentRequests.length"
             x-text="`Showing the ${recentRequests.length} most recent of ${decidedRequests.length}.`"></p>
        </div>
      </section>

      <!-- ══ CHECKLIST DETAIL DRAWER ════════════ -->
      <div class="drawer-backdrop panel-switchable" x-show="openItem" x-cloak @click.self="requestCloseDrawer()"
           @keydown.escape.window="requestCloseDrawer()">
        <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"
             x-dialog="openItem" x-show="openItem" @click.stop>
          <!-- Kept in the DOM rather than wrapped in x-if, so the selects below
               always have their options before a value is assigned to them. -->
          <div>
            <div>
              <div class="drawer-header">
                <div>
                  <div class="drawer-eyebrow" x-text="categoryOf(openItem?.category).label"></div>
                  <h2 class="drawer-title" id="drawer-title" x-text="openItem?.description"></h2>
                  <span class="badge" :class="openItem?.status === 'COMPLETED' ? 'badge-done' : 'badge-todo'"
                        x-text="openItem?.status === 'COMPLETED' ? 'Completed' : 'To do'"></span>
                </div>
                <button type="button" class="modal-close" @click="requestCloseDrawer()" aria-label="Close">✕</button>
              </div>

              <div class="alert alert-error" x-show="drawerError" x-text="drawerError" x-cloak></div>

              <!-- Raised by requestCloseDrawer(): Escape, the backdrop and ✕
                   used to throw a half-written note away without a word. -->
              <div class="alert alert-warning" role="alert" x-show="drawerDiscardAsk" x-cloak>
                You have unsaved changes to this item.
                <div class="row row-end" style="margin-top:8px">
                  <button type="button" class="btn btn-sm" x-ref="drawerKeepEditing"
                          @click="drawerDiscardAsk = false">Keep editing</button>
                  <button type="button" class="btn btn-sm btn-danger" @click="closeDrawer()">Discard</button>
                </div>
              </div>

              <!-- edit the item itself -->
              <div class="drawer-section">
                <h3 class="drawer-section-title">Details</h3>
                <div class="field">
                  <label for="drawer-description">Description</label>
                  <textarea id="drawer-description" x-model="drawerForm.description"
                            maxlength="300"></textarea>
                </div>
                <div class="field">
                  <label for="drawer-note">Note (optional)</label>
                  <textarea id="drawer-note" x-model="drawerForm.note"
                            placeholder="Anything worth remembering — booking references, who is handling it"></textarea>
                </div>
                <div class="field-row">
                  <div class="field">
                    <label for="drawer-category">Category</label>
                    <select id="drawer-category" x-model="drawerForm.category">
                      <template x-for="cat in categories" :key="cat.value">
                        <option :value="cat.value" x-text="`${cat.icon} ${cat.label}`"></option>
                      </template>
                    </select>
                  </div>
                </div>
                <div class="field">
                  <label id="drawer-destination-label">Location (optional)</label>
                  <div class="chip-group" role="group" aria-labelledby="drawer-destination-label">
                    <template x-for="country in tripCountries" :key="country.code">
                      <button type="button" class="chip"
                              :aria-pressed="drawerForm.countryCodes.includes(country.code)"
                              @click="toggleLocation(drawerForm.countryCodes, country.code)"
                              x-text="country.label"></button>
                    </template>
                    <span class="tiny muted" x-show="!tripCountries.length">No countries yet</span>
                  </div>
                </div>
                <div class="field">
                  <label id="drawer-going-label">Who's coming along?</label>
                  <p class="field-hint" x-show="drawerForm.travellers.mode === 'inherit'">
                    Same as <span x-text="checklistParentLabel(openItem)"></span>:
                    <template x-for="name in nameList(checklistInherited(openItem))" :key="name"><span class="badge badge-traveller" x-text="name"></span></template><span x-show="!nameList(checklistInherited(openItem)).length">everyone</span>
                    <button type="button" class="btn btn-ghost btn-sm"
                            @click="chooseTravellers(drawerForm.travellers, checklistInherited(openItem))">Choose…</button>
                  </p>
                  <div class="chip-group" role="group" aria-labelledby="drawer-going-label"
                       x-show="drawerForm.travellers.mode !== 'inherit'">
                    <button type="button" class="chip" :aria-pressed="drawerForm.travellers.mode === 'everyone'"
                            @click="everyoneGoes(drawerForm.travellers)">Everyone</button>
                    <template x-for="person in tripSharers" :key="person.userId">
                      <button type="button" class="chip" :aria-pressed="drawerForm.travellers.ids.includes(person.userId)"
                              @click="toggleTraveller(drawerForm.travellers, person.userId)" x-text="person.label"></button>
                    </template>
                    <button type="button" class="btn btn-ghost btn-sm" @click="followParent(drawerForm.travellers)"
                x-text="'Back to ' + checklistParentLabel(openItem) + '\'s'"></button>
                  </div>
                </div>
                <button type="button" class="btn" :disabled="drawerBusy"
                        @click="saveDrawer()" x-text="drawerBusy ? 'Saving…' : 'Save changes'"></button>
              </div>

              <!-- plans -->
              <div class="drawer-section">
                <h3 class="drawer-section-title">
                  Plans<span x-show="openItemPlans.length" x-text="` (${openItemPlans.length})`"></span>
                </h3>

                <p class="small muted" x-show="!openItemPlans.length && !planOpen">
                  No plans yet. Press Plan to record a flight, booking or activity —
                  add as many as this needs.
                </p>

                <template x-for="plan in openItemPlans" :key="plan.id">
                  <div class="plan-card">
                    <div class="plan-when">
                      <span x-text="planWhen(plan)"></span>
                      <span class="chip" x-show="planNights(plan)"
                            x-text="planNights(plan)"></span>
                    </div>
                    <div class="plan-desc" x-text="plan.description"></div>
                    <div class="row row-between">
                      <span class="plan-cost" x-show="plan.cost" x-text="planCost(plan)"></span>
                      <span class="btn-row">
                        <button type="button" class="btn btn-sm" @click="editPlan(plan)">Edit</button>
                        <button type="button" class="btn btn-sm btn-danger"
                                @click="deletePlan(plan)">Delete</button>
                      </span>
                    </div>
                  </div>
                </template>

                <!-- the Plan form -->
                <div class="card card-tight" x-show="planOpen" x-cloak style="margin-top:12px">
                  <div class="alert alert-error" x-show="planError" x-text="planError" x-cloak></div>

                  <div class="field">
                    <label for="plan-description">Description</label>
                    <input id="plan-description" x-ref="planDescription"
                           x-model="planForm.description" maxlength="300">
                    <p class="field-hint">Pre-filled as a starting point — edit it to match reality.</p>
                  </div>

                  <div class="field">
                    <label id="plan-destination-label">Location (optional)</label>
                    <div class="chip-group" role="group" aria-labelledby="plan-destination-label">
                      <template x-for="country in tripCountries" :key="country.code">
                        <button type="button" class="chip"
                                :aria-pressed="planForm.countryCodes.includes(country.code)"
                                @click="toggleLocation(planForm.countryCodes, country.code)"
                                x-text="country.label"></button>
                      </template>
                      <span class="tiny muted" x-show="!tripCountries.length">No countries yet</span>
                    </div>
                  </div>

                  <div class="field-row">
                    <div class="field">
                      <label for="plan-start-date">Start date</label>
                      <input id="plan-start-date" type="date" x-model="planForm.startDate" :min="trip.startDate" :max="trip.endDate">
                    </div>
                    <div class="field">
                      <label for="plan-start-time">Start time</label>
                      <input id="plan-start-time" type="time" x-model="planForm.startTime">
                    </div>
                  </div>
                  <div class="field-row">
                    <div class="field">
                      <label for="plan-end-date">End date</label>
                      <input id="plan-end-date" type="date" x-model="planForm.endDate" :min="trip.startDate" :max="trip.endDate">
                    </div>
                    <div class="field">
                      <label for="plan-end-time">End time</label>
                      <input id="plan-end-time" type="time" x-model="planForm.endTime">
                    </div>
                  </div>

                  <div class="field">
                    <label id="plan-going-label">Who's coming along?</label>
                    <p class="field-hint" x-show="planForm.travellers.mode === 'inherit'">
                      Same as <span x-text="planParentLabel()"></span>:
                      <template x-for="name in nameList(planInherited())" :key="name"><span class="badge badge-traveller" x-text="name"></span></template><span x-show="!nameList(planInherited()).length">everyone</span>
                      <button type="button" class="btn btn-ghost btn-sm"
                              @click="chooseTravellers(planForm.travellers, planInherited())">Choose…</button>
                    </p>
                    <div class="chip-group" role="group" aria-labelledby="plan-going-label"
                         x-show="planForm.travellers.mode !== 'inherit'">
                      <button type="button" class="chip" :aria-pressed="planForm.travellers.mode === 'everyone'"
                              @click="everyoneGoes(planForm.travellers)">Everyone</button>
                      <template x-for="person in tripSharers" :key="person.userId">
                        <button type="button" class="chip" :aria-pressed="planForm.travellers.ids.includes(person.userId)"
                                @click="toggleTraveller(planForm.travellers, person.userId)" x-text="person.label"></button>
                      </template>
                      <button type="button" class="btn btn-ghost btn-sm" @click="followParent(planForm.travellers)"
                              x-text="'Back to ' + planParentLabel() + '\'s'"></button>
                    </div>
                  </div>

                  <div class="field-row">
                    <div class="field">
                      <label for="plan-cost">Total Cost (optional)</label>
                      <input id="plan-cost" type="number" step="0.01" min="0" x-model="planForm.cost">
                    </div>
                    <div class="field">
                      <label for="plan-currency">Currency</label>
                      <select id="plan-currency" x-model="planForm.currency">
                        <template x-for="code in entryCurrencies" :key="code">
                          <option :value="code" x-text="code"></option>
                        </template>
                      </select>
                    </div>
                  </div>
                  <p class="field-hint" style="margin-top:-8px">
                    Adding a cost creates a matching budget entry.
                  </p>
                  <!-- Unticked by default, the reverse of the budget's own
                       form: a plan is something you intend to do, and its cost
                       is usually money still to leave. -->
                  <div class="field" x-show="planForm.cost">

                    <label id="plan-paid-by-label">Paid by</label>
                    <div class="chip-group" role="group" aria-labelledby="plan-paid-by-label">
                      <template x-for="person in tripSharers" :key="person.userId">
                        <button type="button" class="chip"
                                :aria-pressed="planForm.paidByUserId === person.userId"
                                @click="choosePayer(planForm, person.userId)"
                                x-text="person.label"></button>
                      </template>
                      <label class="checkbox">
                        <input type="checkbox" x-model="planForm.costCharged"
                               @change="chargedToggled(planForm, currentUserId, $event.target.checked)">
                        Expense already charged
                      </label>
                    </div>
                  </div>

                  <div class="field" x-show="planForm.cost">
                    <label id="plan-shared-label">Shared by</label>
                    <div class="chip-group" role="group" aria-labelledby="plan-shared-label">
                      <button type="button" class="chip"
                              :aria-pressed="sharedWithEveryone(planSharersShown())"
                              @click="planForm.sharedTouched = true; shareWithEveryone(planForm.sharedByUserIds)">Everyone</button>
                      <template x-for="person in tripSharers" :key="person.userId">
                        <button type="button" class="chip"
                                :aria-pressed="planSharersShown().includes(person.userId)"
                                @click="togglePlanSharer(person.userId)"
                                x-text="person.label"></button>
                      </template>
                    </div>
                  </div>

                  <div class="row row-end" style="margin-top:12px">
                    <button type="button" class="btn" @click="planOpen = false">Cancel</button>
                    <button type="button" class="btn btn-primary" :disabled="planBusy"
                            @click="savePlan()" x-text="planBusy ? 'Saving…' : 'Save plan'"></button>
                  </div>
                </div>
              </div>

              <!-- completion and deletion -->
              <div class="drawer-footer">
                <button type="button" class="btn btn-primary"
                        x-show="openItem?.status !== 'COMPLETED'"
                        @click="askComplete(openItem)">Set this Checklist to Complete</button>
                <button type="button" class="btn"
                        x-show="openItem?.status === 'COMPLETED'"
                        @click="setCheckStatus('TODO')">Reopen</button>
                <!-- Planning a completed item is not a thing: reopen it first. -->
                <button type="button" class="btn"
                        x-show="!planOpen && openItem?.status !== 'COMPLETED'"
                        @click="openPlanForm()"
                        x-text="openItemPlans.length ? 'Plan another' : 'Plan'"></button>
                <button type="button" class="btn btn-danger" @click="deletingCheck = true">Delete</button>
              </div>

              <div class="alert alert-error" x-show="deletingCheck" x-cloak style="margin-top:12px">
                Delete this checklist item? Its plans stay on the itinerary.
                <div class="row row-end" style="margin-top:8px">
                  <button type="button" class="btn btn-sm" @click="deletingCheck = false">Keep it</button>
                  <button type="button" class="btn btn-sm btn-danger"
                          @click="confirmDeleteCheck()">Delete</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ══ MODALS ═════════════════════════════ -->

      <!-- Edit trip -->
      <div class="modal-backdrop" x-show="editOpen" x-cloak @click.self="editOpen = false"
           @keydown.escape.window="editOpen = false">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-trip-title"
             x-dialog="editOpen">
          <div class="modal-header">
            <h2 class="modal-title" id="edit-trip-title">Edit trip</h2>
            <button type="button" class="modal-close" @click="editOpen = false" aria-label="Close">✕</button>
          </div>
          <div class="alert alert-error" x-show="editError" x-text="editError" x-cloak></div>
          <form @submit.prevent="saveEdit()">
            <div class="field">
              <label for="edit-title">Title</label>
              <input id="edit-title" x-model="editForm.title" maxlength="120" required>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="edit-start">Start date</label>
                <input id="edit-start" type="date" x-model="editForm.startDate" required>
              </div>
              <div class="field">
                <label for="edit-end">End date</label>
                <input id="edit-end" type="date" x-model="editForm.endDate" required>
              </div>
              <div class="field">
                <label for="edit-currency">Budget currency</label>
                <select id="edit-currency" x-model="editForm.displayCurrency">
                  <template x-for="code in entryCurrencies" :key="code">
                    <option :value="code" x-text="code"></option>
                  </template>
                </select>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn" @click="editOpen = false">Cancel</button>
              <button type="submit" class="btn btn-primary" :disabled="editBusy"
                      x-text="editBusy ? 'Saving…' : 'Save changes'"></button>
            </div>
          </form>
        </div>
      </div>

      <!-- Delete trip -->
      <div class="modal-backdrop" x-show="deletingTrip" x-cloak @click.self="deletingTrip = false"
           @keydown.escape.window="deletingTrip = false">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="delete-trip-title"
             x-dialog="deletingTrip">
          <div class="modal-header">
            <h2 class="modal-title" id="delete-trip-title">Delete this trip?</h2>
            <button type="button" class="modal-close" @click="deletingTrip = false" aria-label="Close">✕</button>
          </div>
          <p class="small">
            This permanently removes <strong x-text="trip.title"></strong> and everything in it,
            for every travel buddy. It cannot be undone.
          </p>
          <div class="field">
            <label for="delete-confirm">Type the trip title to confirm</label>
            <input id="delete-confirm" x-model="deleteConfirm" :placeholder="trip.title">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn" @click="deletingTrip = false">Cancel</button>
            <button type="button" class="btn btn-danger" :disabled="deleteConfirm !== trip.title"
                    @click="confirmDeleteTrip()">Delete trip</button>
          </div>
        </div>
      </div>

      <!-- Remove member -->
      <div class="modal-backdrop" x-show="removingMember" x-cloak @click.self="removingMember = null"
           @keydown.escape.window="removingMember = null">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="remove-member-title"
             x-dialog="removingMember">
          <div class="modal-header">
            <h2 class="modal-title" id="remove-member-title"
                x-text="isSelf(removingMember || {}) ? 'Leave this trip?' : 'Remove this travel buddy?'"></h2>
            <button type="button" class="modal-close" @click="removingMember = null" aria-label="Close">✕</button>
          </div>
          <p class="small" x-show="removingMember && !isSelf(removingMember)">
            <strong x-text="removingMember?.displayName"></strong> will lose access to this trip.
            Their account and their other trips are unaffected.
          </p>
          <p class="small" x-show="removingMember && isSelf(removingMember)">
            You will lose access to this trip. Another travel buddy can add you again.
          </p>
          <div class="modal-footer">
            <button type="button" class="btn" @click="removingMember = null">Cancel</button>
            <button type="button" class="btn btn-danger" @click="confirmRemoveMember()"
                    x-text="isSelf(removingMember || {}) ? 'Leave trip' : 'Remove'"></button>
          </div>
        </div>
      </div>

      <!-- Add / edit destination -->
      <div class="modal-backdrop panel-switchable" x-show="destFormOpen" x-cloak @click.self="closeDestinationForm()"
           @keydown.escape.window="closeDestinationForm()">
        <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="dest-title"
             x-dialog="destFormOpen">
          <div class="modal-header">
            <h2 class="modal-title" id="dest-title"
                x-text="destForm.id ? 'Edit destination' : 'Add destination'"></h2>
            <button type="button" class="modal-close" @click="closeDestinationForm()"
                    aria-label="Close">✕</button>
          </div>
          <div class="alert alert-error" x-show="destError" x-text="destError" x-cloak></div>

          <form @submit.prevent="saveDestination()">
            <div class="field autocomplete">
              <label for="dest-name">Name</label>
              <input id="dest-name" x-ref="destName" x-model="destForm.name"
                     @input="onDestNameInput()"
                     @keydown.escape.prevent.stop="dismissSuggestions()"
                     @blur="dismissSuggestions()"
                     autocomplete="off" maxlength="120"
                     placeholder="Cusco" required>

              <!-- Suggestions are a convenience: free text always saves.
                   The list sits over the fields below it, so it has to be
                   escapable: the options are not tab stops (Tab goes to
                   Country code, not into the list), Escape and moving focus
                   away both close it, and the footer says so for the mouse.
                   Each option suppresses mousedown so that closing-on-blur
                   does not swallow the click that picks it. -->
              <ul class="autocomplete-list" x-show="suggestions.length" x-cloak>
                <template x-for="place in suggestions" :key="place.geonameId">
                  <li>
                    <button type="button" class="autocomplete-option" tabindex="-1"
                            @mousedown.prevent @click="pickSuggestion(place)">
                      <span class="autocomplete-name">
                        <span x-show="place.countryFlag" x-text="place.countryFlag"></span>
                        <span x-text="place.name"></span>
                      </span>
                      <span class="autocomplete-meta" x-text="suggestionMeta(place)"></span>
                    </button>
                  </li>
                </template>
                <li>
                  <button type="button" class="autocomplete-freetext" tabindex="-1"
                          @mousedown.prevent @click="keepTypedName()">
                    Not here? Keep “<span x-text="destForm.name"></span>” as typed
                  </button>
                </li>
              </ul>

              <p class="autocomplete-status" x-show="lookupBusy">Looking up places…</p>
              <p class="field-hint" x-show="lookupRan && !suggestions.length && !lookupBusy">
                No match found — that is fine. Save the name as you typed it and
                fill in the coordinates below if you want them.
              </p>
            </div>

            <!-- Typed like the name field above, but unlike it only a real
                 country may come out: resolveCountry accepts an exact name or
                 code, clears on empty, and otherwise snaps back to whatever
                 was already chosen. The code beside it is derived, never
                 typed, so the two can never disagree. -->
            <div class="field-row">
              <div class="field autocomplete">
                <label for="dest-country">Country</label>
                <input id="dest-country" x-model="countryQuery"
                       @input="onCountryInput()"
                       @focus="onCountryInput()"
                       @keydown.escape.prevent.stop="resolveCountry()"
                       @blur="resolveCountry()"
                       autocomplete="off" placeholder="Start typing — Peru">

                <ul class="autocomplete-list" x-show="countryListOpen && countryMatches.length" x-cloak>
                  <template x-for="option in countryMatches" :key="option.code">
                    <li>
                      <button type="button" class="autocomplete-option" tabindex="-1"
                              @mousedown.prevent @click="pickCountry(option)">
                        <span class="autocomplete-name">
                          <span x-show="option.flag" x-text="option.flag"></span>
                          <span x-text="option.name"></span>
                        </span>
                        <span class="autocomplete-meta" x-text="option.code"></span>
                      </button>
                    </li>
                  </template>
                </ul>

                <p class="field-hint"
                   x-show="countryQuery.trim() && !destForm.countryCode" x-cloak>
                  Pick one from the list — the code comes from it.
                </p>
              </div>
              <div class="field">
                <label for="dest-country-code">Country code</label>
                <input id="dest-country-code" x-model="destForm.countryCode"
                       readonly tabindex="-1" placeholder="—"
                       style="text-transform:uppercase">
                <p class="field-hint">Comes from the country you pick.</p>
              </div>
            </div>

            <div class="coord-inputs">
              <div class="field">
                <label for="dest-lat">Latitude</label>
                <input id="dest-lat" type="number" step="any" min="-90" max="90"
                       x-model="destForm.latitude" placeholder="-13.53188">
              </div>
              <div class="field">
                <label for="dest-lon">Longitude</label>
                <input id="dest-lon" type="number" step="any" min="-180" max="180"
                       x-model="destForm.longitude" placeholder="-71.96701">
              </div>
            </div>

            <div class="field-row">
              <div class="field">
                <label for="dest-start">Start date (optional)</label>
                <input id="dest-start" type="date" x-model="destForm.startDate" :min="trip.startDate" :max="trip.endDate">
              </div>
              <div class="field">
                <label for="dest-end">End date (optional)</label>
                <input id="dest-end" type="date" x-model="destForm.endDate" :min="trip.startDate" :max="trip.endDate">
              </div>
            </div>
            <p class="field-hint" style="margin-top:-8px" x-show="destForm.id">
              If these dates come to cover a night, an accommodation checklist item
              is added now. Shortening the stay never removes one.
            </p>

            <div class="field">
