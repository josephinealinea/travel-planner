           @keydown.escape.window="expenseOpen = false">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="expense-title">
          <div class="modal-header">
            <h2 class="modal-title" id="expense-title"
                x-text="expenseForm.id ? 'Edit expense' : 'Add expense'"></h2>
            <button type="button" class="modal-close" @click="expenseOpen = false"
                    aria-label="Close">✕</button>
          </div>
          <div class="alert alert-error" x-show="expenseError" x-text="expenseError" x-cloak></div>
          <form @submit.prevent="saveExpense()">
            <div class="field">
              <label for="expense-description">Description</label>
              <input id="expense-description" x-ref="expenseDescription"
                     x-model="expenseForm.description"
                     placeholder="Yellow fever vaccine" required>
            </div>
            <div class="field">
              <label for="expense-category">Category</label>
              <select id="expense-category" x-model="expenseForm.category">
                <template x-for="cat in categories" :key="cat.value">
                  <option :value="cat.value" x-text="`${cat.icon} ${cat.label}`"></option>
                </template>
              </select>
            </div>

            <!-- Cost and Currency paired on one row, and called Cost, so this
                 reads the same as the Plan form that can create the very same
                 budget row. -->
            <div class="field-row">
              <div class="field">
                <label for="expense-cost">Cost</label>
                <input id="expense-cost" type="number" step="0.01" min="0"
                       x-model="expenseForm.amount" required>
              </div>
              <div class="field">
                <label for="expense-currency">Currency</label>
                <select id="expense-currency" x-model="expenseForm.currency">
                  <template x-for="code in entryCurrencies" :key="code">
                    <option :value="code" x-text="code"></option>
                  </template>
                </select>
              </div>
            </div>

            <div class="field">
              <label id="expense-destination-label">Location (optional)</label>
              <div class="chip-group" role="group" aria-labelledby="expense-destination-label">
                <template x-for="country in tripCountries" :key="country.code">
                  <button type="button" class="chip"
                          :aria-pressed="expenseForm.countryCodes.includes(country.code)"
                          @click="toggleLocation(expenseForm.countryCodes, country.code)"
                          x-text="country.label"></button>
                </template>
                <span class="tiny muted" x-show="!tripCountries.length">No countries yet</span>
              </div>
            </div>
            <div class="field">
              <label for="expense-date">Date (optional)</label>
              <input id="expense-date" type="date" x-model="expenseForm.date" :min="trip.startDate" :max="trip.endDate">
            </div>
            <div class="field">
              <label class="checkbox">
                <input type="checkbox" x-model="expenseForm.charged">
                Expense already charged
              </label>
              <p class="field-hint">
                Leave this unticked for money still to be paid. Pending expenses
                are listed here but left out of the total and the chart, which
                the Forecast options under Show count in.
              </p>
            </div>
            <p class="field-hint" x-show="expenseForm.id && expenseForm.amount">
              Changing the cost on an expense that came from a plan updates that plan's cost too.
            </p>
            <div class="modal-footer">
              <button type="button" class="btn" @click="expenseOpen = false">Cancel</button>
              <button type="submit" class="btn btn-primary" :disabled="expenseBusy"
                      x-text="expenseBusy ? 'Saving…' : 'Save'"></button>
            </div>
          </form>
        </div>
      </div>

      <!-- Confirm publish -->
      <div class="modal-backdrop" x-show="confirmingPublish" x-cloak
           @click.self="confirmingPublish = false" @keydown.escape.window="confirmingPublish = false">
        <div class="modal" role="dialog" aria-modal="true">
          <div class="modal-header">
            <h2 class="modal-title">Publish this trip?</h2>
            <button type="button" class="modal-close" @click="confirmingPublish = false"
                    aria-label="Close">✕</button>
          </div>
          <p class="small">
            Anyone with the link will be able to see this trip — its destinations,
            itinerary, checklist and budget. No sign-in required.
          </p>
          <p class="small muted">You can unpublish at any time.</p>
          <div class="modal-footer">
            <button type="button" class="btn" @click="confirmingPublish = false">Cancel</button>
            <button type="button" class="btn btn-primary" :disabled="publishBusy"
                    @click="doPublish()" x-text="publishBusy ? 'Publishing…' : 'Publish'"></button>
          </div>
        </div>
      </div>

      <!-- Confirm unpublish -->
      <div class="modal-backdrop" x-show="confirmingUnpublish" x-cloak
           @click.self="confirmingUnpublish = false" @keydown.escape.window="confirmingUnpublish = false">
        <div class="modal" role="dialog" aria-modal="true">
          <div class="modal-header">
            <h2 class="modal-title">Unpublish this trip?</h2>
            <button type="button" class="modal-close" @click="confirmingUnpublish = false"
                    aria-label="Close">✕</button>
          </div>
          <p class="small">
            The public page will be taken down and its link will stop working.
            Nothing in the trip itself is deleted, and you can publish again later.
          </p>
          <div class="modal-footer">
            <button type="button" class="btn" @click="confirmingUnpublish = false">Cancel</button>
            <button type="button" class="btn btn-danger" :disabled="publishBusy"
                    @click="doUnpublish()" x-text="publishBusy ? 'Working…' : 'Unpublish'"></button>
          </div>
        </div>
      </div>
    </div>
  </template>
