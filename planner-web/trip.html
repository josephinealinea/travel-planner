<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="trip.tripTravellingLlama">Trip — Travelling Llama</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%99%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/minima.css?v=79"     id="minima-css">
<link rel="stylesheet" href="assets/css/y2k.css?v=79"        id="y2k-css"        disabled>
<link rel="stylesheet" href="assets/css/dark.css?v=79"       id="dark-css"       disabled>
<script>
  // Enable the remembered theme's stylesheet before first paint, so the page
  // never flashes the default theme first.
  (function () {
    var registry = { minima: 'minima-css', y2k: 'y2k-css', dark: 'dark-css' };
    var theme = 'minima';
    try { if (registry[localStorage.getItem('selectedTheme')]) theme = localStorage.getItem('selectedTheme'); } catch (e) {}
    Object.keys(registry).forEach(function (name) {
      var link = document.getElementById(registry[name]);
      if (link) link.disabled = name !== theme;
    });
    document.documentElement.className = 'theme-' + theme;
  })();
</script>
</head>
<body>
<header id="site-header"></header>

<main class="page" x-data="tripPage()" x-init="init()" x-cloak>
  <p class="loading" x-show="loading" data-i18n="trip.loadingTheTrip"></p>
  <div class="alert alert-error" x-show="error && !loading" x-text="error" x-cloak></div>

  <template x-if="!loading && !error">
    <div>
      <!-- ── header ─────────────────────────────── -->
      <div class="trip-head">
        <div>
          <h1 class="trip-head-title">
            <span x-text="trip.title"></span>
            <span class="badge" :class="trip.status === 'PUBLISHED' ? 'badge-published' : 'badge-draft'"
                  x-text="trip.status === 'PUBLISHED' ? $t('status.published') : $t('status.draft')"></span>
            <span class="badge" :class="isOwner ? 'badge-owner' : ''"
                  x-text="isOwner ? $t('role.owner') : $t('role.travelBuddy')"></span>
          </h1>
          <div class="trip-head-meta">
            <span x-text="tripDates()"></span>
            <!--<span x-show="ownerName()"> · owned by <span x-text="ownerName()"></span>--></span>
            <span> · <span x-text="$t('trip.travelBuddiesCount', { count: members.length })"></span></span>
            <span class="scope-switch" role="group" data-i18n-aria-label="trip.show" x-show="canSeeWholeTrip">
              <button type="button" class="chip" :aria-pressed="scope === 'mine'"
                      @click="setScope('mine')" data-i18n="trip.showOnlyMyActivities"></button>
              <button type="button" class="chip" :aria-pressed="scope === 'trip'"
                      @click="setScope('trip')" data-i18n="trip.showWholeTrip"></button>
            </span>
          </div>
        </div>
        <div class="trip-head-actions">
          <a class="btn btn-sm" href="trips.html" data-i18n="trip.allTrips"></a>
          <button type="button" class="btn btn-sm" @click="openEdit()" data-i18n="trip.editTrip"></button>
          <button type="button" class="btn btn-sm btn-danger" x-show="isOwner"
                  @click="deletingTrip = true; deleteConfirm = ''" data-i18n="trip.deleteTrip"></button>
        </div>
      </div>

      <!-- ── tabs ───────────────────────────────── -->
      <div class="tabs" role="tablist" data-i18n-aria-label="trip.tripSections"
           @keydown="onTabKeydown($event)">
        <template x-for="t in tabs" :key="t.id">
          <button type="button" class="tab" role="tab"
                  :id="`tab-${t.id}`" :aria-controls="`panel-${t.id}`"
                  :aria-selected="tab === t.id" :tabindex="tab === t.id ? 0 : -1"
                  @click="selectTab(t.id)">
            <span x-text="t.label"></span>
            <span class="tab-count" x-show="countFor(t.id)" x-text="countFor(t.id)"></span>
          </button>
        </template>
      </div>

      <!-- ══ OVERVIEW ═══════════════════════════ -->
      <section x-show="tab === 'overview'" role="tabpanel" id="panel-overview"
               aria-labelledby="tab-overview" tabindex="0">
        <div class="grid grid-stats" style="margin-bottom:24px">
          <template x-for="stat in stats()" :key="stat.label">
            <div class="stat">
              <div class="stat-value" x-text="stat.value"></div>
              <div class="stat-label" x-text="stat.label"></div>
            </div>
          </template>
        </div>

        <div class="grid grid-2">
          <div class="card">
            <div class="card-header"><h2 class="card-title" data-i18n="trip.upNext"></h2></div>
            <p class="small muted" x-show="!upNext().length" data-i18n="trip.nothingScheduledYet"></p>
            <template x-for="item in upNext()" :key="item.id">
              <div class="needs-planning-row">
                <span x-text="categoryOf(item.category).icon"></span>
                <div class="grow">
                  <div class="small strong" x-text="item.description"></div>
                  <div class="tiny muted" x-text="planWhen(item)"></div>
                </div>
              </div>
            </template>
          </div>

          <div class="card">
            <div class="card-header">
              <h2 class="card-title" data-i18n="trip.needsPlanning"></h2>
              <span class="badge" x-text="needsPlanning().length"></span>
            </div>
            <!-- With no destination there is nothing to plan yet, and nothing
                 on this card to act on — so it offers the first step instead. -->
            <div x-show="!destinations.length">
              <p class="small muted" data-i18n="trip.nothingToPlanYet"></p>
              <button type="button" class="btn btn-sm btn-primary"
                      @click="addFirstDestination()" data-i18n="trip.addYourFirstDestination"></button>
            </div>
            <p class="small muted" x-show="destinations.length && !needsPlanning().length" data-i18n="trip.everythingOnTheChecklist"></p>
            <template x-for="item in needsPlanning()" :key="item.id">
              <div class="needs-planning-row">
                <span x-text="categoryOf(item.category).icon"></span>
                <div class="grow">
                  <div class="small" x-text="item.description"></div>
                  <div class="tiny muted" x-show="countryLabel(item.countryCodes)"
                       x-text="countryLabel(item.countryCodes)"></div>
                </div>
                <button type="button" class="btn btn-sm" @click="planFromOverview(item)"
                        :aria-label="$t('trip.planNamed', { name: item.description })" data-i18n="trip.plan"></button>
              </div>
            </template>
          </div>
        </div>
      </section>

      <!-- ══ MEMBERS ════════════════════════════ -->
      <section x-show="tab === 'members'" role="tabpanel" id="panel-members"
               aria-labelledby="tab-members" tabindex="0">
        <div class="section-head">
          <h2 class="section-title" data-i18n="trip.theHerd"></h2>
        </div>

        <div class="card" style="margin-bottom:16px">
          <div class="alert alert-error" x-show="memberError" x-text="memberError" x-cloak></div>
          <form class="field-inline" @submit.prevent="addMember()">
            <div class="field grow">
              <label for="member-email" data-i18n="trip.addATravelBuddy"></label>
              <input id="member-email" type="email" x-model="memberEmail"
                     data-i18n-placeholder="trip.nameExampleCom" required>
              <p class="field-hint" data-i18n="trip.theyWillGetAn"></p>
            </div>
            <div class="field flex-none" style="align-self:flex-start;padding-top:22px">
              <button type="submit" class="btn btn-primary" :disabled="addingMember"
                      x-text="addingMember ? $t('common.sending') : $t('trip.sendInvite')"></button>
            </div>
          </form>
        </div>

        <!-- Only you so far: the one screen where inviting is the obvious next step. -->
        <p class="solo-hint" x-show="members.length === 1" x-cloak>
          <span aria-hidden="true">🦙</span> <span data-i18n="trip.travellingSoloSoFar"></span>
        </p>

        <div class="table-wrap">
          <table class="table table-cards table-cards-plain">
            <thead>
              <tr><th data-i18n="trip.name"></th><th data-i18n="common.email"></th><th data-i18n="trip.residenceCountry"></th><th data-i18n="trip.added"></th><th class="actions"></th></tr>
            </thead>
            <tbody>
              <template x-for="member in membersSignedInFirst" :key="member.userId">
                <tr>
                  <td class="cell-title">
                    <span class="member-name">
                      <span :class="member.screenName ? '' : 'member-email-only'"
                            x-text="member.displayName"></span>
                      <span class="badge" x-show="!member.hasSignedIn" data-i18n="trip.notSignedInYet"></span>
                      <span class="badge" x-show="member.userId === currentUserId" data-i18n="trip.you"></span>
                    </span>
                  </td>
                  <td class="muted" data-label="Email" x-text="member.emailLabel"></td>
                  <td data-label="Home country" :class="member.homeCountryCode ? '' : 'muted'" x-text="member.homeCountryCode ? (countryFlagOf(member.homeCountryCode) + ' ' + countryNameOf(member.homeCountryCode)).trim() : '-'"></td>
                  <td class="muted tiny" data-label="Added" x-text="addedLabel(member)"></td>
                  <td class="actions">
                    <button type="button" class="btn btn-sm btn-danger"
                            x-show="member.role !== 'OWNER' && (isOwner || isSelf(member))"
                            @click="askRemoveMember(member)"
                            :aria-label="isSelf(member) ? $t('trip.leaveTheHerd') : $t('trip.removeNamedFromTheHerd', { name: member.displayName })"
                            x-text="isSelf(member) ? $t('trip.leaveTheHerdWithLlama') : $t('trip.removeFromTheHerd')"></button>
                    <span class="tiny muted"
                          x-show="member.role === 'OWNER' || (!isOwner && !isSelf(member))"
                          :title="member.role === 'OWNER' ? $t('trip.deleteTheTripInstead') : $t('trip.onlyOwnerRemovesBuddy')" data-i18n="trip.partOfTheHerd"></span>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>

      <!-- ══ DESTINATIONS ═══════════════════════ -->
      <section x-show="tab === 'destinations'" role="tabpanel" id="panel-destinations"
               aria-labelledby="tab-destinations" tabindex="0">
        <div class="section-head">
          <h2 class="section-title"><span data-i18n="trip.grazingGrounds"></span>
            <span class="small muted" data-i18n="trip.whereTheHerdIs"></span>
          </h2>
          <div class="btn-row">
            <!-- Beside Add rather than in a row of its own: it stays put whether
                 or not anything is selected, so ticking the first row never
                 shifts the rows under the pointer. Disabled, never hidden — and
                 left of Add, so the primary action is the rightmost thing on
                 the row on every tab. -->
            <button type="button" class="btn btn-sm btn-danger"
                    x-show="scopedDestinations.length"
                    :disabled="!destSelected.length"
                    @click="destBulkOpen = true">
              <span data-i18n="trip.deleteSelected"></span><span x-show="destSelected.length"
                                   x-text="` (${destSelected.length})`"></span>
            </button>
            <button type="button" class="btn btn-primary btn-sm" @click="openAddDestination()" data-i18n="trip.addDestination"></button>
          </div>
        </div>
        <!--<p class="scope-hint" x-show="hiddenLabel('destinations')" x-cloak>
          Showing your part · <strong x-text="hiddenLabel('destinations')"></strong> on the whole trip ·
          <button type="button" class="btn btn-ghost btn-sm" @click="setScope('trip')">Show whole trip</button>
        </p>-->

        <div class="empty-state" x-show="!scopedDestinations.length">
          <div class="empty-icon">📍</div>
          <h3 class="empty-title" data-i18n="trip.noDestinationsYet"></h3>
          <p class="empty-body" data-i18n="trip.addingOneAutoCreates"></p>
          <button type="button" class="btn btn-primary" @click="openAddDestination()" data-i18n="trip.addYourFirstDestination"></button>
        </div>

        <div class="table-wrap" x-show="scopedDestinations.length">
          <table class="table table-cards">
            <thead>
              <tr>
                <th class="select-cell"><span class="sr-only" data-i18n="trip.select"></span></th>
                <th data-i18n="trip.name"></th><th data-i18n="trip.country"></th><th data-i18n="trip.latLon"></th><th data-i18n="trip.dates"></th>
                <th class="num" data-i18n="trip.days"></th><th class="num" data-i18n="common.checklist"></th><th class="actions"></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="destination in scopedDestinations" :key="destination.id">
                <tr>
                  <td class="select-cell">
                    <label class="select-hit"><input type="checkbox" :checked="isDestSelected(destination.id)"
                           @change="toggleDestSelected(destination.id)"
                           :aria-label="$t('common.selectNamed', { name: destination.name })"></label>
                  </td>
                  <td class="strong cell-title"><span x-text="destination.name"></span>
                    <template x-for="pill in travellerPills('destinations', destination.id)" :key="pill.text">
                    <span class="badge badge-traveller" :title="pill.title" x-text="pill.text"></span>
                  </template></td>
                  <td class="cell-chips">
                    <span class="chip" x-show="destination.countryCode">
                      <span x-text="countryFlagOf(destination.countryCode)"></span>
                      <span x-text="countryNameOf(destination.countryCode)"></span>
                    </span>
                    <span class="muted" x-show="!destination.countryCode">—</span>
                  </td>
                  <td class="mono tiny" data-label="Lat / Lon">
                    <a x-show="mapUrl(destination)" :href="mapUrl(destination)"
                       target="_blank" rel="noopener" x-text="coordinates(destination)"></a>
                    <span x-show="!mapUrl(destination)" class="muted">—</span>
                  </td>
                  <td data-label="Dates" x-text="destinationDates(destination) || '—'"></td>
                  <td class="num" data-label="Days" x-text="daysOf(destination) ? daysOf(destination) + 'D' : '—'"></td>
                  <td class="num" data-label="Checklist" x-text="checklistCountFor(destination)"></td>
                  <td class="actions">
                    <span class="btn-row">
                      <button type="button" class="btn btn-sm"
                              @click="openEditDestination(destination)"
                              :aria-label="$t('common.editNamed', { name: destination.name })" data-i18n="trip.edit"></button>
                    </span>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>

      <!-- ══ CHECKLIST ══════════════════════════ -->
      <section x-show="tab === 'checklist'" role="tabpanel" id="panel-checklist"
               aria-labelledby="tab-checklist" tabindex="0">
        <div class="section-head">
          <h2 class="section-title">
            <span data-i18n="trip.travelChecklist"></span>
            <span class="small muted"
                  x-text="$t('trip.checklistProgress', { done: checkProgress().done, total: checkProgress().total })"></span>
          </h2>
          <div class="btn-row">
            <button type="button" class="btn btn-sm btn-danger"
                    :disabled="!checkSelected.length"
                    @click="checkBulkOpen = true">
              <span data-i18n="trip.deleteSelected"></span><span x-show="checkSelected.length"
                                   x-text="` (${checkSelected.length})`"></span>
            </button>
            <button type="button" class="btn btn-primary btn-sm" @click="openAddCheck()" data-i18n="trip.addChecklistItem"></button>
          </div>
        </div>
        <!--<p class="scope-hint" x-show="hiddenLabel('checklist')" x-cloak>
          Showing your part · <strong x-text="hiddenLabel('checklist')"></strong> on the whole trip ·
          <button type="button" class="btn btn-ghost btn-sm" @click="setScope('trip')">Show whole trip</button>
        </p>-->

        <div class="toolbar">
          <span class="toolbar-label" id="check-category-label" data-i18n="trip.category"></span>
          <div class="chip-group" role="group" aria-labelledby="check-category-label">
            <template x-for="cat in categories" :key="cat.value">
              <button type="button" class="chip"
                      :aria-pressed="checkCategoryFilters.includes(cat.value)"
                      @click="toggleCategoryFilter(cat.value)">
                <span x-text="cat.icon"></span><span x-text="cat.label"></span>
              </button>
            </template>
          </div>

          <span class="toolbar-label" id="check-group-by-label" data-i18n="trip.groupBy"></span>
          <div class="chip-group" role="group" aria-labelledby="check-group-by-label">
            <template x-for="option in checkGroupByOptions" :key="option.value">
              <button type="button" class="chip"
                      :aria-pressed="checkGroupBy === option.value"
                      @click="checkGroupBy = option.value"
                      x-text="option.label"></button>
            </template>
          </div>
        </div>

        <div class="toolbar">
          <span class="toolbar-label" id="check-status-label" data-i18n="trip.status"></span>
          <div class="chip-group" role="group" aria-labelledby="check-status-label">
            <template x-for="option in ['ALL', 'TODO', 'COMPLETED']" :key="option">
              <button type="button" class="chip" :aria-pressed="checkStatusFilter === option"
                      @click="checkStatusFilter = option"
                      x-text="option === 'ALL' ? $t('common.all') : (option === 'TODO' ? $t('trip.toDo') : $t('trip.completed'))"></button>
            </template>
          </div>
        </div>

        <div class="empty-state" x-show="!scopedChecklist.length">
          <div class="empty-icon">🧳</div>
          <h3 class="empty-title" data-i18n="trip.nothingOnTheChecklist"></h3>
          <p class="empty-body" data-i18n="trip.addADestinationTo"></p>
          <button type="button" class="btn btn-primary" @click="openAddCheck()" data-i18n="trip.addAnItem"></button>
        </div>

        <p class="small muted" x-show="scopedChecklist.length && !filteredChecklist.length" data-i18n="trip.nothingMatchesThoseFilters"></p>

        <template x-for="group in checklistGroups" :key="group.title || 'all'">
          <div class="checklist" style="margin-bottom:16px">
            <div class="checklist-group-title" x-show="group.title" x-text="group.title"></div>
            <template x-for="item in group.items" :key="item.id">
              <div class="check-row-wrap">
                <label class="select-box" @click.stop>
                  <input type="checkbox" :checked="isCheckSelected(item.id)"
                         @change="toggleCheckSelected(item.id)"
                         :aria-label="$t('common.selectNamed', { name: item.description })">
                </label>
                <!-- Beside the row, not in it, for the same reason as the
                     select box: the row owns an Edit button, and buttons
                     cannot nest. -->
                <button type="button" class="check-status"
                        :aria-pressed="item.status === 'COMPLETED'"
                        :aria-label="$t('trip.completeNamed', { name: item.description })"
                        :title="item.status === 'COMPLETED' ? $t('trip.markAsToDo') : $t('trip.markComplete')"
                        @click="quickToggle(item, $event)"
                        x-text="item.status === 'COMPLETED' ? '✔️' : '▫️'"></button>
                <!-- A div, not a button: the row carries its own Edit button
                     the way the itinerary and budget rows do, and a button
                     cannot be nested inside another one. Clicking the row
                     still opens the drawer as a convenience. -->
                <div class="check-row" :class="item.status === 'COMPLETED' ? 'is-done' : ''"
                        @click="openChecklistItem(item)">
                <span class="check-main">
                  <span class="check-text" x-text="item.description"></span>
                  <template x-for="name in travellerNameList('checklist', item.id)" :key="name">
                    <span class="badge badge-traveller" x-text="'👥 ' + name"></span>
                  </template>
                  <span class="check-note" x-show="item.note" x-text="item.note"></span>
                  <span class="check-tags">
                    <span class="chip">
                      <span x-text="categoryOf(item.category).icon"></span>
                      <span x-text="categoryOf(item.category).label"></span>
                    </span>
                    <!-- One chip per country. Comma-joining them into a single
                         pill read as one long place name. -->
                    <template x-for="label in countryLabels(item.countryCodes)" :key="label">
                      <span class="chip" x-text="label"></span>
                    </template>
                    <span class="chip" x-show="planCountFor(item)"
                          x-text="$t('trip.plansCount', { count: planCountFor(item) })"></span>
                  </span>
                </span>
                  <span class="check-side btn-row">
                    <button type="button" class="btn btn-sm"
                            @click.stop="openChecklistItem(item)"
                            :aria-label="$t('common.editNamed', { name: item.description })" data-i18n="trip.edit"></button>
                  </span>
                </div>
              </div>
            </template>
          </div>
        </template>
      </section>

      <!-- ══ ITINERARY ══════════════════════════ -->
      <section x-show="tab === 'itinerary'" role="tabpanel" id="panel-itinerary"
               aria-labelledby="tab-itinerary" tabindex="0">
        <div class="section-head">
          <h2 class="section-title"><span data-i18n="trip.theAdventurePlan"></span>
            <span class="small muted" data-i18n="trip.herding"></span>
          </h2>
          <div class="btn-row">
            <button type="button" class="btn btn-sm btn-danger"
                    x-show="itinShow !== 'WEATHER'"
                    :disabled="!itinSelected.length"
                    @click="itinBulkOpen = true">
              <span data-i18n="trip.deleteSelected"></span><span x-show="itinSelected.length"
                                   x-text="` (${itinSelected.length})`"></span>
            </button>
            <button type="button" class="btn btn-primary btn-sm" @click="openAddEntry()" data-i18n="trip.addItineraryItem"></button>
          </div>
        </div>
        <!--<p class="scope-hint" x-show="hiddenLabel('itinerary')" x-cloak>
          Showing your part · <strong x-text="hiddenLabel('itinerary')"></strong> on the whole trip ·
          <button type="button" class="btn btn-ghost btn-sm" @click="setScope('trip')">Show whole trip</button>
        </p>-->

        <div class="toolbar">
          <span class="toolbar-label" id="itin-category-label" data-i18n="trip.category"></span>
          <div class="chip-group" role="group" aria-labelledby="itin-category-label">
            <template x-for="cat in categories" :key="cat.value">
              <button type="button" class="chip"
                      :aria-pressed="itinCategoryFilters.includes(cat.value)"
                      @click="toggleItinCategory(cat.value)">
                <span x-text="cat.icon"></span><span x-text="cat.label"></span>
              </button>
            </template>
          </div>
        </div>
        <div class="toolbar">
          <span class="toolbar-label" id="itin-show-label" data-i18n="trip.show"></span>
          <div class="chip-group" role="group" aria-labelledby="itin-show-label">
            <template x-for="option in ['ALL', 'WEATHER', 'ITINERARY']" :key="option">
              <button type="button" class="chip" :aria-pressed="itinShow === option"
                      @click="itinShow = option"
                      x-text="option === 'ALL' ? $t('common.all') : (option === 'WEATHER' ? $t('trip.weatherOnly') : $t('trip.itineraryOnly'))"></button>
            </template>
          </div>
        </div>

        <p class="tiny muted" x-show="weatherLoading" data-i18n="trip.lookingUpTheWeather"></p>
        <p class="tiny muted" x-show="weatherFailed" data-i18n="trip.theWeatherCouldNot"></p>

        <!-- Only when both halves are empty. With weather rows on screen the
             itinerary is not empty even with nothing planned. -->
        <div class="empty-state" x-show="!scopedItinerary.length && !filteredWeather.length">
          <div class="empty-icon">🗓</div>
          <h3 class="empty-title" data-i18n="trip.nothingPlannedYet"></h3>
          <p class="empty-body" data-i18n="trip.openAChecklistItem"></p>
          <button type="button" class="btn btn-primary" @click="openAddEntry()" data-i18n="trip.addAnEntry"></button>
        </div>

        <div class="empty-state" x-show="itinShow === 'WEATHER' && !filteredWeather.length
                                         && !weatherLoading">
          <div class="empty-icon">🌤</div>
          <h3 class="empty-title" data-i18n="trip.noDaysToShow"></h3>
          <p class="empty-body" data-i18n="trip.aDestinationNeedsA"></p>
        </div>

        <template x-for="day in itineraryDays" :key="day.date || 'undated'">
          <div class="timeline-day">
            <h3 class="timeline-date">
              <span x-text="day.label"></span>
              <span class="timeline-date-count" x-text="dayCount(day)"></span>
            </h3>

            <!-- Where the trip is that day. Not an itinerary entry: nothing
                 here is stored, so there is nothing to select or edit. -->
            <!-- One card per place the trip is that day, in two columns. When
                 the count is odd the first card takes the full width, so the
                 odd one out leads the block instead of dangling at the end.
                 The rule is stated here rather than as a structural CSS
                 selector because x-for leaves its own <template> in the DOM as
                 the first child, so :first-child never matches a card — see
                 CLAUDE.md, Traps. -->
            <div class="weather-locations" x-show="day.weather.length">
              <template x-for="(row, index) in day.weather" :key="row.key">
                <div class="weather-card"
                     :class="index === 0 && day.weather.length % 2 === 1 ? 'weather-card-wide' : ''">
                  <div class="weather-card-head">
                    <span class="weather-place" x-text="weatherPlace(row.day)"></span>
                    <span class="chip" x-show="weatherCountryLabel(row.day)"
                          x-text="weatherCountryLabel(row.day)"></span>
                  </div>

                  <div class="weather-line" x-show="weatherHasReading(row.day)">
                    <span class="weather-icon" x-text="weatherIcon(row.day)"></span>
                    <span class="weather-temps" x-text="weatherTemps(row.day)"></span>
                    <span class="weather-condition" x-show="weatherCondition(row.day)"
                          x-text="weatherCondition(row.day)"></span>
                    <span class="weather-badge" x-show="weatherBadge(row.day)"
                          :class="row.day.source === 'CLIMATE' ? 'weather-badge-typical' : ''"
                          x-text="weatherBadge(row.day)"></span>
                  </div>

                  <div class="weather-details" x-show="weatherHasReading(row.day) && weatherDetails(row.day).length"
                       :title="weatherDetailsTitle(row.day)">
                    <template x-for="chip in weatherDetails(row.day)" :key="chip.id">
                      <span class="weather-detail" :title="chip.title" :aria-label="$t('trip.chipLabel', { text: chip.text, title: chip.title })">
                        <span class="weather-detail-icon" aria-hidden="true" x-text="chip.icon"></span>
                        <span x-text="chip.text"></span>
                      </span>
                    </template>
                  </div>

                  <div class="weather-line weather-line-muted"
                       x-show="!weatherHasReading(row.day)"
                       :title="weatherUnavailableTitle(row.day)"
                       x-text="weatherUnavailableText(row.day)"></div>

                  <div class="weather-note tiny muted" x-show="weatherNote(row.day)"
                       x-text="weatherNote(row.day)"></div>
                </div>
              </template>
            </div>

            <div class="timeline-entries" x-show="day.entries.length">
              <template x-for="entry in day.entries" :key="entry.key">
                <div class="timeline-entry">
                  <label class="select-box select-box-tight">
                    <input type="checkbox" :checked="isItinSelected(entry.item.id)"
                           @change="toggleItinSelected(entry.item.id)"
                           :aria-label="$t('common.selectNamedWhen', { name: entry.item.description, when: planWhen(entry.item) })">
                  </label>
                  <span class="timeline-time" x-text="entryTime(entry)"></span>
                  <div class="timeline-body">
                    <div class="timeline-desc" x-text="entry.item.description"></div>
                    <template x-for="name in travellerNameList('itinerary', entry.item.id)" :key="name">
                    <span class="badge badge-traveller" x-text="'👥 ' + name"></span>
                  </template>
                    <!-- The category reads as one icon-and-label chip here too,
                         the way the checklist and budget rows show it. -->
                    <div class="timeline-meta">
                      <span class="chip">
                        <span x-text="categoryOf(entry.item.category).icon"></span>
                        <span x-text="categoryOf(entry.item.category).label"></span>
                      </span>
                      <template x-for="label in countryLabels(entry.item.countryCodes)" :key="label">
                        <span class="chip" x-text="label"></span>
                      </template>
                      <span x-show="sourceChecklist(entry.item)"
                            x-text="$t('trip.fromChecklistItem', { item: sourceChecklist(entry.item) })"></span>
                    </div>
                  </div>
                  <span class="timeline-cost" x-show="entry.cost" x-text="entryCost(entry)"></span>
                  <span class="timeline-actions btn-row">
                    <button type="button" class="btn btn-sm" @click="openEditEntry(entry.item)"
                            :aria-label="$t('common.editNamedWhen', { name: entry.item.description, when: planWhen(entry.item) })" data-i18n="trip.edit"></button>
                  </span>
                </div>
              </template>
            </div>
          </div>
        </template>
      </section>

      <!-- ══ BUDGET ═════════════════════════════ -->
      <section x-show="tab === 'budget'" role="tabpanel" id="panel-budget"
               aria-labelledby="tab-budget" tabindex="0">
        <div class="section-head">
          <h2 class="section-title"><span data-i18n="trip.theHerdFunds"></span>
            <span class="small muted" data-i18n="trip.keepTrackOfWhat"></span>
          </h2>
          <div class="btn-row">
            <button type="button" class="btn btn-sm btn-danger"
                    :disabled="!budgetSelected.length"
                    @click="budgetBulkOpen = true">
              <span data-i18n="trip.deleteSelected"></span><span x-show="budgetSelected.length"
                                   x-text="` (${budgetSelected.length})`"></span>
            </button>
            <button type="button" class="btn btn-primary btn-sm" @click="openAddExpense()" data-i18n="trip.addExpense"></button>
          </div>
        </div>

        <div class="toolbar">
          <span class="toolbar-label" id="budget-category-label" data-i18n="trip.category"></span>
          <div class="chip-group" role="group" aria-labelledby="budget-category-label">
            <template x-for="cat in categories" :key="cat.value">
              <button type="button" class="chip"
                      :aria-pressed="budgetCategoryFilters.includes(cat.value)"
                      @click="toggleBudgetCategory(cat.value)">
                <span x-text="cat.icon"></span><span x-text="cat.label"></span>
              </button>
            </template>
          </div>
          <!-- One at a time, and it narrows the table only: the figures above
               it follow Group By, not this. -->
          <span class="toolbar-label" id="budget-status-label" data-i18n="trip.status"></span>
          <div class="chip-group" role="group" aria-labelledby="budget-status-label">
            <template x-for="option in ['ALL', 'CHARGED', 'PENDING']" :key="option">
              <button type="button" class="chip" :aria-pressed="budgetStatusFilter === option"
                      @click="setBudgetStatusFilter(option)"
                      x-text="option === 'ALL' ? $t('common.all') : (option === 'CHARGED' ? $t('trip.charged') : $t('trip.pending'))"></button>
            </template>
          </div>
        </div>
        <div class="toolbar">
          <!-- One at a time, unlike the Category filter beside it: these are
               four views of the same money, not four things to combine. The two
               Forecast ones count the expenses nobody has paid yet alongside
               the charges; the plain two count charges only. Every figure on
               the panel below follows this one control. -->
          <span class="toolbar-label" id="budget-show-label" data-i18n="trip.groupBy"></span>
          <div class="chip-group" role="group" aria-labelledby="budget-show-label">
            <template x-for="option in budgetShowOptions" :key="option.value">
              <button type="button" class="chip"
                      :aria-pressed="budgetShow === option.value"
                      @click="budgetShow = option.value"
                      x-text="option.label"></button>
            </template>
          </div>
        </div>

        <!-- Follows what the table lists rather than what the trip holds: a
             member who shares none of its expenses has an empty budget, even
             on a trip full of other people's. -->
        <div class="empty-state" x-show="!myBudgetItems.length">
          <div class="empty-icon">💳</div>
          <h3 class="empty-title" x-text="budget.items.length ? $t('trip.noBillsForYou') : $t('trip.herdHasNotSpent')"></h3>
          <p class="empty-body" x-show="!budget.items.length" data-i18n="trip.putACostOn"></p>
          <p class="empty-body" x-show="budget.items.length" data-i18n="trip.thisTripHasExpenses"></p>
          <button type="button" class="btn btn-primary" @click="openAddExpense()" data-i18n="trip.addAnExpense"></button>
        </div>

        <div x-show="myBudgetItems.length">
          <div class="card" style="margin-bottom:16px">
            <div class="budget-summary">
              <!-- Chart.js draws the pie; the library is vendored in
                   vendor/chart.umd.js, not fetched from a CDN. -->
              <div class="budget-pie" x-effect="renderBudgetPie()"
                   x-show="budgetBreakdown.length">
                <canvas x-ref="budgetPie" role="img"
                        :aria-label="$t(budgetForecast ? (budgetShow.startsWith('country') ? 'trip.chart.forecastSpendByCountry' : 'trip.chart.forecastSpendByCategory') : (budgetShow.startsWith('country') ? 'trip.chart.spendByCountry' : 'trip.chart.spendByCategory'))"></canvas>
              </div>

              <div class="budget-details">
                <div class="budget-total-row">
                  <div class="budget-total-value" x-text="totalLabel()"></div>
                  <!-- Read-only: rates are fetched daily for the whole install
                       (see RatesRefresher), so this only says when they last
                       came in. -->
                  <span class="budget-rates-note" x-text="ratesNote()"></span>
                </div>
                <div class="tiny muted" x-text="totalCaption()"></div>
                <div class="budget-native-totals" x-show="nativeTotalsLabel"
                     x-text="$t('trip.nativeTotals', { amounts: nativeTotalsLabel })"></div>

                <ul class="budget-legend">
                  <template x-for="slice in budgetBreakdown" :key="slice.key">
                    <li class="budget-legend-row">
                      <div class="budget-legend-head">
                        <span class="budget-legend-swatch" :style="`background:${slice.color}`"></span>
                        <span class="budget-legend-label">
                          <span x-text="slice.icon"></span> <span x-text="slice.label"></span>
                        </span>
                        <span class="budget-legend-percent" x-text="barPercent(slice.amount)"></span>
                        <span class="budget-legend-amount"
                              x-text="fmt(slice.amount, budget.totalsCurrency)"></span>
                      </div>
                      <div class="bar-track">
                        <div class="bar-fill"
                             :style="`width:${barWidth(slice.amount)}%;background:${slice.color}`"></div>
                      </div>
                    </li>
                  </template>
                </ul>

                <div class="alert alert-warning" x-show="missingRates.length" style="margin-top:12px">
                  <span data-i18n="trip.notIncludedInTheTotal"></span>
                  <template x-for="code in missingRates" :key="code">
                    <span class="chip" x-text="code"></span>
                  </template>
                </div>
              </div>
            </div>
          </div>

          <p class="small muted" x-show="!filteredBudgetItems.length" data-i18n="trip.nothingMatchesThoseFilters"></p>

          <div class="table-wrap" x-show="filteredBudgetItems.length">
            <table class="table table-cards">
              <thead>
                <tr>
                  <th class="select-cell"><span class="sr-only" data-i18n="trip.select"></span></th>
                  <th data-i18n="trip.description"></th><th data-i18n="trip.category"></th>
                  <th class="num" data-i18n="trip.amount"></th>
                  <th data-i18n="trip.paidBy"></th>
                  <th data-i18n="trip.status"></th>
                  <th data-i18n="trip.date"></th><th data-i18n="trip.source"></th><th class="actions"></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="item in pagedBudgetItems" :key="item.id">
                  <tr>
                    <td class="select-cell">
                      <label class="select-hit"><input type="checkbox" :checked="isBudgetSelected(item.id)"
                             @change="toggleBudgetSelected(item.id)"
                             :aria-label="$t('common.selectNamed', { name: item.description })"></label>
                    </td>
                    <td class="wrap cell-title" x-text="item.description"></td>
                    <!-- Same icon-and-label chip the checklist and itinerary
                         rows use, so a category reads the same everywhere. -->
                    <td class="cell-chips">
                      <div class="chip-group">
                        <span class="chip">
                          <span x-text="categoryOf(item.category).icon"></span>
                          <span x-text="categoryOf(item.category).label"></span>
                        </span>
                        <template x-for="label in countryLabels(item.countryCodes)" :key="label">
                          <span class="chip" x-text="label"></span>
                        </template>
                      </div>
                    </td>
                    <!-- The whole expense, as recorded. The column beside it
                         is this member's part of it — the two differ exactly
                         when more than one name is on the row. Both name their
                         own currency, because they are rarely the same one:
                         the amount is what was spent, the share is converted. -->
                    <td class="num" data-label="Amount">
                      <div x-text="fmt(item.amount, item.currency)"></div>
                      <div class="cell-emphasis tiny" x-show="isSplit(item)"
                           x-text="$t('trip.sharedAmount', { amount: convertedShareOf(item) == null ? '—' : fmt(convertedShareOf(item), budget.totalsCurrency) })"></div>
                    </td>
                    <!-- Who put the money down. Informational only: the share
                         beside it is decided by "Shared by" alone. -->
                    <td data-label="Paid by" x-text="paidByLabel(item)"></td>
                    <!-- A pending row is listed like any other. It is only
                         left out of the total that claims to be money spent. -->
                    <td data-label="Status">
                      <span class="chip" :class="item.status === 'PENDING' ? 'chip-pending' : 'chip-charged'"
                            x-text="statusLabel(item)"></span>
                    </td>
                    <td class="muted" data-label="Date" x-text="expenseDate(item)"></td>
                    <td class="tiny muted" data-label="Source">
                      <span x-show="item.itineraryItemId"
                            :title="sourcePlan(item)" data-i18n="trip.fromPlan"></span>
                      <span x-show="!item.itineraryItemId" data-i18n="trip.manual"></span>
                    </td>
                    <td class="actions">
                      <span class="btn-row">
                        <button type="button" class="btn btn-sm"
                                @click="openEditExpense(item)"
                                :aria-label="$t('common.editNamed', { name: item.description })" data-i18n="trip.edit"></button>
                      </span>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <!-- Shown only when there is more than one page. The figures above
               the table cover every page; only the rows are paged. -->
          <nav class="pager" x-show="budgetPageCount > 1" data-i18n-aria-label="trip.budgetTablePages">
            <span class="pager-status"
                  x-text="$t('trip.pageShowing', { from: budgetPageFrom, to: budgetPageTo, total: filteredBudgetItems.length })"></span>
            <span class="pager-controls">
              <button type="button" class="btn btn-sm" :disabled="budgetCurrentPage <= 1"
                      @click="goToBudgetPage(budgetCurrentPage - 1)" data-i18n="trip.previous"></button>
              <span class="pager-page" aria-live="polite"
                    x-text="$t('trip.pageOf', { page: budgetCurrentPage, count: budgetPageCount })"></span>
              <button type="button" class="btn btn-sm" :disabled="budgetCurrentPage >= budgetPageCount"
                      @click="goToBudgetPage(budgetCurrentPage + 1)" data-i18n="trip.next"></button>
            </span>
          </nav>
        </div>

        <!-- ── Settle Expenses ───────────────────────────────────────────
             Who owes whom, from the charged rows alone. Deliberately not tied
             to the Group by selector above: a forecast debt would be money
             nobody has spent. -->
        <div class="card settle">
          <div class="section-head">
            <h3 class="section-title" id="settle-title" data-i18n="trip.settleTheHerd"></h3>
            <!-- One button for the whole panel while debts are simplified: a
                 simplified payment has no rows of its own, so what there is to
                 show is the member's balance — including when it is already
                 zero, which is the reassurance. -->
            <button type="button" class="btn btn-sm" x-show="settleSimplified" x-cloak
                    aria-haspopup="dialog" data-i18n-aria-label="trip.viewDetailsOfYour"
                    @click="openSettleBalances()" data-i18n="trip.viewDetails"></button>
          </div>
          <p class="settle-note" x-show="!settleSimplified" data-i18n="trip.basedOnTheCharged"></p>
          <p class="settle-note" x-show="settleSimplified" x-cloak data-i18n="trip.basedOnTheChargedExpenses"></p>

          <p class="empty" x-show="!hasOpenSettlements" x-cloak>
            <span data-i18n="trip.allSettledTheHerd"></span> <span aria-hidden="true">🦙</span>
          </p>

          <div class="table-wrap" x-show="hasSettlements" x-cloak>
            <table class="table table-cards table-cards-plain" aria-labelledby="settle-title">
              <thead>
                <tr>
                  <th data-i18n="trip.travelBuddy"></th>
                  <th class="num" x-show="!settleSimplified" data-i18n="trip.owesYou"></th>
                  <th class="num" x-show="!settleSimplified" data-i18n="trip.youOwe"></th>
                  <th class="num" data-i18n="trip.net"></th>
                  <th class="actions"><span class="sr-only" data-i18n="trip.actions"></span></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="row in settleRows" :key="row.otherUserId + row.currency">
                  <tr>
                    <td class="cell-title" x-text="settleMemberName(row.otherUserId)"></td>
                    <td data-label="Owes you" class="num" x-show="!settleSimplified"
                        x-text="fmt(row.owesYou, row.currency)"></td>
                    <td data-label="You owe" class="num" x-show="!settleSimplified"
                        x-text="fmt(row.youOwe, row.currency)"></td>
                    <!-- A "Receive" / "Pay" pill then the amount, rather than a
                         minus sign: the direction is the whole point of this
                         column, and a sign is the one part of a figure a reader
                         skims past. -->
                    <td data-label="Net" class="num">
                      <span class="settle-net">
                        <span class="settle-pill" :class="settleNetClass(row)"
                              x-text="settleNetWord(row)"></span>
                        <span class="settle-net-amount" x-show="settleNetAmount(row)"
                              x-text="settleNetAmount(row)"></span>
                      </span>
                    </td>
                    <td class="actions">
                      <span class="btn-row">
                        <button type="button" class="btn btn-sm" x-show="!settleSimplified"
                                @click="openSettleDetails(row)"
                                :aria-label="$t('trip.viewDetailsNamed', { name: settleSummaryLine(row) })" data-i18n="trip.viewDetails"></button>
                        <!-- Nothing to record against a pair that is square. -->
                        <button type="button" class="btn btn-sm btn-primary" x-show="settleRowOwing(row)"
                                @click="openRecordPayment(row)"
                                :aria-label="$t('trip.recordPaymentNamed', { name: settleSummaryLine(row) })" data-i18n="trip.recordPayment"></button>
                      </span>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <!-- Payments already made. They settle debts and change no figure
               anywhere else, so they live here and not in the expense table. -->
          <div class="settle-payments" x-show="settlePayments.length" x-cloak>
            <h3 class="settle-payments-title" id="settle-payments-title" data-i18n="trip.herdPayments"></h3>
            <ul class="settle-lines" aria-labelledby="settle-payments-title">
              <template x-for="payment in settlePayments" :key="payment.id">
                <li class="settle-line">
                  <span class="settle-line-main">
                    <span class="settle-line-desc" x-text="settlePaymentLine(payment)"></span>
                    <span class="settle-line-meta">
                      <span x-show="payment.date" x-text="payment.date ? expenseDate(payment) : ''"></span>
                      <span x-show="payment.note" x-text="payment.note"></span>
                    </span>
                  </span>
                  <span class="settle-line-amount" x-text="fmt(payment.amount, payment.currency)"></span>
                  <button type="button" class="btn btn-sm" x-show="canManagePayment(payment)"
                          @click="askDeletePayment(payment)"
                          :aria-label="$t('trip.deletePaymentNamed', { name: settlePaymentLine(payment), amount: fmt(payment.amount, payment.currency) })" data-i18n="trip.undo"></button>
                </li>
              </template>
            </ul>
          </div>
        </div>
      </section>

      <!-- ══ PUBLISH ════════════════════════════ -->
      <section x-show="tab === 'publish'" role="tabpanel" id="panel-publish"
               aria-labelledby="tab-publish" tabindex="0">
        <div class="section-head">
          <h2 class="section-title" data-i18n="trip.shareTheJourney"></h2>
        </div>

        <!-- Published -->
        <div class="card" x-show="isPublished" style="margin-bottom:16px">
          <div class="card-header">
            <h3 class="card-title" data-i18n="trip.thisTripIsPublished"></h3>
            <span class="badge badge-published" data-i18n="trip.live"></span>
          </div>
          <div class="publish-actions">
            <button type="button" class="btn btn-sm" x-show="canPublish" :disabled="publishBusy"
                    @click="doPublish()" x-text="publishBusy ? $t('common.working') : $t('trip.republishUpdate')"></button>
            <button type="button" class="btn btn-sm btn-danger" x-show="isOwner"
                    @click="confirmingUnpublish = true" data-i18n="trip.unpublish"></button>
          </div>
          <br />
          <p class="small muted" x-text="$t('trip.publicLinkNote', { when: publishedAtLabel() })">
          </p>
          <div class="publish-url">
            <span x-ref="publicUrl" class="grow" x-text="publish.publicUrl"></span>
            <a class="btn btn-sm" :href="publish.publicUrl" target="_blank" rel="noopener" data-i18n="trip.openPublicPage"></a>
            <button type="button" class="btn btn-sm" @click="copyLink('publicUrl')" data-i18n-aria-label="trip.copyLinkToThe"
                    x-text="copied === 'publicUrl' ? $t('trip.copied') : $t('trip.copyLink')"></button>
          </div>
          <p class="small muted publish-own-page" x-show="publish.myPublicUrl" data-i18n="trip.yourTripPageShowing"></p>
          <div class="publish-url" x-show="publish.myPublicUrl">
            <span x-ref="myPublicUrl" class="grow" x-text="publish.myPublicUrl"></span>
            <a class="btn btn-sm" :href="publish.myPublicUrl"
               target="_blank" rel="noopener" data-i18n="trip.openMyPage"></a>
            <button type="button" class="btn btn-sm" @click="copyLink('myPublicUrl')" data-i18n-aria-label="trip.copyLinkToMy"
                    x-text="copied === 'myPublicUrl' ? $t('trip.copied') : $t('trip.copyLink')"></button>
          </div>
          <div x-show="(publish.personalPageUrls || []).length">
            <p class="small muted publish-own-page" x-text="$t('trip.otherPages', { count: publish.personalPageUrls.length })">
            </p>
            <template x-for="url in publish.personalPageUrls" :key="url">
              <div class="publish-url">
                <span class="grow" x-text="url"></span>
                <a class="btn btn-sm" :href="url" target="_blank" rel="noopener"
                   :aria-label="$t('trip.openPersonalPage', { name: url.split('/').pop() })" data-i18n="common.open"></a>
                <button type="button" class="btn btn-sm" @click="copyPageUrl(url)"
                        :aria-label="$t('trip.copyLinkToPersonalPage', { name: url.split('/').pop() })"
                        x-text="copied === url ? $t('trip.copied') : $t('trip.copyLink')"></button>
              </div>
            </template>
          </div>
        </div>

        <!-- Draft, owner -->
        <div class="card" x-show="!isPublished && canPublish" style="margin-bottom:16px">
          <div class="card-header"><h3 class="card-title" data-i18n="trip.readyToShare"></h3></div>
          <p class="small muted" data-i18n="trip.youCanPublishAt"></p>
          <button type="button" class="btn btn-primary" @click="confirmingPublish = true" data-i18n="trip.publishTrip"></button>
        </div>

        <!-- Draft, non-owner -->
        <div class="card" x-show="!isPublished && !canPublish" style="margin-bottom:16px">
          <div class="card-header"><h3 class="card-title" data-i18n="trip.readyToShare"></h3></div>
          <p class="small muted" data-i18n="trip.sendARequestTo"></p>

          <template x-if="myPendingRequest">
            <div>
              <div class="alert alert-info" x-text="$t('trip.requestedWaitingFor', { owner: ownerName() })">
              </div>
              <button type="button" class="btn btn-sm"
                      @click="cancelRequest(myPendingRequest)" data-i18n="trip.cancelRequest"></button>
            </div>
          </template>

          <template x-if="!myPendingRequest">
            <form @submit.prevent="requestPublish()">
              <div class="field">
                <label for="request-note" data-i18n="trip.noteOptional"></label>
                <input id="request-note" x-model="requestNote"
                       data-i18n-placeholder="trip.readyToShareWith">
              </div>
              <button type="submit" class="btn btn-primary" :disabled="publishBusy"
                      x-text="publishBusy ? $t('common.sending') : $t('trip.requestToPublish')"></button>
            </form>
          </template>
        </div>

        <!-- Pending requests, owner -->
        <div class="card" x-show="isOwner && pendingRequests.length">
          <div class="card-header">
            <h3 class="card-title" data-i18n="trip.publishRequests"></h3>
            <span class="badge badge-pending" x-text="pendingRequests.length"></span>
          </div>
          <template x-for="request in pendingRequests" :key="request.id">
            <div class="publish-request-row">
              <div class="grow">
                <div class="small strong" x-text="request.requestedByDisplayName"></div>
                <div class="tiny muted" x-text="requestedAtLabel(request)"></div>
              </div>
              <span class="btn-row">
                <!-- The page already exists, built in the requester's own theme
                     and settings when they asked. Approving moves it into
                     place unchanged, so this is the last chance to see what
                     goes public. Members only, and not the public URL — there
                     is no public URL until it is approved. -->
                <a class="btn btn-sm" :href="publishPreviewUrl"
                   target="_blank" rel="noopener" data-i18n="trip.preview"></a>
                <button type="button" class="btn btn-sm btn-primary" :disabled="publishBusy"
                        @click="approveRequest(request)" data-i18n="trip.approvePublish"></button>
                <button type="button" class="btn btn-sm btn-danger"
                        @click="rejectRequest(request)" data-i18n="trip.reject"></button>
              </span>
            </div>
          </template>
        </div>

        <div class="card" x-show="requireOwnerApproval && recentRequests.length" style="margin-top:16px">
          <div class="card-header"><h3 class="card-title" data-i18n="trip.recentRequests"></h3></div>
          <template x-for="request in recentRequests" :key="request.id">
            <div class="publish-request-row">
              <div class="grow small">
                <span x-text="request.requestedByDisplayName"></span>
                <span class="tiny muted" x-text="` · ${decidedAtLabel(request)}`"></span>
              </div>
              <span class="badge" x-text="requestStatusLabel(request.status)"></span>
            </div>
          </template>
          <p class="tiny muted" x-show="decidedRequests.length > recentRequests.length"
             x-text="$t('trip.recentRequestsShowing', { shown: recentRequests.length, total: decidedRequests.length })"></p>
        </div>
      </section>

      <!-- ══ CHECKLIST DETAIL DRAWER ════════════ -->
      <div class="drawer-backdrop panel-switchable" x-show="openItem" x-cloak @click.self="requestCloseDrawer()"
           @keydown.escape.window="requestCloseDrawer()">
        <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"
             x-dialog="openItem" x-show="openItem" @click.stop>
          <!-- Kept in the DOM rather than wrapped in x-if, so the selects below
               always have their options before a value is assigned to them. -->
          <div>
            <div>
              <div class="drawer-header">
                <div>
                  <div class="drawer-eyebrow" x-text="categoryOf(openItem?.category).label"></div>
                  <h2 class="drawer-title" id="drawer-title" x-text="openItem?.description"></h2>
                  <span class="badge" :class="openItem?.status === 'COMPLETED' ? 'badge-done' : 'badge-todo'"
                        x-text="openItem?.status === 'COMPLETED' ? $t('trip.completed') : $t('trip.toDo')"></span>
                </div>
                <button type="button" class="modal-close" @click="requestCloseDrawer()" data-i18n-aria-label="common.close">✕</button>
              </div>

              <div class="alert alert-error" x-show="drawerError" x-text="drawerError" x-cloak></div>

              <!-- Raised by requestCloseDrawer(): Escape, the backdrop and ✕
                   used to throw a half-written note away without a word. -->
              <div class="alert alert-warning" role="alert" x-show="drawerDiscardAsk" x-cloak>
                <span data-i18n="trip.youHaveUnsavedChanges"></span>
                <div class="row row-end" style="margin-top:8px">
                  <button type="button" class="btn btn-sm" x-ref="drawerKeepEditing"
                          @click="drawerDiscardAsk = false" data-i18n="trip.keepEditing"></button>
                  <button type="button" class="btn btn-sm btn-danger" @click="closeDrawer()" data-i18n="trip.discard"></button>
                </div>
              </div>

              <!-- edit the item itself -->
              <div class="drawer-section">
                <h3 class="drawer-section-title"></h3>
                <div class="field">
                  <label for="drawer-description" data-i18n="trip.description"></label>
                  <textarea id="drawer-description" x-model="drawerForm.description"
                            maxlength="300"></textarea>
                </div>
                <div class="field">
                  <label for="drawer-note" data-i18n="trip.noteOptional"></label>
                  <textarea id="drawer-note" x-model="drawerForm.note"
                            data-i18n-placeholder="trip.anythingWorthRememberingBooking"></textarea>
                </div>
                <div class="field-row">
                  <div class="field">
                    <label for="drawer-category" data-i18n="trip.category"></label>
                    <select id="drawer-category" x-model="drawerForm.category">
                      <template x-for="cat in categories" :key="cat.value">
                        <option :value="cat.value" x-text="`${cat.icon} ${cat.label}`"></option>
                      </template>
                    </select>
                  </div>
                </div>
                <div class="field">
                  <label id="drawer-destination-label" data-i18n="trip.locationOptional"></label>
                  <div class="chip-group" role="group" aria-labelledby="drawer-destination-label">
                    <template x-for="country in tripCountries" :key="country.code">
                      <button type="button" class="chip"
                              :aria-pressed="drawerForm.countryCodes.includes(country.code)"
                              @click="toggleLocation(drawerForm.countryCodes, country.code)"
                              x-text="country.label"></button>
                    </template>
                    <span class="tiny muted" x-show="!tripCountries.length" data-i18n="trip.noCountriesYet"></span>
                  </div>
                </div>
                <div class="field">
                  <label id="drawer-going-label"><span data-i18n="trip.whoSCarryingThe"></span> <span aria-hidden="true">🦙</span></label>
                  <div class="chip-group" role="group" aria-labelledby="drawer-going-label">
                    <button type="button" class="chip"
                            :aria-pressed="!effectiveTravellers(drawerForm.travellers, checklistInherited(openItem)).length"
                            @click="everyoneGoes(drawerForm.travellers)" data-i18n="trip.everyone"></button>
                    <template x-for="person in tripSharers" :key="person.userId">
                      <button type="button" class="chip"
                              :aria-pressed="effectiveTravellers(drawerForm.travellers, checklistInherited(openItem)).includes(person.userId)"
                              @click="toggleTravellerFollowing(drawerForm.travellers, checklistInherited(openItem), person.userId)"
                              x-text="person.label"></button>
                    </template>
                  </div>
                </div>

              </div>
              <div class="modal-footer">
                <button type="button" class="btn" :disabled="drawerBusy"
                        @click="saveDrawer()" x-text="drawerBusy ? $t('common.saving') : $t('common.saveChanges')"></button>
              </div>

              <!-- plans -->
              <div class="drawer-section">
                <h3 class="drawer-section-title">
                  <span data-i18n="trip.tasks"></span><span x-show="openItemPlans.length" x-text="` (${openItemPlans.length})`"></span>
                </h3>

                <p class="small muted" x-show="!openItemPlans.length && !planOpen">
                  <span aria-hidden="true">🦙</span> <span data-i18n="trip.theLlamaIsReady"></span>
                </p>
                <p class="small muted" x-show="!openItemPlans.length && !planOpen">
                  <span aria-hidden="true">⚠️</span> <span data-i18n="trip.directlyMarkAsComplete"></span>
                </p>

                <template x-for="plan in openItemPlans" :key="plan.id">
                  <div class="plan-card">
                    <div class="plan-when">
                      <span x-text="planWhen(plan)"></span>
                      <span class="chip" x-show="planNights(plan)"
                            x-text="planNights(plan)"></span>
                    </div>
                    <div class="plan-desc" x-text="plan.description"></div>
                    <div class="row row-between">
                      <span class="plan-cost" x-show="plan.cost" x-text="planCost(plan)"></span>
                      <span class="btn-row">
                        <button type="button" class="btn btn-sm" @click="editPlan(plan)"
                                :aria-label="$t('trip.editPlanNamed', { name: plan.description })" data-i18n="trip.edit"></button>
                        <button type="button" class="btn btn-sm btn-danger"
                                @click="deletePlan(plan)"
                                :aria-label="$t('trip.deletePlanNamed', { name: plan.description })" data-i18n="common.delete"></button>
                      </span>
                    </div>
                  </div>
                </template>

                <!-- the Plan form -->
                <div class="card card-tight" x-show="planOpen" x-cloak style="margin-top:12px">
                  <div class="alert alert-error" x-show="planError" x-text="planError" x-cloak></div>

                  <div class="field">
                    <label for="plan-description" data-i18n="trip.description"></label>
                    <input id="plan-description" x-ref="planDescription"
                           x-model="planForm.description" maxlength="300">
                    <p class="field-hint" data-i18n="trip.preFilledAsA"></p>
                  </div>

                  <div class="field">
                    <label id="plan-destination-label" data-i18n="trip.locationOptional"></label>
                    <div class="chip-group" role="group" aria-labelledby="plan-destination-label">
                      <template x-for="country in tripCountries" :key="country.code">
                        <button type="button" class="chip"
                                :aria-pressed="planForm.countryCodes.includes(country.code)"
                                @click="toggleLocation(planForm.countryCodes, country.code)"
                                x-text="country.label"></button>
                      </template>
                      <span class="tiny muted" x-show="!tripCountries.length" data-i18n="trip.noCountriesYet"></span>
                    </div>
                  </div>

                  <div class="field-row">
                    <div class="field">
                      <label for="plan-start-date" data-i18n="common.startDate"></label>
                      <input id="plan-start-date" type="date" x-model="planForm.startDate">
                    </div>
                    <div class="field">
                      <label for="plan-start-time" data-i18n="trip.startTime"></label>
                      <input id="plan-start-time" type="time" x-model="planForm.startTime">
                    </div>
                  </div>
                  <div class="field-row">
                    <div class="field">
                      <label for="plan-end-date" data-i18n="common.endDate"></label>
                      <input id="plan-end-date" type="date" x-model="planForm.endDate">
                    </div>
                    <div class="field">
                      <label for="plan-end-time" data-i18n="trip.endTime"></label>
                      <input id="plan-end-time" type="time" x-model="planForm.endTime">
                    </div>
                  </div>

                  <div class="field">
                    <label id="plan-going-label"><span data-i18n="trip.whoSTakingThis"></span> <span aria-hidden="true">🦙</span></label>
                    <div class="chip-group" role="group" aria-labelledby="plan-going-label">
                      <button type="button" class="chip"
                              :aria-pressed="!effectiveTravellers(planForm.travellers, planInherited()).length"
                              @click="everyoneGoes(planForm.travellers)" data-i18n="trip.everyone"></button>
                      <template x-for="person in tripSharers" :key="person.userId">
                        <button type="button" class="chip"
                                :aria-pressed="effectiveTravellers(planForm.travellers, planInherited()).includes(person.userId)"
                                @click="toggleTravellerFollowing(planForm.travellers, planInherited(), person.userId)"
                                x-text="person.label"></button>
                      </template>
                    </div>
                  </div>

                  <div class="field">
                    <div class="field-row">
                      <div class="field">
                        <label for="plan-cost" data-i18n="trip.totalCostOptional"></label>
                        <input id="plan-cost" type="number" step="0.01" min="0" x-model="planForm.cost">
                      </div>
                      <div class="field">
                        <label for="plan-currency" data-i18n="trip.currency"></label>
                        <select id="plan-currency" x-model="planForm.currency">
                          <template x-for="code in entryCurrencies" :key="code">
                            <option :value="code" x-text="code"></option>
                          </template>
                        </select>
                      </div>
                    </div>
                    <p class="field-hint" style="margin-top:-8px" data-i18n="trip.addedCostCreatesA"></p>
                  </div>

                  <div class="field" x-show="planForm.cost">
                    <label id="plan-paid-by-label" data-i18n="trip.paidBy"></label>
                    <div class="chip-group" role="group" aria-labelledby="plan-paid-by-label">
                      <template x-for="person in tripSharers" :key="person.userId">
                        <button type="button" class="chip"
                                :aria-pressed="planForm.paidByUserId === person.userId"
                                @click="choosePayer(planForm, person.userId)"
                                x-text="person.label"></button>
                      </template>
                      <!-- Unticked by default, the reverse of the budget's own
                       form: a plan is something you intend to do, and its cost
                       is usually money still to leave. -->
                      <label class="checkbox">
                        <input type="checkbox" x-model="planForm.costCharged"
                               @change="chargedToggled(planForm, currentUserId, $event.target.checked)">
                        <span data-i18n="trip.expenseAlreadyCharged"></span>
                      </label>
                    </div>
                  </div>

                  <div class="field" x-show="planForm.cost">
                    <!-- <label id="plan-shared-label">Shared by</label> -->
                    <label id="plan-shared-label"><span data-i18n="trip.whoSChippingIn"></span> <span aria-hidden="true">🦙</span> </label>
                    <div class="chip-group" role="group" aria-labelledby="plan-shared-label">
                      <button type="button" class="chip"
                              :aria-pressed="sharedWithEveryone(planSharersShown())"
                              @click="planForm.sharedTouched = true; shareWithEveryone(planForm.sharedByUserIds)" data-i18n="trip.everyone"></button>
                      <template x-for="person in tripSharers" :key="person.userId">
                        <button type="button" class="chip"
                                :aria-pressed="planSharersShown().includes(person.userId)"
                                @click="togglePlanSharer(person.userId)"
                                x-text="person.label"></button>
                      </template>
                    </div>
                  </div>

                  <div class="field">
                    <label for="plan-note" data-i18n="trip.noteOptional"></label>
                    <textarea id="plan-note" x-model="planForm.note"
                              data-i18n-placeholder="trip.anythingWorthRememberingBooking"></textarea>
                  </div>

                  <div class="row row-end" style="margin-top:12px">
                    <button type="button" class="btn" @click="planOpen = false" data-i18n="common.cancel"></button>
                    <button type="button" class="btn btn-primary" :disabled="planBusy"
                            @click="savePlan()" x-text="planBusy ? $t('common.saving') : $t('trip.savePlan')"></button>
                  </div>
                </div>
              </div>

              <!-- completion and deletion
              <div class="drawer-footer"> -->
              <div class="modal-footer">
                <!-- Planning a completed item is not a thing: reopen it first. -->
                <button type="button" class="btn"
                        x-show="!planOpen && openItem?.status !== 'COMPLETED'"
                        @click="openPlanForm()"
                        x-text="openItemPlans.length ? $t('trip.addAnother') : $t('trip.startToAdd')"></button>
                <!-- <button type="button" class="btn btn-danger" @click="deletingCheck = true">Delete</button> -->
                <button type="button" class="btn btn-primary"
                        x-show="openItem?.status !== 'COMPLETED'"
                        @click="askComplete(openItem)" data-i18n="trip.markThisChecklistTo"></button>
                <button type="button" class="btn"
                        x-show="openItem?.status === 'COMPLETED'"
                        @click="setCheckStatus('TODO')" data-i18n="trip.reopen"></button>
              </div>

              <div class="alert alert-error" x-show="deletingCheck" x-cloak style="margin-top:12px">
                <span data-i18n="trip.deleteThisChecklistItemItsPlans"></span>
                <div class="row row-end" style="margin-top:8px">
                  <button type="button" class="btn btn-sm" @click="deletingCheck = false" data-i18n="trip.keepIt"></button>
                  <button type="button" class="btn btn-sm btn-danger"
                          @click="confirmDeleteCheck()" data-i18n="common.delete"></button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ══ MODALS ═════════════════════════════ -->

      <!-- Edit trip -->
      <div class="modal-backdrop" x-show="editOpen" x-cloak @click.self="editOpen = false"
           @keydown.escape.window="editOpen = false">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-trip-title"
             x-dialog="editOpen">
          <div class="modal-header">
            <h2 class="modal-title" id="edit-trip-title" data-i18n="trip.editTrip"></h2>
            <button type="button" class="modal-close" @click="editOpen = false" data-i18n-aria-label="common.close">✕</button>
          </div>
          <div class="alert alert-error" x-show="editError" x-text="editError" x-cloak></div>
          <form @submit.prevent="saveEdit()">
            <div class="field">
              <label for="edit-title" data-i18n="common.title"></label>
              <input id="edit-title" x-model="editForm.title" maxlength="120" required>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="edit-start" data-i18n="common.startDate"></label>
                <input id="edit-start" type="date" x-model="editForm.startDate" required>
              </div>
              <div class="field">
                <label for="edit-end" data-i18n="common.endDate"></label>
                <input id="edit-end" type="date" x-model="editForm.endDate" required>
              </div>
              <div class="field">
                <label for="edit-currency" data-i18n="trip.budgetCurrency"></label>
                <select id="edit-currency" x-model="editForm.displayCurrency">
                  <template x-for="code in entryCurrencies" :key="code">
                    <option :value="code" x-text="code"></option>
                  </template>
                </select>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn" @click="editOpen = false" data-i18n="common.cancel"></button>
              <button type="submit" class="btn btn-primary" :disabled="editBusy"
                      x-text="editBusy ? $t('common.saving') : $t('common.saveChanges')"></button>
            </div>
          </form>
        </div>
      </div>

      <!-- Delete trip -->
      <div class="modal-backdrop" x-show="deletingTrip" x-cloak @click.self="deletingTrip = false"
           @keydown.escape.window="deletingTrip = false">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="delete-trip-title"
             x-dialog="deletingTrip">
          <div class="modal-header">
            <h2 class="modal-title" id="delete-trip-title" data-i18n="common.deleteThisTrip"></h2>
            <button type="button" class="modal-close" @click="deletingTrip = false" data-i18n-aria-label="common.close">✕</button>
          </div>
          <p class="small" x-html="$th('trip.deleteTripWarning', { title: trip.title })"></p>
          <div class="field">
            <label for="delete-confirm" data-i18n="common.typeTheTripTitle"></label>
            <input id="delete-confirm" x-model="deleteConfirm" :placeholder="trip.title">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn" @click="deletingTrip = false" data-i18n="common.cancel"></button>
            <button type="button" class="btn btn-danger" :disabled="deleteConfirm !== trip.title"
                    @click="confirmDeleteTrip()" data-i18n="trip.deleteTrip"></button>
          </div>
        </div>
      </div>

      <!-- Remove member -->
      <div class="modal-backdrop" x-show="removingMember" x-cloak @click.self="removingMember = null"
           @keydown.escape.window="removingMember = null">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="remove-member-title"
             x-dialog="removingMember">
          <div class="modal-header">
            <h2 class="modal-title" id="remove-member-title"
                x-text="isSelf(removingMember || {}) ? $t('trip.leaveThisTrip') : $t('trip.removeThisTravelBuddy')"></h2>
            <button type="button" class="modal-close" @click="removingMember = null" data-i18n-aria-label="common.close">✕</button>
          </div>
          <p class="small" x-show="removingMember && !isSelf(removingMember)"
